name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
      peeled_commit: ${{ steps.tag.outputs.peeled_commit }}
      release_dir: ${{ steps.tag.outputs.release_dir }}
      authority_sha256: ${{ steps.tag.outputs.authority_sha256 }}
      release_controls_b64: ${{ steps.controls.outputs.release_controls_b64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the event to one annotated remote tag
        id: tag
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          TAG="$GITHUB_REF_NAME"
          RELEASE_DIR="docs/releases/$TAG"
          test -f "$RELEASE_DIR/release-authority-v1.txt"
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          HEAD_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          PEELED_COMMIT="$(git rev-parse "$TAG^{}")"
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$GITHUB_SHA" = "$EVENT_SHA"
          test "$GITHUB_SHA" = "$HEAD_COMMIT"
          test "$HEAD_COMMIT" = "$PEELED_COMMIT"
          test "$TAG_OBJECT" != "$PEELED_COMMIT"
          tag_bytes="$(mktemp)"
          tag_payload="$(mktemp)"
          git cat-file tag "$TAG_OBJECT" > "$tag_bytes"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            my $separator = index($bytes, "\n\n");
            die "annotated tag header/message separator missing\n" if $separator < 0;
            print substr($bytes, $separator + 2);
          ' < "$tag_bytes" > "$tag_payload"
          cmp -- "$tag_payload" "$RELEASE_DIR/release-authority-v1.txt"
          authority_sha256="$(sha256sum "$RELEASE_DIR/release-authority-v1.txt" | awk '{print $1}')"
          test "$(sha256sum "$tag_payload" | awk '{print $1}')" = "$authority_sha256"
          changed_payload="$(mktemp)"
          truncated_payload="$(mktemp)"
          extra_payload="$(mktemp)"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            die "authority payload is empty\n" unless length $bytes;
            substr($bytes, 0, 1) = chr((ord(substr($bytes, 0, 1)) + 1) % 256);
            print $bytes;
          ' < "$RELEASE_DIR/release-authority-v1.txt" > "$changed_payload"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            die "authority payload is too short\n" unless length($bytes) > 1;
            print substr($bytes, 0, -1);
          ' < "$RELEASE_DIR/release-authority-v1.txt" > "$truncated_payload"
          cat "$RELEASE_DIR/release-authority-v1.txt" > "$extra_payload"
          printf '\001' >> "$extra_payload"
          for fixture in "$changed_payload" "$truncated_payload" "$extra_payload"; do
            if cmp -s -- "$fixture" "$RELEASE_DIR/release-authority-v1.txt"; then
              echo "::error::authority payload negative fixture unexpectedly matched its target"
              exit 1
            fi
          done
          mapfile -t REMOTE_TAG < <(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#REMOTE_TAG[@]}" -eq 2
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$TAG_OBJECT"$'\t'"refs/tags/$TAG"
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$PEELED_COMMIT"$'\t'"refs/tags/$TAG^{}"
          mapfile -t immutable_fields < <(gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled, .enforced_by_owner')
          test "${#immutable_fields[@]}" = 2
          test "${immutable_fields[0]}" = true
          case "${immutable_fields[1]}" in true|false) ;; *) exit 1 ;; esac
          {
            echo "version=${TAG#v}"
            echo "tag_object=$TAG_OBJECT"
            echo "peeled_commit=$PEELED_COMMIT"
            echo "release_dir=$RELEASE_DIR"
            echo "authority_sha256=$authority_sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Verify strict authority and exact evidence bytes
        id: authority
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node - "$TAG" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const tag = process.argv[2];
          const version = tag.slice(1);
          const releaseDir = path.join('docs', 'releases', tag);
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const read = (name) => fs.readFileSync(path.join(releaseDir, name));
          const requireLfText = (name, bytes) => {
            assert.ok(bytes.length > 1, name + ' is empty');
            assert.equal(bytes.includes(0x0d), false, name + ' contains CR');
            assert.equal(bytes.subarray(0, 3).equals(Buffer.from([0xef, 0xbb, 0xbf])), false, name + ' has a BOM');
            assert.equal(bytes.at(-1), 0x0a, name + ' lacks its final LF');
            assert.notEqual(bytes.at(-2), 0x0a, name + ' has more than one final LF');
          };
          const evidenceNames = [
            'CHANGELOG.release.md',
            'candidate-assets.v1.json',
            'input-manifest.v1.json',
            'predecessor-assets.v1.json',
            'release-authority-v1.txt',
            'release-body.md',
            'release-plan.md',
            'SHA256SUMS',
          ];
          assert.deepEqual(fs.readdirSync(releaseDir).sort(), [...evidenceNames].sort(), 'release directory members');
          for (const name of evidenceNames) requireLfText(name, read(name));

          const sumNames = evidenceNames.filter((name) => name !== 'SHA256SUMS');
          const checksumLines = read('SHA256SUMS').toString('utf8').trimEnd().split('\n');
          assert.equal(checksumLines.length, sumNames.length, 'SHA256SUMS count');
          const checksums = new Map();
          for (const line of checksumLines) {
            const match = /^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$/.exec(line);
            assert.ok(match, 'invalid SHA256SUMS record');
            assert.ok(sumNames.includes(match[2]), 'unexpected SHA256SUMS member');
            assert.equal(checksums.has(match[2]), false, 'duplicate SHA256SUMS member');
            checksums.set(match[2], match[1]);
          }
          assert.deepEqual([...checksums.keys()], sumNames, 'SHA256SUMS order');
          for (const name of sumNames) assert.equal(sha256(read(name)), checksums.get(name), name + ' digest');

          const manifestBytes = read('input-manifest.v1.json');
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          assert.equal(manifest.schema, 'prepare-agentscommander-release/input-manifest/v1');
          assert.equal(manifest.inputs.candidateTag, tag);
          assert.equal(manifest.inputs.candidateVersion, version);
          assert.equal(manifest.inputs.repository, process.env.GITHUB_REPOSITORY);
          const releaseDirectory = path.posix.join('docs', 'releases', tag);
          const exactPaths = evidenceNames.map((name) => path.posix.join(releaseDirectory, name));
          assert.deepEqual(manifest.contracts.evidenceAvailability.directory, releaseDirectory);
          assert.deepEqual(manifest.contracts.evidenceAvailability.exactPaths, exactPaths);
          const parts = version.split('.');
          const canonicalPlanPath = 'plans/' + manifest.inputs.releaseIssueNumber + '-v' + parts.join('') + '-release-hardening.md';
          assert.deepEqual(
            manifest.contracts.evidenceAvailability.hardeningAllowlist,
            ['.github/workflows/release.yml', ...exactPaths, canonicalPlanPath],
          );
          assert.ok(fs.statSync(canonicalPlanPath).isFile(), 'canonical plan missing');

          const contract = manifest.contracts.reviewSet;
          const reviewNames = [
            'CHANGELOG.release.md',
            'candidate-assets.v1.json',
            'input-manifest.v1.json',
            'predecessor-assets.v1.json',
            'release-body.md',
            'release-plan.md',
          ];
          assert.equal(contract.schema, 'prepare-agentscommander-release/review-set/v1');
          assert.deepEqual(contract.fileOrder, reviewNames);
          assert.deepEqual(contract.fileDigest, { algorithm: 'sha256', encoding: 'lowercase-hex-ascii-64' });
          assert.deepEqual(contract.recordSerialization, {
            construction: 'file-digest-ascii || separator || filename-utf8 || terminator',
            filenameEncoding: 'utf-8',
            interRecordBytes: 'none-beyond-each-record-terminator',
            lengthPrefix: 'none',
            postamble: 'none',
            preamble: 'none',
            separatorHex: '2020',
            terminatorHex: '0a',
          });
          const records = Buffer.concat(reviewNames.map((name) => Buffer.from(sha256(read(name)) + '  ' + name + '\n', 'utf8')));
          const reviewSet = sha256(records);

          const vector = contract.positiveVector;
          const vectorRecords = Buffer.concat(vector.fileOrder.map((name, index) => {
            const entry = vector.files[index];
            assert.equal(entry.name, name);
            const bytes = Buffer.from(entry.contentBase64, 'base64');
            assert.equal(sha256(bytes), entry.sha256);
            return Buffer.from(entry.sha256 + '  ' + name + '\n', 'utf8');
          }));
          assert.equal(vectorRecords.toString('base64'), vector.serializedRecordsBase64);
          assert.equal(sha256(vectorRecords), vector.reviewSetSha256);

          const authorityBytes = read('release-authority-v1.txt');
          const authorityLines = authorityBytes.toString('utf8').split('\n');
          assert.equal(authorityLines.pop(), '', 'authority final LF');
          assert.equal(authorityLines[0], 'release-authority-v1');
          const authorityKeys = [
            'approval-mode',
            'asset-upload-mode',
            'candidate-tag',
            'candidate-version',
            'changelog-source-sha256',
            'input-manifest-sha256',
            'planning-base',
            'planning-base-parents',
            'predecessor-peeled-commit',
            'predecessor-tag',
            'predecessor-tag-object',
            'release-issue',
            'repository',
            'review-set-sha256',
            'scope-source-sha256',
            'tag-binding-mode',
            'workflow-base-blob',
          ];
          assert.equal(authorityLines.length, authorityKeys.length + 1, 'authority field count');
          const authority = {};
          for (const [index, key] of authorityKeys.entries()) {
            const line = authorityLines[index + 1];
            const match = /^([a-z][a-z0-9-]*)=([^\r\n]+)$/.exec(line);
            assert.ok(match, 'malformed authority line');
            assert.equal(match[1], key, 'authority field order');
            assert.equal(Object.hasOwn(authority, key), false, 'duplicate authority field');
            authority[key] = match[2];
          }
          const evidence = manifest.evidence;
          assert.equal(authority['approval-mode'], manifest.inputs.policy.reviewAuthority.mode);
          assert.equal(authority['asset-upload-mode'], manifest.inputs.policy.assetUpload);
          assert.equal(authority['candidate-tag'], tag);
          assert.equal(authority['candidate-version'], version);
          assert.equal(authority['changelog-source-sha256'], manifest.inputs.changelogSource.sha256);
          assert.equal(authority['input-manifest-sha256'], sha256(manifestBytes));
          assert.equal(authority['planning-base'], evidence.remoteMain.sha);
          assert.equal(authority['planning-base-parents'], evidence.remoteMain.parents.join(','));
          assert.equal(authority['predecessor-peeled-commit'], evidence.predecessor.peeledCommit);
          assert.equal(authority['predecessor-tag'], evidence.predecessor.tag);
          assert.equal(authority['predecessor-tag-object'], evidence.predecessor.tagObject);
          assert.equal(authority['release-issue'], manifest.inputs.releaseIssue);
          assert.equal(authority.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(authority['review-set-sha256'], reviewSet);
          assert.equal(authority['scope-source-sha256'], manifest.inputs.scope.sha256);
          assert.equal(authority['tag-binding-mode'], manifest.inputs.policy.tagBinding);
          assert.equal(authority['workflow-base-blob'], evidence.workflow.blobSha);
          assert.equal(manifest.contracts.permissions.assetUpload, 'job-local-contents-write');
          assert.deepEqual(manifest.contracts.permissions.oidcJobs, ['publish-npm']);
          assert.equal(manifest.contracts.releaseFlow.trigger, 'generic-normal-semver');
          assert.equal(manifest.contracts.candidateState.workflowAndRerun, 'exact-existing-object-and-peeled-required');
          assert.equal(manifest.contracts.candidateState.preTag, 'absence-required-and-unambiguous');
          NODE

      - name: Verify synchronized version surfaces
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          npm run version:check
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./npm/package.json').version")" = "$VERSION"

      - name: Prepare numeric release API controls
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          controls="$RUNNER_TEMP/release-controls.sh"
          cat > "$controls" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          release_cli() {
            "${RELEASE_GH_BIN:-gh}" "$@"
          }

          release_title() {
            printf 'Agents Commander %s' "$TAG"
          }

          release_pages() {
            release_cli api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          }

          release_count_exact_tag() {
            node - "$1" "$TAG" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [pagesPath, tag] = process.argv.slice(2);
          const pages = JSON.parse(fs.readFileSync(pagesPath, 'utf8'));
          assert.ok(Array.isArray(pages), 'paginated releases response must be an array');
          const releases = pages.flatMap((page) => {
            assert.ok(Array.isArray(page), 'each paginated releases response must be an array');
            return page;
          });
          process.stdout.write(String(releases.filter((release) => release && release.tag_name === tag).length));
          NODE
          }

          release_select_id_from_pages() {
            local pages_path="$1"
            local state="$2"
            local expected_id="${3:-}"
            node - "$pages_path" "$RELEASE_DIR/release-body.md" "$TAG" "$(release_title)" "$state" "$expected_id" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [pagesPath, bodyPath, tag, title, state, expectedId] = process.argv.slice(2);
          const pages = JSON.parse(fs.readFileSync(pagesPath, 'utf8'));
          assert.ok(Array.isArray(pages), 'paginated releases response must be an array');
          const releases = pages.flatMap((page) => {
            assert.ok(Array.isArray(page), 'each paginated releases response must be an array');
            return page;
          });
          const matches = releases.filter((release) => release && release.tag_name === tag);
          assert.equal(matches.length, 1, 'exact tag must resolve to one release');
          const release = matches[0];
          assert.ok(Number.isSafeInteger(release.id) && release.id > 0, 'release id');
          if (expectedId) assert.equal(String(release.id), expectedId, 'release id drift');
          assert.equal(release.tag_name, tag, 'release tag');
          assert.equal(release.draft, state === 'draft', 'release draft state');
          assert.equal(release.prerelease, false, 'release prerelease state');
          assert.equal(release.name, title, 'release title');
          assert.ok(Buffer.from(release.body, 'utf8').equals(fs.readFileSync(bodyPath)), 'release body bytes');
          assert.equal(release.immutable, state === 'public', 'release immutable state');
          process.stdout.write(String(release.id));
          NODE
          }

          release_validate_object() {
            local release_path="$1"
            local state="$2"
            local expected_id="${3:-}"
            node - "$release_path" "$RELEASE_DIR/release-body.md" "$TAG" "$(release_title)" "$state" "$expected_id" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [releasePath, bodyPath, tag, title, state, expectedId] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          assert.ok(Number.isSafeInteger(release.id) && release.id > 0, 'release id');
          if (expectedId) assert.equal(String(release.id), expectedId, 'release id drift');
          assert.equal(release.tag_name, tag, 'release tag');
          assert.equal(release.draft, state === 'draft', 'release draft state');
          assert.equal(release.prerelease, false, 'release prerelease state');
          assert.equal(release.name, title, 'release title');
          assert.ok(Buffer.from(release.body, 'utf8').equals(fs.readFileSync(bodyPath)), 'release body bytes');
          assert.equal(release.immutable, state === 'public', 'release immutable state');
          process.stdout.write(String(release.id));
          NODE
          }

          release_get_checked() {
            local state="$1"
            local release_id="$2"
            local output="$3"
            local checked_id
            release_cli api --method GET "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$output" || return 1
            checked_id="$(release_validate_object "$output" "$state" "$release_id")" || return 1
            test "$checked_id" = "$release_id" || return 1
          }

          release_resolve_id() {
            local state="$1"
            local expected_id="${2:-}"
            local pages_path
            local release_path
            local release_id
            local checked_id
            pages_path="$(mktemp "$RUNNER_TEMP/release-pages.XXXXXX")"
            release_pages > "$pages_path" || return 1
            release_id="$(release_select_id_from_pages "$pages_path" "$state" "$expected_id")" || return 1
            release_path="$(mktemp "$RUNNER_TEMP/release-object.XXXXXX")"
            release_cli api --method GET "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_path" || return 1
            checked_id="$(release_validate_object "$release_path" "$state" "$release_id")" || return 1
            test "$checked_id" = "$release_id" || return 1
            printf '%s' "$release_id"
          }

          release_create_draft() {
            local payload
            local response
            local created_id
            payload="$(mktemp "$RUNNER_TEMP/release-create.XXXXXX")"
            node - "$payload" "$RELEASE_DIR/release-body.md" "$TAG" "$(release_title)" <<'NODE'
          const fs = require('node:fs');
          const [output, bodyPath, tag, title] = process.argv.slice(2);
          fs.writeFileSync(output, JSON.stringify({
            tag_name: tag,
            name: title,
            body: fs.readFileSync(bodyPath, 'utf8'),
            draft: true,
            prerelease: false,
            generate_release_notes: false,
          }));
          NODE
            response="$(mktemp "$RUNNER_TEMP/release-create-response.XXXXXX")"
            release_cli api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$payload" > "$response"
            created_id="$(release_validate_object "$response" draft)"
            test -n "$created_id"
          }

          release_ensure_draft() {
            local pages_path
            local count
            pages_path="$(mktemp "$RUNNER_TEMP/release-before-create.XXXXXX")"
            release_pages > "$pages_path"
            count="$(release_count_exact_tag "$pages_path")"
            case "$count" in
              0) release_create_draft ;;
              1) ;;
              *)
                echo "::error::duplicate releases exist for $TAG"
                exit 1
                ;;
            esac
            release_resolve_id draft
          }

          release_find_asset_id() {
            local release_path="$1"
            local asset_name="$2"
            node - "$release_path" "$asset_name" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [releasePath, assetName] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const matches = release.assets.filter((asset) => asset.name === assetName);
          assert.ok(matches.length <= 1, 'duplicate release asset name');
          if (matches.length === 1) {
            assert.ok(Number.isSafeInteger(matches[0].id) && matches[0].id > 0, 'release asset id');
            assert.ok(matches[0].size > 0, 'release asset size');
            process.stdout.write(String(matches[0].id));
          }
          NODE
          }

          release_asset_records() {
            local release_path="$1"
            node - "$release_path" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [releasePath] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          assert.ok(Array.isArray(release.assets), 'release assets');
          const names = new Set();
          for (const asset of release.assets) {
            assert.match(asset.name, /^[A-Za-z0-9][A-Za-z0-9._-]*$/, 'release asset name');
            assert.equal(names.has(asset.name), false, 'duplicate release asset name');
            names.add(asset.name);
            assert.ok(Number.isSafeInteger(asset.id) && asset.id > 0, 'release asset id');
            assert.ok(Number.isSafeInteger(asset.size) && asset.size > 0, 'release asset size');
            process.stdout.write(String(asset.id) + '\t' + asset.name + '\n');
          }
          NODE
          }

          release_upload_exact_asset() {
            local file="$1"
            local asset_name
            local expected_id="${EXPECTED_RELEASE_ID:-}"
            local release_id
            local snapshot
            local existing_id
            local encoded_name
            local response
            local verify_dir
            local after_id
            test -s "$file"
            asset_name="$(basename "$file")"
            printf '%s' "$asset_name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'
            release_id="$(release_resolve_id draft "$expected_id")"
            test -z "$expected_id" || test "$release_id" = "$expected_id"
            snapshot="$(mktemp "$RUNNER_TEMP/release-before-asset.XXXXXX")"
            release_get_checked draft "$release_id" "$snapshot"
            existing_id="$(release_find_asset_id "$snapshot" "$asset_name")"
            if [ -z "$existing_id" ]; then
              encoded_name="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$asset_name")"
              response="$(mktemp "$RUNNER_TEMP/release-upload-response.XXXXXX")"
              release_cli api --method POST -H 'Content-Type: application/octet-stream' "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded_name" --input "$file" > "$response"
              node - "$response" "$file" "$asset_name" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [responsePath, filePath, assetName] = process.argv.slice(2);
          const asset = JSON.parse(fs.readFileSync(responsePath, 'utf8'));
          assert.ok(Number.isSafeInteger(asset.id) && asset.id > 0, 'uploaded asset id');
          assert.equal(asset.name, assetName, 'uploaded asset name');
          assert.equal(asset.size, fs.statSync(filePath).size, 'uploaded asset size');
          NODE
            else
              verify_dir="$(mktemp -d "$RUNNER_TEMP/release-asset.XXXXXX")"
              release_cli api --method GET -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" > "$verify_dir/$asset_name"
              cmp -- "$file" "$verify_dir/$asset_name"
            fi
            after_id="$(release_resolve_id draft "$release_id")"
            test "$after_id" = "$release_id"
          }

          release_download_all_assets() {
            local state="$1"
            local release_id="$2"
            local destination="$3"
            local release_path
            local asset_id
            local asset_name
            release_path="$(mktemp "$RUNNER_TEMP/release-download-list.XXXXXX")"
            release_get_checked "$state" "$release_id" "$release_path"
            while IFS=$'\t' read -r asset_id asset_name; do
              test -n "$asset_id"
              test -n "$asset_name"
              release_cli api --method GET -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$destination/$asset_name"
            done < <(release_asset_records "$release_path")
          }

          release_assert_tag_helper_id() {
            local release_id="$1"
            local helper_id
            helper_id="$(release_cli api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
            test "$helper_id" = "$release_id"
          }

          npm_canonical_registry() {
            local candidate="$1"
            node - "$candidate" <<'NODE'
          const assert = require('node:assert/strict');
          const candidate = process.argv[2];
          const canonical = 'https://registry.npmjs.org/';
          try {
            assert.ok(candidate === canonical || candidate === canonical.slice(0, -1), 'only the official npm registry root is allowed');
            const registry = new URL(candidate);
            assert.equal(registry.protocol, 'https:', 'registry scheme');
            assert.equal(registry.hostname, 'registry.npmjs.org', 'registry host');
            assert.equal(registry.port, '', 'registry port');
            assert.equal(registry.username, '', 'registry username');
            assert.equal(registry.password, '', 'registry password');
            assert.equal(registry.pathname, '/', 'registry path');
            assert.equal(registry.search, '', 'registry query');
            assert.equal(registry.hash, '', 'registry fragment');
            assert.equal(registry.toString(), canonical, 'registry canonical form');
            process.stdout.write(canonical);
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }
          NODE
          }

          npm_require_official_registry() {
            local canonical
            canonical="$(npm_canonical_registry "$1")" || return 1
            test "$canonical" = 'https://registry.npmjs.org/'
          }

          npm_reject_config_overrides() {
            if env | cut -d= -f1 | grep -Eiq '^npm_config_'; then
              echo '::error::caller-provided npm configuration override is forbidden'
              return 1
            fi
          }

          npm_reject_tokenless_auth_environment() {
            local name
            for name in NODE_AUTH_TOKEN NPM_TOKEN NPM_AGENTSCOMMANDER NPM_ID_TOKEN SIGSTORE_ID_TOKEN; do
              if printenv "$name" >/dev/null; then
                echo "::error::$name must be absent for npm Trusted Publishing"
                return 1
              fi
            done
            npm_reject_config_overrides
          }

          npm_verify_registry_contract() {
            local controls_path="$1"
            local canonical='https://registry.npmjs.org/'
            if ! env -i PATH="$PATH" bash -c '
              set -euo pipefail
              source "$1"
              test "$(npm_canonical_registry "$2")" = "$3"
            ' -- "$controls_path" "$canonical" "$canonical"; then
              echo '::error::clean-environment canonical npm registry fixture failed'
              return 1
            fi
            local candidate
            for candidate in \
              'http://registry.npmjs.org/' \
              'https://registry.example.invalid/' \
              'https://registry.npmjs.org:443/' \
              'https://user:password@registry.npmjs.org/' \
              'https://registry.npmjs.org/path' \
              'https://registry.npmjs.org/?query=1' \
              'https://registry.npmjs.org/#fragment'; do
              if npm_canonical_registry "$candidate" >/dev/null 2>&1; then
                echo "::error::unsafe npm registry fixture unexpectedly passed: $candidate"
                return 1
              fi
            done
            if NPM_CONFIG_REGISTRY="$canonical" bash -c '
              set -euo pipefail
              source "$1"
              npm_reject_config_overrides
            ' -- "$controls_path" >/dev/null 2>&1; then
              echo '::error::caller npm registry override fixture unexpectedly passed'
              return 1
            fi
          }

          npm_assert_tokenless_npmrc() {
            local npmrc="$1"
            local registry="$2"
            local effective_config
            node - "$npmrc" "$registry" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [npmrc, registry] = process.argv.slice(2);
          assert.equal(fs.readFileSync(npmrc, 'utf8'), `registry=${registry}\n`, 'controlled npmrc contents');
          NODE
            effective_config="$(mktemp "$RUNNER_TEMP/npm-effective-config.XXXXXX")"
            env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG npm --userconfig "$npmrc" config list --json > "$effective_config"
            node - "$effective_config" "$registry" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [configPath, registry] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const authKeys = (value) => Object.keys(value).filter((key) => /(^|[:/])(?:_authToken|_auth|_password|username|email)$/i.test(key));
          assert.equal(config.registry, registry, 'effective npm registry');
          assert.deepEqual(authKeys(config), [], 'effective npm auth configuration');
          assert.throws(() => assert.deepEqual(authKeys({ '//registry.npmjs.org/:_authToken': 'dummy' }), []), 'auth token fixture');
          assert.throws(() => assert.deepEqual(authKeys({ '//registry.npmjs.org/:_auth': 'legacy' }), []), 'legacy auth fixture');
          NODE
          }
          BASH
          chmod 700 "$controls"
          printf 'release_controls_b64=%s\n' "$(base64 < "$controls" | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Verify draft and release identity negative fixtures
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ steps.tag.outputs.release_dir }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          fixtures="$(mktemp -d)"
          node - "$fixtures" "$RELEASE_DIR/release-body.md" "$TAG" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const [directory, bodyPath, tag] = process.argv.slice(2);
          const base = {
            id: 123,
            tag_name: tag,
            draft: true,
            prerelease: false,
            immutable: false,
            name: 'Agents Commander ' + tag,
            body: fs.readFileSync(bodyPath, 'utf8'),
            assets: [],
          };
          const cases = {
            'duplicate-drafts': [base, { ...base, id: 124 }],
            'published-collision': [{ ...base, draft: false, immutable: true }],
            'title-mutation': [{ ...base, name: base.name + ' changed' }],
            'body-mutation': [{ ...base, body: base.body + 'x' }],
            'prerelease-drift': [{ ...base, prerelease: true }],
            'wrong-id': [base],
          };
          for (const [name, releases] of Object.entries(cases)) {
            fs.writeFileSync(path.join(directory, name + '.pages.json'), JSON.stringify([releases]));
            if (releases.length === 1) fs.writeFileSync(path.join(directory, name + '.object.json'), JSON.stringify(releases[0]));
          }
          NODE
          reject_pages() {
            local fixture="$1"
            local expected_id="${2:-}"
            if release_select_id_from_pages "$fixture" draft "$expected_id"; then
              echo "::error::release identity negative fixture unexpectedly passed: $fixture"
              exit 1
            fi
          }
          reject_object() {
            local fixture="$1"
            local expected_id="${2:-}"
            if release_validate_object "$fixture" draft "$expected_id"; then
              echo "::error::release object negative fixture unexpectedly passed: $fixture"
              exit 1
            fi
          }
          reject_pages "$fixtures/duplicate-drafts.pages.json"
          reject_pages "$fixtures/published-collision.pages.json"
          reject_pages "$fixtures/title-mutation.pages.json"
          reject_pages "$fixtures/body-mutation.pages.json"
          reject_pages "$fixtures/prerelease-drift.pages.json"
          reject_pages "$fixtures/wrong-id.pages.json" 124
          reject_object "$fixtures/published-collision.object.json"
          reject_object "$fixtures/title-mutation.object.json"
          reject_object "$fixtures/body-mutation.object.json"
          reject_object "$fixtures/prerelease-drift.object.json"
          reject_object "$fixtures/wrong-id.object.json" 124

      - name: Reject an existing npm version
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          REGISTRY_URL: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          npm_verify_registry_contract "$RUNNER_TEMP/release-controls.sh"
          npm_reject_config_overrides
          npm_require_official_registry "$REGISTRY_URL"
          npm_require_official_registry "$(npm config get registry)"
          package_name="$(node -p "require('./npm/package.json').name")"
          encoded_name="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$package_name")"
          metadata_url="$REGISTRY_URL$encoded_name/$VERSION"
          classify_npm_collision() {
            local curl_exit="$1"
            local status="$2"
            if [ "$curl_exit" -ne 0 ]; then
              echo "::error::registry transport failure while checking $package_name@$VERSION (curl exit $curl_exit)" >&2
              return 1
            fi
            case "$status" in
              200) printf '%s' present ;;
              404) printf '%s' absent ;;
              *)
                echo "::error::registry returned HTTP $status while checking $package_name@$VERSION" >&2
                return 1
                ;;
            esac
          }
          test "$(classify_npm_collision 0 404)" = absent
          for fixture in '6 000 dns' '35 000 tls' '0 401 unauthorized' '0 403 forbidden' '0 500 server-error' '0 418 generic-error'; do
            read -r fixture_exit fixture_status fixture_name <<< "$fixture"
            if classify_npm_collision "$fixture_exit" "$fixture_status" >/dev/null 2>&1; then
              echo "::error::npm collision negative fixture unexpectedly passed: $fixture_name"
              exit 1
            fi
          done
          metadata_file="$(mktemp)"
          curl_exit=0
          status="$(curl --silent --show-error --output "$metadata_file" --write-out '%{http_code}' --proto '=https' --tlsv1.2 "$metadata_url")" || curl_exit=$?
          if ! registry_state="$(classify_npm_collision "$curl_exit" "$status")"; then
            exit 1
          fi
          if [ "$registry_state" = present ]; then
            echo "::error::$package_name@$VERSION is already present in the registry."
            exit 1
          fi
          test "$registry_state" = absent

  release-coordinator:
    name: coordinate the unique draft release
    needs: guard
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebind the guarded annotated tag
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.guard.outputs.tag_object }}
          EXPECTED_PEELED_COMMIT: ${{ needs.guard.outputs.peeled_commit }}
          EXPECTED_AUTHORITY_SHA256: ${{ needs.guard.outputs.authority_sha256 }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          TAG="$GITHUB_REF_NAME"
          test "$RELEASE_DIR" = "docs/releases/$TAG"
          test -f "$RELEASE_DIR/release-authority-v1.txt"
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          HEAD_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          PEELED_COMMIT="$(git rev-parse "$TAG^{}")"
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$GITHUB_SHA" = "$EVENT_SHA"
          test "$GITHUB_SHA" = "$HEAD_COMMIT"
          test "$HEAD_COMMIT" = "$PEELED_COMMIT"
          test "$TAG_OBJECT" != "$PEELED_COMMIT"
          test "$TAG_OBJECT" = "$EXPECTED_TAG_OBJECT"
          test "$PEELED_COMMIT" = "$EXPECTED_PEELED_COMMIT"
          tag_bytes="$(mktemp)"
          tag_payload="$(mktemp)"
          git cat-file tag "$TAG_OBJECT" > "$tag_bytes"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            my $separator = index($bytes, "\n\n");
            die "annotated tag header/message separator missing\n" if $separator < 0;
            print substr($bytes, $separator + 2);
          ' < "$tag_bytes" > "$tag_payload"
          cmp -- "$tag_payload" "$RELEASE_DIR/release-authority-v1.txt"
          test "$(sha256sum "$RELEASE_DIR/release-authority-v1.txt" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          test "$(sha256sum "$tag_payload" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          mapfile -t REMOTE_TAG < <(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#REMOTE_TAG[@]}" -eq 2
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$TAG_OBJECT"$'\t'"refs/tags/$TAG"
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$PEELED_COMMIT"$'\t'"refs/tags/$TAG^{}"
          mapfile -t immutable_fields < <(gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled, .enforced_by_owner')
          test "${#immutable_fields[@]}" = 2
          test "${immutable_fields[0]}" = true
          case "${immutable_fields[1]}" in true|false) ;; *) exit 1 ;; esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Restore numeric release API controls
        shell: bash
        env:
          RELEASE_CONTROLS_B64: ${{ needs.guard.outputs.release_controls_b64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTROLS_B64"
          node - "$RUNNER_TEMP/release-controls.sh" "$RELEASE_CONTROLS_B64" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [output, encoded] = process.argv.slice(2);
          const bytes = Buffer.from(encoded, 'base64');
          assert.ok(bytes.length > 0, 'release controls are empty');
          fs.writeFileSync(output, bytes, { mode: 0o700 });
          assert.equal(fs.readFileSync(output, 'utf8').startsWith('#!/usr/bin/env bash\n'), true, 'release controls header');
          NODE

      - name: Create or recover the unique guarded draft release
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          release_id="$(release_ensure_draft)"
          release_id="$(release_resolve_id draft "$release_id")"
          printf '%s' "$release_id" | grep -Eq '^[1-9][0-9]*$'
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: [guard, release-coordinator]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            producer: windows
            args: '--config src-tauri/tauri.prod.conf.json --bundles nsis'
            raw_source: target/release/agentscommander.exe
            target_dir: target/release
          - name: linux-x86_64
            runner: ubuntu-22.04
            producer: linux-x86_64
            args: '--config src-tauri/tauri.prod.conf.json'
            raw_source: target/release/agentscommander
            target_dir: target/release
          - name: macos-aarch64
            runner: macos-latest
            producer: macos-aarch64
            args: '--config src-tauri/tauri.prod.conf.json --target aarch64-apple-darwin'
            raw_source: target/aarch64-apple-darwin/release/agentscommander
            target_dir: target/aarch64-apple-darwin/release
          - name: macos-x86_64
            runner: macos-latest
            producer: macos-x86_64
            args: '--config src-tauri/tauri.prod.conf.json --target x86_64-apple-darwin'
            raw_source: target/x86_64-apple-darwin/release/agentscommander
            target_dir: target/x86_64-apple-darwin/release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebind the guarded annotated tag
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.guard.outputs.tag_object }}
          EXPECTED_PEELED_COMMIT: ${{ needs.guard.outputs.peeled_commit }}
          EXPECTED_AUTHORITY_SHA256: ${{ needs.guard.outputs.authority_sha256 }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          TAG="$GITHUB_REF_NAME"
          test "$RELEASE_DIR" = "docs/releases/$TAG"
          test -f "$RELEASE_DIR/release-authority-v1.txt"
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          HEAD_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          PEELED_COMMIT="$(git rev-parse "$TAG^{}")"
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$GITHUB_SHA" = "$EVENT_SHA"
          test "$GITHUB_SHA" = "$HEAD_COMMIT"
          test "$HEAD_COMMIT" = "$PEELED_COMMIT"
          test "$TAG_OBJECT" != "$PEELED_COMMIT"
          test "$TAG_OBJECT" = "$EXPECTED_TAG_OBJECT"
          test "$PEELED_COMMIT" = "$EXPECTED_PEELED_COMMIT"
          tag_bytes="$(mktemp)"
          tag_payload="$(mktemp)"
          git cat-file tag "$TAG_OBJECT" > "$tag_bytes"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            my $separator = index($bytes, "\n\n");
            die "annotated tag header/message separator missing\n" if $separator < 0;
            print substr($bytes, $separator + 2);
          ' < "$tag_bytes" > "$tag_payload"
          cmp -- "$tag_payload" "$RELEASE_DIR/release-authority-v1.txt"
          test "$(sha256sum "$RELEASE_DIR/release-authority-v1.txt" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          test "$(sha256sum "$tag_payload" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          mapfile -t REMOTE_TAG < <(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#REMOTE_TAG[@]}" -eq 2
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$TAG_OBJECT"$'\t'"refs/tags/$TAG"
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$PEELED_COMMIT"$'\t'"refs/tags/$TAG^{}"
          mapfile -t immutable_fields < <(gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled, .enforced_by_owner')
          test "${#immutable_fields[@]}" = 2
          test "${immutable_fields[0]}" = true
          case "${immutable_fields[1]}" in true|false) ;; *) exit 1 ;; esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Restore numeric release API controls
        shell: bash
        env:
          RELEASE_CONTROLS_B64: ${{ needs.guard.outputs.release_controls_b64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTROLS_B64"
          node - "$RUNNER_TEMP/release-controls.sh" "$RELEASE_CONTROLS_B64" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [output, encoded] = process.argv.slice(2);
          const bytes = Buffer.from(encoded, 'base64');
          assert.ok(bytes.length > 0, 'release controls are empty');
          fs.writeFileSync(output, bytes, { mode: 0o700 });
          assert.equal(fs.readFileSync(output, 'utf8').startsWith('#!/usr/bin/env bash\n'), true, 'release controls header');
          NODE

      - name: Resolve the unique guarded draft release by numeric ID
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Install Ubuntu release dependencies
        if: matrix.runner == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ startsWith(matrix.name, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target

      - name: Require the official npm registry before dependency installation
        shell: bash
        env:
          REGISTRY_URL: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          npm_reject_config_overrides
          npm_require_official_registry "$REGISTRY_URL"
          npm_require_official_registry "$(npm config get registry)"

      - name: Install frontend dependencies
        shell: bash
        env:
          REGISTRY_URL: https://registry.npmjs.org/
        run: npm ci --registry "$REGISTRY_URL"

      - name: Build package artifacts without release-side effects
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          args: ${{ matrix.args }}

      - name: Pack and smoke the Windows portable archive
        if: matrix.producer == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ledger = Get-Content -Raw "$env:RELEASE_DIR/candidate-assets.v1.json" | ConvertFrom-Json
          $zip = @($ledger.assets | Where-Object { $_.producer -eq 'windows' -and $_.name.EndsWith('.zip') })
          if ($zip.Count -ne 1) { throw 'candidate ledger does not define one Windows portable archive' }
          node scripts/pack-windows-portable.mjs `
            --binary target/release/agentscommander.exe `
            --version $env:VERSION `
            --out $zip[0].name
          if ($LASTEXITCODE -ne 0) { throw 'packing the portable archive failed' }
          pwsh -File scripts/smoke-windows-portable.ps1 -Zip $zip[0].name -ExpectedVersion $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'the portable archive failed its smoke test' }

      - name: Prepare closed producer assets and manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          PRODUCER: ${{ matrix.producer }}
          RAW_SOURCE: ${{ matrix.raw_source }}
          TARGET_DIR: ${{ matrix.target_dir }}
          DRAFT_ID: ${{ steps.release.outputs.release_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ledger_asset() {
            node - "$RELEASE_DIR/candidate-assets.v1.json" "$PRODUCER" "$1" <<'NODE'
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const [ledgerPath, producer, kind] = process.argv.slice(2);
            const assets = JSON.parse(fs.readFileSync(ledgerPath, 'utf8')).assets;
            const direct = assets.filter((asset) => asset.producer === producer && asset.name.startsWith('agentscommander-'));
            let matches;
            if (kind === 'raw') matches = direct.filter((asset) => !asset.name.includes('.'));
            else if (kind === 'portable') matches = assets.filter((asset) => asset.producer === producer && asset.name.endsWith('.zip'));
            else if (kind === 'testable') matches = direct.filter((asset) => asset.name.includes('testeable') && asset.name.endsWith('.exe'));
            else if (kind === 'normal-windows') matches = direct.filter((asset) => !asset.name.includes('testeable') && asset.name.endsWith('.exe'));
            else throw new Error('unknown asset selector');
            assert.equal(matches.length, 1, 'ambiguous ledger asset selector ' + kind);
            process.stdout.write(matches[0].name);
          NODE
          }
          remaining_bundle_assets() {
            node - "$RELEASE_DIR/candidate-assets.v1.json" "$PRODUCER" "$@" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [ledgerPath, producer, ...skip] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const skipped = new Set(skip);
          for (const asset of ledger.assets) {
            if (asset.producer !== producer || skipped.has(asset.name)) continue;
            assert.match(asset.name, /^[A-Za-z0-9][A-Za-z0-9._-]*$/, 'candidate asset name');
            process.stdout.write(asset.name + '\n');
          }
          NODE
          }
          copy_remaining_bundle_assets() {
            local asset_name
            local -a remaining
            local -a matches
            mapfile -t remaining < <(remaining_bundle_assets "$@")
            for asset_name in "${remaining[@]}"; do
              mapfile -t matches < <(find "$TARGET_DIR/bundle" -type f -name "$asset_name" -print)
              test "${#matches[@]}" = 1
              cp -- "${matches[0]}" "$asset_dir/$asset_name"
            done
          }
          asset_dir="$(mktemp -d "$RUNNER_TEMP/producer-assets.XXXXXX")"
          manifest_path="$RUNNER_TEMP/producer-manifest-$PRODUCER.json"
          case "$PRODUCER" in
            windows)
              node scripts/copy-testable-binary.mjs
              normal_name="$(ledger_asset normal-windows)"
              testable_name="$(ledger_asset testable)"
              portable_name="$(ledger_asset portable)"
              cp -- "$RAW_SOURCE" "$asset_dir/$normal_name"
              cp -- target/release/agentscommander_testeable.exe "$asset_dir/$testable_name"
              cp -- "$portable_name" "$asset_dir/$portable_name"
              copy_remaining_bundle_assets "$normal_name" "$testable_name" "$portable_name"
              ;;
            linux-x86_64|macos-aarch64|macos-x86_64)
              raw_name="$(ledger_asset raw)"
              cp -- "$RAW_SOURCE" "$asset_dir/$raw_name"
              copy_remaining_bundle_assets "$raw_name"
              ;;
            *)
              echo "::error::unknown producer $PRODUCER"
              exit 1
              ;;
          esac
          node - "$RELEASE_DIR/candidate-assets.v1.json" "$PRODUCER" "$asset_dir" "$manifest_path" "$TAG" "$DRAFT_ID" "$RUN_ID" "$RUN_ATTEMPT" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const [ledgerPath, producer, assetDir, manifestPath, tag, draftIdText, runId, runAttemptText] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const safeName = (name) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)
            && name !== '.' && name !== '..';
          const expected = ledger.assets.filter((asset) => asset.producer === producer);
          assert.match(draftIdText, /^[1-9][0-9]*$/, 'draft release ID');
          assert.match(runId, /^[1-9][0-9]*$/, 'workflow run ID');
          assert.match(runAttemptText, /^[1-9][0-9]*$/, 'workflow run attempt');
          const draftId = Number(draftIdText);
          const runAttempt = Number(runAttemptText);
          assert.ok(Number.isSafeInteger(draftId), 'safe draft release ID');
          assert.ok(Number.isSafeInteger(runAttempt), 'safe workflow run attempt');
          assert.ok(expected.length > 0, 'producer must own candidate assets');
          assert.equal(new Set(expected.map((asset) => asset.name)).size, expected.length, 'duplicate producer ledger asset');
          for (const asset of expected) {
            assert.equal(asset.state, 'required', 'producer asset state');
            assert.ok(safeName(asset.name), 'unsafe producer asset name');
          }
          const files = fs.readdirSync(assetDir);
          assert.deepEqual([...files].sort(), expected.map((asset) => asset.name).sort(), 'closed local producer asset set');
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const assets = expected.map((asset) => {
            const file = path.join(assetDir, asset.name);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size > 0, 'invalid producer asset ' + asset.name);
            return { name: asset.name, size: stat.size, sha256: digest(file) };
          });
          fs.writeFileSync(manifestPath, JSON.stringify({
            schema: 'agentscommander/release-producer-manifest/v1',
            tag,
            producer,
            draftId,
            runId,
            runAttempt,
            assetCount: assets.length,
            assets,
          }, null, 2) + '\n', { encoding: 'utf8', mode: 0o644 });
          NODE
          printf 'PRODUCER_ASSET_DIR=%s\n' "$asset_dir" >> "$GITHUB_ENV"
          printf 'PRODUCER_MANIFEST=%s\n' "$manifest_path" >> "$GITHUB_ENV"

      - name: Upload exact platform artifacts by the coordinator numeric release ID
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          PRODUCER: ${{ matrix.producer }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          mapfile -t asset_names < <(node - "$RELEASE_DIR/candidate-assets.v1.json" "$PRODUCER" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [ledgerPath, producer] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const assets = ledger.assets.filter((asset) => asset.producer === producer);
          assert.ok(assets.length > 0, 'producer has no ledger assets');
          for (const asset of assets) process.stdout.write(asset.name + '\n');
          NODE
          )
          test "${#asset_names[@]}" -gt 0
          for asset_name in "${asset_names[@]}"; do
            test -s "$PRODUCER_ASSET_DIR/$asset_name"
            release_upload_exact_asset "$PRODUCER_ASSET_DIR/$asset_name"
          done

      - name: Upload the closed successful producer manifest for internal verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: producer-manifest-${{ matrix.producer }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/producer-manifest-${{ matrix.producer }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  checksums:
    name: checksums
    needs: [guard, release-coordinator, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebind the guarded annotated tag
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.guard.outputs.tag_object }}
          EXPECTED_PEELED_COMMIT: ${{ needs.guard.outputs.peeled_commit }}
          EXPECTED_AUTHORITY_SHA256: ${{ needs.guard.outputs.authority_sha256 }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          TAG="$GITHUB_REF_NAME"
          test "$RELEASE_DIR" = "docs/releases/$TAG"
          test -f "$RELEASE_DIR/release-authority-v1.txt"
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          HEAD_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          PEELED_COMMIT="$(git rev-parse "$TAG^{}")"
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$GITHUB_SHA" = "$EVENT_SHA"
          test "$GITHUB_SHA" = "$HEAD_COMMIT"
          test "$HEAD_COMMIT" = "$PEELED_COMMIT"
          test "$TAG_OBJECT" != "$PEELED_COMMIT"
          test "$TAG_OBJECT" = "$EXPECTED_TAG_OBJECT"
          test "$PEELED_COMMIT" = "$EXPECTED_PEELED_COMMIT"
          tag_bytes="$(mktemp)"
          tag_payload="$(mktemp)"
          git cat-file tag "$TAG_OBJECT" > "$tag_bytes"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            my $separator = index($bytes, "\n\n");
            die "annotated tag header/message separator missing\n" if $separator < 0;
            print substr($bytes, $separator + 2);
          ' < "$tag_bytes" > "$tag_payload"
          cmp -- "$tag_payload" "$RELEASE_DIR/release-authority-v1.txt"
          mapfile -t REMOTE_TAG < <(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#REMOTE_TAG[@]}" -eq 2
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$TAG_OBJECT"$'\t'"refs/tags/$TAG"
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$PEELED_COMMIT"$'\t'"refs/tags/$TAG^{}"
          test "$(sha256sum "$RELEASE_DIR/release-authority-v1.txt" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          test "$(sha256sum "$tag_payload" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          mapfile -t immutable_fields < <(gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled, .enforced_by_owner')
          test "${#immutable_fields[@]}" = 2
          test "${immutable_fields[0]}" = true
          case "${immutable_fields[1]}" in true|false) ;; *) exit 1 ;; esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Restore numeric release API controls
        shell: bash
        env:
          RELEASE_CONTROLS_B64: ${{ needs.guard.outputs.release_controls_b64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTROLS_B64"
          node - "$RUNNER_TEMP/release-controls.sh" "$RELEASE_CONTROLS_B64" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [output, encoded] = process.argv.slice(2);
          const bytes = Buffer.from(encoded, 'base64');
          assert.ok(bytes.length > 0, 'release controls are empty');
          fs.writeFileSync(output, bytes, { mode: 0o700 });
          assert.equal(fs.readFileSync(output, 'utf8').startsWith('#!/usr/bin/env bash\n'), true, 'release controls header');
          NODE

      - name: Resolve exact-run producer manifests across workflow attempts
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          PRODUCER_MANIFEST_DIR: ${{ runner.temp }}/producer-manifests
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          printf '%s' "$RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$EXPECTED_RELEASE_ID" | grep -Eq '^[1-9][0-9]*$'
          work_dir="$(mktemp -d)"
          mkdir "$PRODUCER_MANIFEST_DIR"
          gh api --method GET -H 'Accept: application/vnd.github+json' --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$work_dir/artifact-pages.json"
          node - "$work_dir/artifact-pages.json" "$RUN_ID" "$work_dir/selection.json" <<'NODE'
          // manifest-recovery-selection-v1
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const [pagesPath, runId, selectionPath] = process.argv.slice(2);
          assert.match(runId, /^[1-9][0-9]*$/, 'workflow run ID');
          const pages = JSON.parse(fs.readFileSync(pagesPath, 'utf8'));
          assert.ok(Array.isArray(pages) && pages.length > 0, 'artifact API pages');
          const producers = ['windows', 'linux-x86_64', 'macos-aarch64', 'macos-x86_64'];
          const producerSet = new Set(producers);
          const namePattern = /^producer-manifest-(windows|linux-x86_64|macos-aarch64|macos-x86_64)-run-([1-9][0-9]*)-attempt-([1-9][0-9]*)$/;
          const byProducer = new Map(producers.map((producer) => [producer, []]));
          const seenIds = new Set();
          for (const page of pages) {
            assert.ok(page && typeof page === 'object' && Array.isArray(page.artifacts), 'artifact API page');
            for (const artifact of page.artifacts) {
              if (!artifact || typeof artifact.name !== 'string' || !artifact.name.startsWith('producer-manifest-')) continue;
              const match = namePattern.exec(artifact.name);
              assert.ok(match, 'malformed producer manifest artifact name');
              const [, producer, artifactRunId, attemptText] = match;
              assert.ok(producerSet.has(producer), 'producer artifact owner');
              assert.equal(artifactRunId, runId, 'artifact name run ID');
              assert.equal(String(artifact.workflow_run && artifact.workflow_run.id), runId, 'artifact workflow run ID');
              assert.equal(artifact.expired, false, 'producer manifest artifact expired');
              assert.ok(Number.isSafeInteger(artifact.id) && artifact.id > 0, 'producer manifest artifact ID');
              assert.equal(seenIds.has(artifact.id), false, 'duplicate artifact API ID');
              seenIds.add(artifact.id);
              assert.ok(Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes > 0, 'producer manifest artifact size');
              assert.match(artifact.digest, /^sha256:[0-9a-f]{64}$/, 'producer manifest artifact digest');
              const attempt = Number(attemptText);
              assert.ok(Number.isSafeInteger(attempt) && attempt > 0, 'producer manifest attempt');
              byProducer.get(producer).push({
                artifactId: artifact.id,
                digest: artifact.digest,
                producer,
                attempt,
                name: artifact.name,
                size: artifact.size_in_bytes,
              });
            }
          }
          const records = producers.map((producer) => {
            const candidates = byProducer.get(producer);
            assert.ok(candidates.length > 0, 'missing producer manifest artifact ' + producer);
            const latestAttempt = Math.max(...candidates.map((candidate) => candidate.attempt));
            const latest = candidates.filter((candidate) => candidate.attempt === latestAttempt);
            assert.equal(latest.length, 1, 'duplicate latest producer manifest artifact ' + producer);
            return latest[0];
          });
          assert.equal(new Set(records.map((record) => record.artifactId)).size, producers.length, 'closed selected artifact IDs');
          fs.writeFileSync(selectionPath, JSON.stringify({
            schema: 'agentscommander/release-producer-manifest-selection/v1',
            runId,
            records,
          }, null, 2) + '\n', { encoding: 'utf8', mode: 0o600 });
          NODE
          selection_tsv="$work_dir/selection.tsv"
          node - "$work_dir/selection.json" "$selection_tsv" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [selectionPath, outputPath] = process.argv.slice(2);
          const selection = JSON.parse(fs.readFileSync(selectionPath, 'utf8'));
          assert.equal(selection.schema, 'agentscommander/release-producer-manifest-selection/v1');
          assert.match(selection.runId, /^[1-9][0-9]*$/);
          assert.ok(Array.isArray(selection.records) && selection.records.length === 4, 'selected producer manifest count');
          const rows = [];
          for (const record of selection.records) {
            assert.ok(Number.isSafeInteger(record.artifactId) && record.artifactId > 0, 'selected artifact ID');
            assert.match(record.digest, /^sha256:[0-9a-f]{64}$/, 'selected artifact digest');
            assert.match(record.producer, /^(windows|linux-x86_64|macos-aarch64|macos-x86_64)$/, 'selected producer');
            assert.ok(Number.isSafeInteger(record.attempt) && record.attempt > 0, 'selected artifact attempt');
            rows.push([record.artifactId, record.digest, record.producer, record.attempt].join('\t'));
          }
          fs.writeFileSync(outputPath, rows.join('\n') + '\n', { encoding: 'utf8', mode: 0o600 });
          NODE
          while IFS=$'\t' read -r artifact_id artifact_digest producer attempt; do
            test -n "$artifact_id"
            metadata="$work_dir/artifact-$artifact_id.json"
            gh api --method GET -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
            node - "$metadata" "$artifact_id" "$artifact_digest" "$RUN_ID" "$producer" "$attempt" <<'NODE'
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const [metadataPath, artifactIdText, digest, runId, producer, attemptText] = process.argv.slice(2);
            const artifact = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
            assert.equal(artifact.id, Number(artifactIdText), 'resolved producer manifest artifact ID');
            assert.equal(artifact.name, `producer-manifest-${producer}-run-${runId}-attempt-${attemptText}`, 'resolved producer manifest artifact name');
            assert.equal(String(artifact.workflow_run && artifact.workflow_run.id), runId, 'resolved producer manifest workflow run ID');
            assert.equal(artifact.expired, false, 'resolved producer manifest artifact expired');
            assert.equal(artifact.digest, digest, 'resolved producer manifest artifact digest');
            assert.ok(Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes > 0, 'resolved producer manifest artifact size');
          NODE
            archive="$work_dir/artifact-$artifact_id.zip"
            gh api --method GET -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
            test "$(sha256sum "$archive" | awk '{print "sha256:" $1}')" = "$artifact_digest"
            unzip -tqq "$archive"
            mapfile -t archive_names < <(unzip -Z1 "$archive")
            manifest_name="producer-manifest-$producer.json"
            test "${#archive_names[@]}" = 1
            test "${archive_names[0]}" = "$manifest_name"
            unzip -p "$archive" "$manifest_name" > "$PRODUCER_MANIFEST_DIR/$manifest_name"
            test -s "$PRODUCER_MANIFEST_DIR/$manifest_name"
          done < "$selection_tsv"
          node - "$RELEASE_DIR/candidate-assets.v1.json" "$work_dir/selection.json" "$PRODUCER_MANIFEST_DIR" "$TAG" "$EXPECTED_RELEASE_ID" "$RUN_ID" <<'NODE'
          // manifest-recovery-validation-v1
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const [ledgerPath, selectionPath, manifestsDir, tag, draftIdText, runId] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const selection = JSON.parse(fs.readFileSync(selectionPath, 'utf8'));
          const sorted = (items) => [...items].sort();
          assert.match(draftIdText, /^[1-9][0-9]*$/, 'draft release ID');
          const draftId = Number(draftIdText);
          assert.ok(Number.isSafeInteger(draftId), 'safe draft release ID');
          assert.equal(selection.schema, 'agentscommander/release-producer-manifest-selection/v1');
          assert.equal(selection.runId, runId, 'selected workflow run ID');
          assert.ok(Array.isArray(selection.records) && selection.records.length === 4, 'selected producer manifest count');
          const producerAssets = ledger.assets.filter((asset) => asset.producer !== 'checksums');
          const producers = ['windows', 'linux-x86_64', 'macos-aarch64', 'macos-x86_64'];
          assert.deepEqual(sorted([...new Set(producerAssets.map((asset) => asset.producer))]), sorted(producers), 'closed producer matrix');
          const selectedByProducer = new Map();
          for (const record of selection.records) {
            assert.deepEqual(Object.keys(record).sort(), ['artifactId', 'attempt', 'digest', 'name', 'producer', 'size'], 'closed selected artifact record');
            assert.ok(Number.isSafeInteger(record.artifactId) && record.artifactId > 0, 'selected artifact ID');
            assert.match(record.digest, /^sha256:[0-9a-f]{64}$/, 'selected artifact digest');
            assert.ok(Number.isSafeInteger(record.size) && record.size > 0, 'selected artifact size');
            assert.match(record.producer, /^(windows|linux-x86_64|macos-aarch64|macos-x86_64)$/, 'selected producer');
            assert.ok(Number.isSafeInteger(record.attempt) && record.attempt > 0, 'selected artifact attempt');
            assert.equal(record.name, `producer-manifest-${record.producer}-run-${runId}-attempt-${record.attempt}`, 'selected artifact name');
            assert.equal(selectedByProducer.has(record.producer), false, 'duplicate selected producer');
            selectedByProducer.set(record.producer, record);
          }
          assert.deepEqual(sorted([...selectedByProducer.keys()]), sorted(producers), 'complete selected producer set');
          assert.ok(fs.statSync(manifestsDir).isDirectory(), 'producer manifest directory');
          assert.deepEqual(
            sorted(fs.readdirSync(manifestsDir)),
            sorted(producers.map((producer) => `producer-manifest-${producer}.json`)),
            'complete closed producer manifest files',
          );
          const seenAssets = new Set();
          for (const producer of producers) {
            const manifest = JSON.parse(fs.readFileSync(path.join(manifestsDir, `producer-manifest-${producer}.json`), 'utf8'));
            assert.deepEqual(Object.keys(manifest).sort(), ['assetCount', 'assets', 'draftId', 'producer', 'runAttempt', 'runId', 'schema', 'tag'], 'closed producer manifest record');
            assert.equal(manifest.schema, 'agentscommander/release-producer-manifest/v1');
            assert.equal(manifest.tag, tag, 'producer manifest tag');
            assert.equal(manifest.tag, ledger.tag, 'ledger producer manifest tag');
            assert.equal(manifest.producer, producer, 'producer manifest identity');
            assert.equal(manifest.draftId, draftId, 'producer manifest draft release ID');
            assert.equal(manifest.runId, runId, 'producer manifest workflow run ID');
            assert.equal(manifest.runAttempt, selectedByProducer.get(producer).attempt, 'producer manifest selected workflow attempt');
            assert.ok(Array.isArray(manifest.assets), 'producer manifest assets');
            assert.equal(manifest.assetCount, manifest.assets.length, 'producer manifest count');
            const expected = producerAssets.filter((asset) => asset.producer === producer);
            assert.deepEqual(sorted(manifest.assets.map((asset) => asset.name)), sorted(expected.map((asset) => asset.name)), 'closed producer manifest names');
            const names = new Set();
            for (const asset of manifest.assets) {
              assert.deepEqual(Object.keys(asset).sort(), ['name', 'sha256', 'size'], 'closed producer manifest asset record');
              assert.equal(names.has(asset.name), false, 'duplicate producer manifest asset');
              names.add(asset.name);
              assert.equal(seenAssets.has(asset.name), false, 'duplicate asset across producer manifests');
              seenAssets.add(asset.name);
              assert.ok(Number.isSafeInteger(asset.size) && asset.size > 0, 'producer manifest size');
              assert.match(asset.sha256, /^[0-9a-f]{64}$/, 'producer manifest digest');
            }
          }
          assert.deepEqual(sorted([...seenAssets]), sorted(producerAssets.map((asset) => asset.name)), 'closed producer manifest asset names');
          NODE

      - name: Verify closed producer manifests against the guarded draft assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          PRODUCER_MANIFEST_DIR: ${{ runner.temp }}/producer-manifests
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          work_dir="$(mktemp -d)"
          downloads="$work_dir/downloads"
          mkdir "$downloads"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          release_get_checked draft "$release_id" "$work_dir/release.json"
          release_download_all_assets draft "$release_id" "$downloads"
          node - "$RELEASE_DIR/candidate-assets.v1.json" "$work_dir/release.json" "$downloads" "$PRODUCER_MANIFEST_DIR" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const [ledgerPath, releasePath, downloads, manifestsDir] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const safeName = (name) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)
            && name !== '.' && name !== '..';
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sorted = (items) => [...items].sort();
          assert.equal(ledger.schema, 'prepare-agentscommander-release/asset-ledger/v1');
          assert.equal(ledger.kind, 'candidate');
          assert.equal(ledger.assetCount, ledger.assets.length);
          assert.equal(ledger.assetCount, 17, 'closed public release asset count');
          const checksumAssets = ledger.assets.filter((asset) => asset.producer === 'checksums');
          assert.equal(checksumAssets.length, 1, 'candidate ledger must define one checksum asset');
          const checksumName = checksumAssets[0].name;
          const producerAssets = ledger.assets.filter((asset) => asset.producer !== 'checksums');
          assert.equal(producerAssets.length, 16, 'closed producer asset count');
          const producers = [...new Set(producerAssets.map((asset) => asset.producer))];
          assert.deepEqual(sorted(producers), ['linux-x86_64', 'macos-aarch64', 'macos-x86_64', 'windows'], 'closed producer matrix');
          const expectedManifestFiles = producers.map((producer) => `producer-manifest-${producer}.json`);
          assert.ok(fs.statSync(manifestsDir).isDirectory(), 'producer manifest directory');
          assert.deepEqual(sorted(fs.readdirSync(manifestsDir)), sorted(expectedManifestFiles), 'complete closed producer manifest set');
          const expectedByProducer = new Map(producers.map((producer) => [
            producer,
            producerAssets.filter((asset) => asset.producer === producer),
          ]));
          const manifestAssets = new Map();
          for (const producer of producers) {
            const manifest = JSON.parse(fs.readFileSync(path.join(manifestsDir, `producer-manifest-${producer}.json`), 'utf8'));
            assert.equal(manifest.schema, 'agentscommander/release-producer-manifest/v1');
            assert.equal(manifest.tag, ledger.tag, 'producer manifest tag');
            assert.equal(manifest.producer, producer, 'producer manifest identity');
            assert.equal(manifest.assetCount, manifest.assets.length, 'producer manifest count');
            const expected = expectedByProducer.get(producer);
            assert.deepEqual(sorted(manifest.assets.map((asset) => asset.name)), sorted(expected.map((asset) => asset.name)), 'closed producer manifest names');
            const names = new Set();
            for (const asset of manifest.assets) {
              assert.ok(safeName(asset.name), 'unsafe producer manifest asset');
              assert.equal(names.has(asset.name), false, 'duplicate producer manifest asset');
              names.add(asset.name);
              assert.ok(Number.isSafeInteger(asset.size) && asset.size > 0, 'producer manifest size');
              assert.match(asset.sha256, /^[0-9a-f]{64}$/, 'producer manifest digest');
              assert.equal(manifestAssets.has(asset.name), false, 'duplicate asset across producer manifests');
              manifestAssets.set(asset.name, asset);
            }
          }
          assert.deepEqual(sorted(manifestAssets.keys()), sorted(producerAssets.map((asset) => asset.name)), 'closed producer manifest asset names');
          assert.equal(release.tag_name, ledger.tag);
          assert.equal(release.draft, true);
          const apiAssets = new Map();
          for (const asset of release.assets) {
            assert.ok(safeName(asset.name), 'unsafe draft asset name');
            assert.equal(apiAssets.has(asset.name), false, 'duplicate draft asset name');
            assert.ok(Number.isSafeInteger(asset.id) && asset.id > 0, 'invalid draft asset id');
            assert.ok(Number.isSafeInteger(asset.size) && asset.size > 0, 'invalid draft asset size');
            apiAssets.set(asset.name, asset);
          }
          const allowedNames = sorted([...manifestAssets.keys(), checksumName]);
          const apiNames = sorted(apiAssets.keys());
          assert.ok(
            JSON.stringify(apiNames) === JSON.stringify(sorted(manifestAssets.keys()))
              || JSON.stringify(apiNames) === JSON.stringify(allowedNames),
            'draft assets must be producer assets with an optional prior checksum ledger',
          );
          assert.deepEqual(sorted(fs.readdirSync(downloads)), apiNames, 'downloaded draft asset names');
          for (const [name, expected] of manifestAssets) {
            const apiAsset = apiAssets.get(name);
            assert.ok(apiAsset, 'producer asset absent from draft release ' + name);
            assert.equal(apiAsset.size, expected.size, 'draft API size ' + name);
            const file = path.join(downloads, name);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink(), 'invalid downloaded producer asset ' + name);
            assert.equal(stat.size, expected.size, 'downloaded producer size ' + name);
            assert.equal(digest(file), expected.sha256, 'downloaded producer digest ' + name);
          }
          NODE

      - name: Build and upload the runtime checksum ledger without replacement
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          PRODUCER_MANIFEST_DIR: ${{ runner.temp }}/producer-manifests
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          work_dir="$(mktemp -d)"
          downloads="$work_dir/downloads"
          mkdir "$downloads"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          release_get_checked draft "$release_id" "$work_dir/release-before.json"
          release_download_all_assets draft "$release_id" "$downloads"
          sum_name="$(node - "$RELEASE_DIR/candidate-assets.v1.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ledger = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const matches = ledger.assets.filter((asset) => asset.producer === 'checksums');
          assert.equal(matches.length, 1, 'candidate ledger must define one checksum asset');
          process.stdout.write(matches[0].name);
          NODE
          )"
          node - "$RELEASE_DIR/candidate-assets.v1.json" "$work_dir/release-before.json" "$downloads" "$sum_name" "$PRODUCER_MANIFEST_DIR" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const [ledgerPath, releasePath, downloads, sumName, manifestsDir] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const safeName = (name) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)
            && name !== '.' && name !== '..';
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(ledger.schema, 'prepare-agentscommander-release/asset-ledger/v1');
          assert.equal(ledger.kind, 'candidate');
          assert.equal(ledger.assetCount, ledger.assets.length);
          assert.equal(ledger.assetCount, 17, 'closed public release asset count');
          assert.equal(ledger.assets.filter((asset) => asset.name === sumName).length, 1);
          const expected = ledger.assets.map((asset) => {
            assert.equal(asset.state, 'required');
            assert.equal(asset.sha256, null);
            assert.equal(asset.size, null);
            assert.ok(safeName(asset.name), 'unsafe ledger asset name');
            return asset.name;
          });
          assert.equal(new Set(expected).size, expected.length, 'duplicate ledger asset name');
          const expectedWithoutSum = expected.filter((name) => name !== sumName);
          const producerAssets = ledger.assets.filter((asset) => asset.producer !== 'checksums');
          assert.equal(producerAssets.length, 16, 'closed producer asset count');
          assert.equal(release.tag_name, ledger.tag);
          assert.equal(release.draft, true);
          assert.ok(Number.isInteger(release.id) && release.id > 0);
          const apiNames = release.assets.map((asset) => {
            assert.ok(safeName(asset.name), 'unsafe release asset name');
            assert.ok(Number.isInteger(asset.id) && asset.id > 0, 'invalid release asset id');
            assert.ok(asset.size > 0, 'zero-size release asset');
            return asset.name;
          });
          assert.equal(new Set(apiNames).size, apiNames.length, 'duplicate draft release asset name');
          const sorted = (items) => [...items].sort();
          const producers = [...new Set(producerAssets.map((asset) => asset.producer))];
          assert.deepEqual(sorted(producers), ['linux-x86_64', 'macos-aarch64', 'macos-x86_64', 'windows'], 'closed producer matrix');
          assert.ok(fs.statSync(manifestsDir).isDirectory(), 'producer manifest directory');
          assert.deepEqual(
            sorted(fs.readdirSync(manifestsDir)),
            sorted(producers.map((producer) => `producer-manifest-${producer}.json`)),
            'complete closed producer manifest set',
          );
          const manifestAssets = new Map();
          for (const producer of producers) {
            const manifest = JSON.parse(fs.readFileSync(path.join(manifestsDir, `producer-manifest-${producer}.json`), 'utf8'));
            assert.equal(manifest.schema, 'agentscommander/release-producer-manifest/v1');
            assert.equal(manifest.tag, ledger.tag, 'producer manifest tag');
            assert.equal(manifest.producer, producer, 'producer manifest identity');
            assert.equal(manifest.assetCount, manifest.assets.length, 'producer manifest count');
            const expectedNames = producerAssets.filter((asset) => asset.producer === producer).map((asset) => asset.name);
            assert.deepEqual(sorted(manifest.assets.map((asset) => asset.name)), sorted(expectedNames), 'closed producer manifest names');
            for (const asset of manifest.assets) {
              assert.ok(safeName(asset.name), 'unsafe producer manifest asset');
              assert.ok(Number.isSafeInteger(asset.size) && asset.size > 0, 'producer manifest size');
              assert.match(asset.sha256, /^[0-9a-f]{64}$/, 'producer manifest digest');
              assert.equal(manifestAssets.has(asset.name), false, 'duplicate producer manifest asset');
              manifestAssets.set(asset.name, asset);
            }
          }
          assert.deepEqual(sorted(manifestAssets.keys()), sorted(expectedWithoutSum), 'closed producer manifest asset names');
          const acceptable = [
            sorted(expectedWithoutSum),
            sorted(expected),
          ].some((items) => JSON.stringify(items) === JSON.stringify(sorted(apiNames)));
          assert.ok(acceptable, 'draft assets do not match the candidate ledger');
          const files = fs.readdirSync(downloads);
          assert.deepEqual(sorted(files), sorted(apiNames), 'downloaded draft assets');
          for (const name of files) {
            const file = path.join(downloads, name);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size > 0, 'invalid downloaded asset ' + name);
          }
          const apiAssets = new Map(release.assets.map((asset) => [asset.name, asset]));
          for (const [name, record] of manifestAssets) {
            const apiAsset = apiAssets.get(name);
            assert.ok(apiAsset, 'producer asset absent from draft release ' + name);
            assert.equal(apiAsset.size, record.size, 'draft API size ' + name);
            const file = path.join(downloads, name);
            assert.equal(fs.statSync(file).size, record.size, 'downloaded producer size ' + name);
            assert.equal(digest(file), record.sha256, 'downloaded producer digest ' + name);
          }
          const records = expectedWithoutSum.map((name) => digest(path.join(downloads, name)) + '  ' + name);
          const runtimeLedger = records.join('\n') + '\n';
          const existing = path.join(downloads, sumName);
          if (fs.existsSync(existing)) assert.equal(fs.readFileSync(existing, 'utf8'), runtimeLedger, 'existing runtime checksum ledger');
          fs.writeFileSync(path.join(path.dirname(downloads), sumName), runtimeLedger, { encoding: 'utf8', mode: 0o644 });
          NODE
          release_upload_exact_asset "$work_dir/$sum_name"

      - name: Verify the exact draft asset set and runtime checksum ledger
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          work_dir="$(mktemp -d)"
          downloads="$work_dir/downloads"
          mkdir "$downloads"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          release_get_checked draft "$release_id" "$work_dir/release-after.json"
          release_download_all_assets draft "$release_id" "$downloads"
          node - "$RELEASE_DIR/candidate-assets.v1.json" "$work_dir/release-after.json" "$downloads" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const [ledgerPath, releasePath, downloads] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const safeName = (name) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)
            && name !== '.' && name !== '..';
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sumAsset = ledger.assets.filter((asset) => asset.producer === 'checksums');
          assert.equal(sumAsset.length, 1, 'candidate ledger checksum asset');
          const sumName = sumAsset[0].name;
          const expected = ledger.assets.map((asset) => {
            assert.ok(safeName(asset.name), 'unsafe ledger asset name');
            return asset.name;
          });
          assert.equal(ledger.assetCount, expected.length);
          assert.equal(new Set(expected).size, expected.length, 'duplicate ledger asset name');
          assert.equal(release.tag_name, ledger.tag);
          assert.equal(release.draft, true);
          const apiNames = release.assets.map((asset) => {
            assert.ok(Number.isInteger(asset.id) && asset.id > 0, 'invalid release asset id');
            assert.ok(asset.size > 0, 'zero-size release asset');
            return asset.name;
          });
          assert.equal(new Set(apiNames).size, apiNames.length, 'duplicate release asset name');
          assert.deepEqual([...apiNames].sort(), [...expected].sort(), 'exact 17-name draft ledger');
          const files = fs.readdirSync(downloads);
          assert.deepEqual([...files].sort(), [...expected].sort(), 'downloaded exact draft ledger');
          const records = [];
          for (const name of expected.filter((name) => name !== sumName)) {
            const file = path.join(downloads, name);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size > 0, 'invalid asset ' + name);
            records.push(digest(file) + '  ' + name);
          }
          assert.equal(fs.readFileSync(path.join(downloads, sumName), 'utf8'), records.join('\n') + '\n');
          NODE

  publish-github:
    name: publish-github
    needs: [guard, release-coordinator, checksums]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebind the guarded annotated tag
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.guard.outputs.tag_object }}
          EXPECTED_PEELED_COMMIT: ${{ needs.guard.outputs.peeled_commit }}
          EXPECTED_AUTHORITY_SHA256: ${{ needs.guard.outputs.authority_sha256 }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          TAG="$GITHUB_REF_NAME"
          test "$RELEASE_DIR" = "docs/releases/$TAG"
          test -f "$RELEASE_DIR/release-authority-v1.txt"
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          HEAD_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          PEELED_COMMIT="$(git rev-parse "$TAG^{}")"
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$GITHUB_SHA" = "$EVENT_SHA"
          test "$GITHUB_SHA" = "$HEAD_COMMIT"
          test "$HEAD_COMMIT" = "$PEELED_COMMIT"
          test "$TAG_OBJECT" != "$PEELED_COMMIT"
          test "$TAG_OBJECT" = "$EXPECTED_TAG_OBJECT"
          test "$PEELED_COMMIT" = "$EXPECTED_PEELED_COMMIT"
          tag_bytes="$(mktemp)"
          tag_payload="$(mktemp)"
          git cat-file tag "$TAG_OBJECT" > "$tag_bytes"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            my $separator = index($bytes, "\n\n");
            die "annotated tag header/message separator missing\n" if $separator < 0;
            print substr($bytes, $separator + 2);
          ' < "$tag_bytes" > "$tag_payload"
          cmp -- "$tag_payload" "$RELEASE_DIR/release-authority-v1.txt"
          mapfile -t REMOTE_TAG < <(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#REMOTE_TAG[@]}" -eq 2
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$TAG_OBJECT"$'\t'"refs/tags/$TAG"
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$PEELED_COMMIT"$'\t'"refs/tags/$TAG^{}"
          test "$(sha256sum "$RELEASE_DIR/release-authority-v1.txt" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          test "$(sha256sum "$tag_payload" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          mapfile -t immutable_fields < <(gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled, .enforced_by_owner')
          test "${#immutable_fields[@]}" = 2
          test "${immutable_fields[0]}" = true
          case "${immutable_fields[1]}" in true|false) ;; *) exit 1 ;; esac

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Restore numeric release API controls
        shell: bash
        env:
          RELEASE_CONTROLS_B64: ${{ needs.guard.outputs.release_controls_b64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTROLS_B64"
          node - "$RUNNER_TEMP/release-controls.sh" "$RELEASE_CONTROLS_B64" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const [output, encoded] = process.argv.slice(2);
          const bytes = Buffer.from(encoded, 'base64');
          assert.ok(bytes.length > 0, 'release controls are empty');
          fs.writeFileSync(output, bytes, { mode: 0o700 });
          assert.equal(fs.readFileSync(output, 'utf8').startsWith('#!/usr/bin/env bash\n'), true, 'release controls header');
          NODE

      - name: Verify the dynamic immediate immutable predecessor
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          candidate_release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$candidate_release_id" = "$EXPECTED_RELEASE_ID"
          tags_file="$(mktemp)"
          git ls-remote --tags --refs origin 'refs/tags/v*' > "$tags_file"
          predecessor_tag="$(node - "$TAG" "$tags_file" <<'NODE'
          const assert = require('node:assert/strict');
          const target = process.argv[2];
          const tagsPath = process.argv[3];
          const parse = (tag) => {
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(tag);
            return match ? match.slice(1).map(Number) : null;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };
          const targetVersion = parse(target);
          assert.ok(targetVersion, 'candidate tag is not normal SemVer');
          const tags = [];
          for (const line of require('node:fs').readFileSync(tagsPath, 'utf8').trim().split('\n')) {
            if (!line) continue;
            const match = /^[0-9a-f]{40}\trefs\/tags\/(v[^\t]+)$/.exec(line);
            assert.ok(match, 'malformed remote tag record');
            const version = parse(match[1]);
            if (version) tags.push({ tag: match[1], version });
          }
          assert.equal(new Set(tags.map((entry) => entry.tag)).size, tags.length, 'duplicate normal SemVer tag');
          const eligible = tags.filter((entry) => compare(entry.version, targetVersion) < 0);
          assert.ok(eligible.length > 0, 'normal SemVer predecessor is absent');
          eligible.sort((left, right) => compare(right.version, left.version));
          process.stdout.write(eligible[0].tag);
          NODE
          )"
          test -n "$predecessor_tag"
          git fetch --force --no-tags origin "refs/tags/$predecessor_tag:refs/tags/$predecessor_tag"
          predecessor_object="$(git rev-parse "$predecessor_tag^{tag}")"
          predecessor_peeled="$(git rev-parse "$predecessor_tag^{}")"
          test "$predecessor_object" != "$predecessor_peeled"
          mapfile -t predecessor_remote < <(git ls-remote origin "refs/tags/$predecessor_tag" "refs/tags/$predecessor_tag^{}")
          test "${#predecessor_remote[@]}" -eq 2
          printf '%s\n' "${predecessor_remote[@]}" | grep -Fx "$predecessor_object"$'\t'"refs/tags/$predecessor_tag"
          printf '%s\n' "${predecessor_remote[@]}" | grep -Fx "$predecessor_peeled"$'\t'"refs/tags/$predecessor_tag^{}"
          work_dir="$(mktemp -d)"
          predecessor_release_id="$(node - "$RELEASE_DIR/predecessor-assets.v1.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ledger = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.ok(Number.isSafeInteger(ledger.releaseId) && ledger.releaseId > 0, 'predecessor release id');
          process.stdout.write(String(ledger.releaseId));
          NODE
          )"
          gh api --method GET "repos/$GITHUB_REPOSITORY/releases/$predecessor_release_id" > "$work_dir/release.json"
          downloads="$work_dir/downloads"
          mkdir "$downloads"
          while IFS=$'\t' read -r asset_id asset_name; do
            test -n "$asset_id"
            test -n "$asset_name"
            gh api --method GET -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$downloads/$asset_name"
          done < <(node - "$RELEASE_DIR/predecessor-assets.v1.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const ledger = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const asset of ledger.assets) {
            assert.ok(Number.isSafeInteger(asset.id) && asset.id > 0, 'predecessor asset id');
            assert.match(asset.name, /^[A-Za-z0-9][A-Za-z0-9._-]*$/, 'predecessor asset name');
            process.stdout.write(String(asset.id) + '\t' + asset.name + '\n');
          }
          NODE
          )
          node - "$RELEASE_DIR/input-manifest.v1.json" "$RELEASE_DIR/predecessor-assets.v1.json" "$work_dir/release.json" "$downloads" "$predecessor_tag" "$predecessor_object" "$predecessor_peeled" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const [manifestPath, ledgerPath, releasePath, downloads, predecessorTag, predecessorObject, predecessorPeeled] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const safeName = (name) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)
            && name !== '.' && name !== '..';
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(manifest.evidence.predecessor.tag, predecessorTag);
          assert.equal(manifest.evidence.predecessor.tagObject, predecessorObject);
          assert.equal(manifest.evidence.predecessor.peeledCommit, predecessorPeeled);
          assert.equal(ledger.schema, 'prepare-agentscommander-release/asset-ledger/v1');
          assert.equal(ledger.kind, 'predecessor');
          assert.equal(ledger.tag, predecessorTag);
          assert.equal(ledger.assetCount, ledger.assets.length);
          assert.equal(release.id, ledger.releaseId);
          assert.equal(release.tag_name, predecessorTag);
          assert.equal(release.draft, false);
          assert.equal(release.immutable, true);
          const expected = new Map(ledger.assets.map((asset) => {
            assert.ok(safeName(asset.name), 'unsafe predecessor asset name');
            assert.ok(Number.isInteger(asset.id) && asset.id > 0, 'invalid predecessor asset id');
            assert.ok(Number.isInteger(asset.size) && asset.size > 0, 'invalid predecessor asset size');
            assert.match(asset.sha256, /^[0-9a-f]{64}$/);
            return [asset.name, asset];
          }));
          assert.equal(expected.size, ledger.assets.length, 'duplicate predecessor ledger name');
          assert.equal(release.assets.length, expected.size, 'predecessor release asset count');
          for (const asset of release.assets) {
            const expectedAsset = expected.get(asset.name);
            assert.ok(expectedAsset, 'unexpected predecessor release asset ' + asset.name);
            assert.equal(asset.id, expectedAsset.id, 'predecessor asset id ' + asset.name);
            assert.equal(asset.size, expectedAsset.size, 'predecessor asset size ' + asset.name);
          }
          const files = fs.readdirSync(downloads);
          assert.deepEqual([...files].sort(), [...expected.keys()].sort(), 'downloaded predecessor assets');
          for (const [name, asset] of expected) {
            const file = path.join(downloads, name);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size === asset.size, 'invalid predecessor file ' + name);
            assert.equal(digest(file), asset.sha256, 'predecessor digest ' + name);
          }
          NODE

      - name: Verify the guarded draft and all candidate assets before publication
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          work_dir="$(mktemp -d)"
          downloads="$work_dir/downloads"
          mkdir "$downloads"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          release_get_checked draft "$release_id" "$work_dir/release.json"
          release_download_all_assets draft "$release_id" "$downloads"
          node - "$RELEASE_DIR/candidate-assets.v1.json" "$work_dir/release.json" "$downloads" <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const [ledgerPath, releasePath, downloads] = process.argv.slice(2);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const safeName = (name) => /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)
            && name !== '.' && name !== '..';
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sums = ledger.assets.filter((asset) => asset.producer === 'checksums');
          assert.equal(sums.length, 1, 'candidate checksum asset');
          const sumName = sums[0].name;
          const expected = ledger.assets.map((asset) => {
            assert.ok(safeName(asset.name), 'unsafe candidate asset name');
            return asset.name;
          });
          assert.equal(ledger.assetCount, expected.length);
          assert.equal(new Set(expected).size, expected.length, 'duplicate candidate ledger name');
          assert.equal(release.tag_name, ledger.tag);
          assert.equal(release.draft, true);
          assert.equal(release.immutable, false);
          const apiNames = release.assets.map((asset) => {
            assert.ok(Number.isInteger(asset.id) && asset.id > 0, 'invalid candidate asset id');
            assert.ok(asset.size > 0, 'zero-size candidate asset');
            return asset.name;
          });
          assert.equal(new Set(apiNames).size, apiNames.length, 'duplicate candidate release name');
          assert.deepEqual([...apiNames].sort(), [...expected].sort(), 'exact candidate release names');
          const files = fs.readdirSync(downloads);
          assert.deepEqual([...files].sort(), [...expected].sort(), 'downloaded candidate release names');
          const records = [];
          for (const name of expected.filter((name) => name !== sumName)) {
            const file = path.join(downloads, name);
            const stat = fs.lstatSync(file);
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size > 0, 'invalid candidate file ' + name);
            records.push(digest(file) + '  ' + name);
          }
          assert.equal(fs.readFileSync(path.join(downloads, sumName), 'utf8'), records.join('\n') + '\n');
          NODE

      - name: Revalidate tag, authority, and release policy immediately before publication
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.guard.outputs.tag_object }}
          EXPECTED_PEELED_COMMIT: ${{ needs.guard.outputs.peeled_commit }}
          EXPECTED_AUTHORITY_SHA256: ${{ needs.guard.outputs.authority_sha256 }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          TAG="$GITHUB_REF_NAME"
          test "$RELEASE_DIR" = "docs/releases/$TAG"
          test -f "$RELEASE_DIR/release-authority-v1.txt"
          HEAD_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          PEELED_COMMIT="$(git rev-parse "$TAG^{}")"
          TAG_OBJECT="$(git rev-parse "$TAG^{tag}")"
          test "$GITHUB_SHA" = "$EVENT_SHA"
          test "$GITHUB_SHA" = "$HEAD_COMMIT"
          test "$HEAD_COMMIT" = "$PEELED_COMMIT"
          test "$TAG_OBJECT" != "$PEELED_COMMIT"
          test "$TAG_OBJECT" = "$EXPECTED_TAG_OBJECT"
          test "$PEELED_COMMIT" = "$EXPECTED_PEELED_COMMIT"
          tag_bytes="$(mktemp)"
          tag_payload="$(mktemp)"
          git cat-file tag "$TAG_OBJECT" > "$tag_bytes"
          perl -0777 -e '
            binmode STDIN;
            binmode STDOUT;
            local $/;
            my $bytes = <STDIN>;
            my $separator = index($bytes, "\n\n");
            die "annotated tag header/message separator missing\n" if $separator < 0;
            print substr($bytes, $separator + 2);
          ' < "$tag_bytes" > "$tag_payload"
          cmp -- "$tag_payload" "$RELEASE_DIR/release-authority-v1.txt"
          mapfile -t REMOTE_TAG < <(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test "${#REMOTE_TAG[@]}" -eq 2
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$TAG_OBJECT"$'\t'"refs/tags/$TAG"
          printf '%s\n' "${REMOTE_TAG[@]}" | grep -Fx "$PEELED_COMMIT"$'\t'"refs/tags/$TAG^{}"
          test "$(sha256sum "$RELEASE_DIR/release-authority-v1.txt" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          test "$(sha256sum "$tag_payload" | awk '{print $1}')" = "$EXPECTED_AUTHORITY_SHA256"
          mapfile -t immutable_fields < <(gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled, .enforced_by_owner')
          test "${#immutable_fields[@]}" = 2
          test "${immutable_fields[0]}" = true
          case "${immutable_fields[1]}" in true|false) ;; *) exit 1 ;; esac

      - name: Publish only the verified guarded draft
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ needs.guard.outputs.release_dir }}
          EXPECTED_RELEASE_ID: ${{ needs.release-coordinator.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-controls.sh"
          release_id="$(release_resolve_id draft "$EXPECTED_RELEASE_ID")"
          test "$release_id" = "$EXPECTED_RELEASE_ID"
          response="$(mktemp "$RUNNER_TEMP/release-publish-response.XXXXXX")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false --raw-field make_latest=true > "$response"
          response_id="$(release_validate_object "$response" public "$release_id")"
          test "$response_id" = "$release_id"
          published_id="$(release_resolve_id public "$release_id")"
          test "$published_id" = "$release_id"


  verify-release:

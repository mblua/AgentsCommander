name: Release

# One paved path from a tag to production:
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# ...produces a published GitHub Release with every platform asset and a
# matching @mblua/agentscommander@X.Y.Z on the public npm registry.
#
# Job order is load-bearing. npm/install.js resolves its binaries from
#   https://github.com/<repo>/releases/download/vX.Y.Z/<asset>
# and that URL 404s while the release is still a draft, so npm must not be
# published until publish-github has flipped the release out of draft.
#
# This workflow is deliberately version-agnostic. Never pin it to a single
# tag; a release pipeline that only knows how to ship one version is not a
# release pipeline.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Fail before spending 40 minutes of matrix build time on a bad tag.
  # ---------------------------------------------------------------------
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tag must match every version location in the tree
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"

          # Every version location (package.json, package-lock.json, Cargo.toml,
          # Cargo.lock, tauri.conf.json, npm/package.json, npm/install.js) must
          # already agree with each other.
          npm run version:check

          manifest="$(node -p "require('./package.json').version")"
          npm_manifest="$(node -p "require('./npm/package.json').version")"

          if [ "$manifest" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json version $manifest."
            echo "::error::Run 'npm run version:bump -- $version', merge, then retag."
            exit 1
          fi
          if [ "$npm_manifest" != "$version" ]; then
            echo "::error::npm/package.json is at $npm_manifest but the tag is $TAG."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $TAG"

      - name: Version must not already exist on npm
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # npm versions are immutable. Catch the collision now rather than
          # after the GitHub Release is already published.
          if npm view "@mblua/agentscommander@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@mblua/agentscommander@$VERSION is already published. Bump and retag."
            exit 1
          fi
          echo "@mblua/agentscommander@$VERSION is free."

  # ---------------------------------------------------------------------
  # Build every platform and upload into a DRAFT release.
  # ---------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }}${{ matrix.label && format(' {0}', matrix.label) || '' }})
    needs: guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--config src-tauri/tauri.prod.conf.json --bundles nsis'
          - platform: ubuntu-22.04
            args: '--config src-tauri/tauri.prod.conf.json'
          - platform: macos-latest
            label: aarch64
            args: '--config src-tauri/tauri.prod.conf.json --target aarch64-apple-darwin'
          - platform: macos-latest
            label: x86_64
            args: '--config src-tauri/tauri.prod.conf.json --target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        if: matrix.platform == 'windows-latest'
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            FEATS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^feat" | sed 's/^[a-f0-9]* /- /')
            FIXES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^fix" | sed 's/^[a-f0-9]* /- /')
            DOCS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^docs" | sed 's/^[a-f0-9]* /- /')
            OTHER=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --grep="^feat" --grep="^fix" --grep="^docs" --invert-grep | sed 's/^[a-f0-9]* /- /')
            BODY=""
            [ -n "$FEATS" ] && BODY="${BODY}### Features\n${FEATS}\n\n"
            [ -n "$FIXES" ] && BODY="${BODY}### Fixes\n${FIXES}\n\n"
            [ -n "$DOCS" ] && BODY="${BODY}### Docs\n${DOCS}\n\n"
            [ -n "$OTHER" ] && BODY="${BODY}### Other\n${OTHER}\n\n"
          else
            BODY="Initial release"
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Agents Commander ${{ github.ref_name }}'
          releaseBody: |
            ${{ steps.changelog.outputs.body || 'See the assets below to download and install Agents Commander.' }}

            ### Install from npm

            ```
            npx @mblua/agentscommander@${{ needs.guard.outputs.version }}
            ```

            ### Trust and privacy
            - [Code signing policy](https://github.com/mblua/AgentsCommander/blob/main/CODE_SIGNING_POLICY.md) - Windows code signing is pending SignPath setup and approval; current Windows artifacts may be unsigned.
            - [Privacy](https://github.com/mblua/AgentsCommander/blob/main/PRIVACY.md)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload raw binaries consumed by the npm package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            node scripts/copy-testable-binary.mjs
            cp target/release/agentscommander.exe agentscommander-windows-x86_64.exe
            cp target/release/agentscommander_testeable.exe agentscommander-testeable-windows-x86_64.exe
            gh release upload "$TAG" agentscommander-windows-x86_64.exe --clobber
            gh release upload "$TAG" agentscommander-testeable-windows-x86_64.exe --clobber
          elif [[ "${{ matrix.platform }}" == "ubuntu-22.04" ]]; then
            cp target/release/agentscommander agentscommander-linux-x86_64
            gh release upload "$TAG" agentscommander-linux-x86_64 --clobber
          elif [[ "${{ matrix.args }}" == *aarch64* ]]; then
            cp target/aarch64-apple-darwin/release/agentscommander agentscommander-mac-aarch64
            gh release upload "$TAG" agentscommander-mac-aarch64 --clobber
            APP_TAR=$(find target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -n 1)
            cp "$APP_TAR" agentscommander-mac-aarch64.app.tar.gz
            gh release upload "$TAG" agentscommander-mac-aarch64.app.tar.gz --clobber
          elif [[ "${{ matrix.args }}" == *x86_64* ]]; then
            cp target/x86_64-apple-darwin/release/agentscommander agentscommander-mac-x86_64
            gh release upload "$TAG" agentscommander-mac-x86_64 --clobber
            APP_TAR=$(find target/x86_64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -n 1)
            cp "$APP_TAR" agentscommander-mac-x86_64.app.tar.gz
            gh release upload "$TAG" agentscommander-mac-x86_64.app.tar.gz --clobber
          fi

  # ---------------------------------------------------------------------
  # SHASUMS256.txt over every asset. npm/install.js verifies against this.
  # ---------------------------------------------------------------------
  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate and upload checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p release-assets
          cd release-assets
          gh release download "$TAG"
          sha256sum * > ../SHASUMS256.txt
          cd ..
          cat SHASUMS256.txt
          gh release upload "$TAG" SHASUMS256.txt --clobber

  # ---------------------------------------------------------------------
  # Flip the draft to published, but only once the assets npm depends on
  # are provably present and downloadable.
  # ---------------------------------------------------------------------
  publish-github:
    name: publish-github
    needs: [guard, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release and prove the npm assets resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A draft release is invisible to GET /releases/tags/{tag}; that
          # endpoint only serves published releases. Resolving the draft by
          # tag through it is what silently skipped the v0.30.1 release run.
          # List and filter instead.
          release_id="$(gh api --paginate "repos/$REPO/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"

          if [ -z "$release_id" ]; then
            echo "::error::No release found for tag $TAG."
            exit 1
          fi
          echo "Release id for $TAG is $release_id"

          gh api "repos/$REPO/releases/$release_id/assets" --paginate \
            --jq '.[].name' | sort > present.txt
          echo "Assets attached:"
          sed 's/^/  /' present.txt

          # These are exactly the files npm/install.js downloads at postinstall
          # time. If any is missing, npm installs would break for that platform,
          # so refuse to publish.
          cat > required.txt <<'EOF'
          SHASUMS256.txt
          agentscommander-linux-x86_64
          agentscommander-mac-aarch64.app.tar.gz
          agentscommander-mac-x86_64.app.tar.gz
          agentscommander-windows-x86_64.exe
          EOF

          missing=0
          while read -r asset; do
            [ -z "$asset" ] && continue
            if ! grep -qxF "$asset" present.txt; then
              echo "::error::Required asset missing from the release: $asset"
              missing=1
            fi
          done < required.txt
          [ "$missing" -eq 0 ] || exit 1

          gh api -X PATCH "repos/$REPO/releases/$release_id" \
            -F draft=false -f make_latest=true >/dev/null

          state="$(gh api "repos/$REPO/releases/$release_id" --jq '.draft')"
          [ "$state" = "false" ] || { echo "::error::Release is still a draft."; exit 1; }

          # Final proof: the exact URL npm/install.js will hit must resolve.
          # This is the check that distinguishes "published" from "works".
          url="https://github.com/$REPO/releases/download/$TAG/SHASUMS256.txt"
          curl -sSfL --retry 5 --retry-delay 5 -o /dev/null "$url"
          echo "Release $TAG is published and its assets are publicly downloadable."

  # ---------------------------------------------------------------------
  # Publish to npm, then prove a clean install actually works.
  # ---------------------------------------------------------------------
  publish-npm:
    name: publish-npm
    needs: [guard, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # provenance attestation
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @mblua/agentscommander
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AGENTSCOMMANDER }}
        run: npm publish --provenance --access public

      - name: Wait for the registry to serve the new version
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            got="$(npm view "@mblua/agentscommander@$VERSION" version 2>/dev/null || true)"
            if [ "$got" = "$VERSION" ]; then
              echo "Registry is serving $VERSION."
              exit 0
            fi
            echo "Attempt $attempt: not visible yet, waiting."
            sleep 10
          done
          echo "::error::@mblua/agentscommander@$VERSION never became visible."
          exit 1

      - name: Smoke test a clean install from the registry
        shell: bash
        run: |
          set -euo pipefail
          # Installs the real published tarball and lets postinstall download
          # and checksum-verify the Linux binary from the GitHub Release.
          # This exercises the whole chain the way a user does.
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install "@mblua/agentscommander@$VERSION"
          test -x node_modules/@mblua/agentscommander/bin/agentscommander
          echo "Clean install of $VERSION succeeded."

      - name: Report
        shell: bash
        run: |
          {
            echo "### Released $VERSION"
            echo
            echo "- GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            echo "- npm: https://www.npmjs.com/package/@mblua/agentscommander/v/$VERSION"
            echo
            echo '```'
            echo "npx @mblua/agentscommander@$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

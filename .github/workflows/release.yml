            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the retained draft ledger and make the sole public PATCH
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const fail = (message) => { console.error(`::error::DRAFT_RELEASE_CONTRACT_MISMATCH: ${message}`); process.exit(1); };
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const expected = [
            `Agents.Commander-${process.env.VERSION}-1.x86_64.rpm`, `Agents.Commander_${process.env.VERSION}_aarch64.dmg`,
            `Agents.Commander_${process.env.VERSION}_amd64.AppImage`, `Agents.Commander_${process.env.VERSION}_amd64.deb`,
            `Agents.Commander_${process.env.VERSION}_x64-setup.exe`, `Agents.Commander_${process.env.VERSION}_x64.dmg`,
            'Agents.Commander_aarch64.app.tar.gz', 'Agents.Commander_x64.app.tar.gz', 'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64', 'agentscommander-mac-aarch64.app.tar.gz', 'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz', 'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe', `agentscommander-${process.env.VERSION}-windows-x86_64-portable.zip`, 'SHASUMS256.txt',
          ];
          const sortBytes = (a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b));
          const sha = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          async function request(method, path, json, binary = false) {
            let response;
            try {
              response = await fetch(`https://api.github.com${path}`, {
                method,
                headers: binary ? { ...headers, Accept: 'application/octet-stream' } : headers,
                body: json === undefined ? undefined : JSON.stringify(json),
              });
            } catch (error) { fail(`Release API transport failure: ${error.message}`); }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!response.ok) fail(`Release API ${method} ${path} returned HTTP ${response.status}`);
            return bytes;
          }
          async function list() {
            const all = [];
            for (let page = 1; ; page += 1) {
              const value = JSON.parse((await request('GET', `/repos/${process.env.REPO}/releases/${process.env.RELEASE_ID}/assets?per_page=100&page=${page}`)).toString('utf8'));
              if (!Array.isArray(value)) fail('asset page is not an array');
              all.push(...value);
              if (value.length < 100) return all;
            }
          }
          function manifestMap(bytes, assets) {
            const manifest = bytes.toString('utf8');
            if (manifest.includes('\r')) fail('manifest contains CR bytes');
            const lines = manifest.trimEnd().split('\n');
            if (lines.length !== 16) fail('manifest record count differs');
            const map = new Map();
            for (const line of lines) {
              const match = line.match(/^([0-9a-f]{64})  (.+)$/);
              if (!match || map.has(match[2]) || match[2] === 'SHASUMS256.txt') fail('manifest record differs');
              map.set(match[2], match[1]);
            }
            if (map.size !== 16 || assets.filter((asset) => asset.name !== 'SHASUMS256.txt').some((asset) => map.get(asset.name) !== asset.digest.slice(7))) fail('manifest/API digest map differs');
          }
          (async () => {
            const draftPath = `/repos/${process.env.REPO}/releases/${process.env.RELEASE_ID}`;
            const draft = JSON.parse((await request('GET', draftPath)).toString('utf8'));
            const sameMetadata = (release, draftExpected) => release.id === Number(process.env.RELEASE_ID) &&
              release.tag_name === process.env.TAG && release.target_commitish === process.env.MERGE_SHA &&
              release.prerelease === false && sha(Buffer.from(String(release.name), 'utf8')) === process.env.TITLE_SHA256 &&
              sha(Buffer.from(String(release.body), 'utf8')) === process.env.BODY_SHA256 && release.draft === draftExpected;
            if (!sameMetadata(draft, true)) fail('draft metadata differs before publication');
            const assets = await list();
            const names = assets.map((asset) => asset.name);
            if (assets.length !== 17 || new Set(names).size !== 17 ||
                names.slice().sort(sortBytes).join('\n') !== expected.slice().sort(sortBytes).join('\n') ||
                assets.some((asset) => asset.state !== 'uploaded' || asset.size <= 0 || !/^sha256:[0-9a-f]{64}$/.test(asset.digest || ''))) fail('draft 17-asset ledger differs');
            const manifestAsset = assets.find((asset) => asset.name === 'SHASUMS256.txt');
            const manifest = await request('GET', manifestAsset.url.replace('https://api.github.com', ''), undefined, true);
            if (`sha256:${sha(manifest)}` !== manifestAsset.digest) fail('manifest raw digest differs from API digest');
            manifestMap(manifest, assets);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/publish-github-draft.json`, JSON.stringify({ draft, assets }));
            const patched = JSON.parse((await request('PATCH', draftPath, { draft: false, make_latest: true })).toString('utf8'));
            if (!sameMetadata(patched, false)) fail('PATCH response differs from immutable Release contract');
            const publicRelease = JSON.parse((await request('GET', draftPath)).toString('utf8'));
            if (!sameMetadata(publicRelease, false)) fail('public re-read differs from immutable Release contract');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/publish-github-public.json`, JSON.stringify(publicRelease));
          })().catch((error) => fail(error.stack || error.message));
          NODE

  verify-public-release:
    name: verify-public-release
    needs: [publish-github, guard, prepare-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
    env:
      REQUESTED_RUNNER: ubuntu-22.04
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
      TITLE_SHA256: ${{ needs.prepare-release.outputs.title_sha256 }}
      BODY_SHA256: ${{ needs.prepare-release.outputs.body_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Pin npm and assert runtime identity
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"
          npm ci
          echo "MERGE_SHA=$(git rev-parse "$TAG^{}")" >> "$GITHUB_ENV"

      - name: Record public verification identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Public immutable Release verification identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and verify the immutable public Release and ledger
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const fail = (message) => { console.error(`::error::IMMUTABLE_RELEASE_MISMATCH: ${message}`); process.exit(1); };
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const expected = [
            `Agents.Commander-${process.env.VERSION}-1.x86_64.rpm`, `Agents.Commander_${process.env.VERSION}_aarch64.dmg`,
            `Agents.Commander_${process.env.VERSION}_amd64.AppImage`, `Agents.Commander_${process.env.VERSION}_amd64.deb`,
            `Agents.Commander_${process.env.VERSION}_x64-setup.exe`, `Agents.Commander_${process.env.VERSION}_x64.dmg`,
            'Agents.Commander_aarch64.app.tar.gz', 'Agents.Commander_x64.app.tar.gz', 'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64', 'agentscommander-mac-aarch64.app.tar.gz', 'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz', 'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe', `agentscommander-${process.env.VERSION}-windows-x86_64-portable.zip`, 'SHASUMS256.txt',
          ];
          const sortBytes = (a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b));
          const digest = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          async function request(url, binary = false) {
            let response;
            try { response = await fetch(url, { headers: binary ? { ...headers, Accept: 'application/octet-stream' } : headers }); }
            catch (error) { fail(`Release API transport failure: ${error.message}`); }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!response.ok) fail(`Release API returned HTTP ${response.status}`);
            return bytes;
          }
          async function list(base) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const value = JSON.parse((await request(`${base}/assets?per_page=100&page=${page}`)).toString('utf8'));
              if (!Array.isArray(value)) fail('asset page is not an array');
              all.push(...value);
              if (value.length < 100) return all;
            }
          }
          (async () => {
            const base = `https://api.github.com/repos/${process.env.REPO}/releases/${process.env.RELEASE_ID}`;
            const release = JSON.parse((await request(base)).toString('utf8'));
            if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== process.env.TAG ||
                release.target_commitish !== process.env.MERGE_SHA || release.draft !== false || release.prerelease !== false ||
                release.immutable !== true || digest(Buffer.from(String(release.name), 'utf8')) !== process.env.TITLE_SHA256 ||
                digest(Buffer.from(String(release.body), 'utf8')) !== process.env.BODY_SHA256) fail('public Release metadata or immutable state differs');
            const listed = await list(base);
            const names = listed.map((asset) => asset.name);
            if (listed.length !== 17 || new Set(names).size !== 17 ||
                names.slice().sort(sortBytes).join('\n') !== expected.slice().sort(sortBytes).join('\n') ||
                listed.some((asset) => asset.state !== 'uploaded' || asset.size <= 0 || !/^sha256:[0-9a-f]{64}$/.test(asset.digest || ''))) fail('public 17-asset ledger differs');
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'public-release-assets-'));
            const byName = new Map(listed.map((asset) => [asset.name, asset]));
            for (const name of expected) {
              const bytes = await request(byName.get(name).url, true);
              if (!bytes.length) fail(`public asset is empty: ${name}`);
              fs.writeFileSync(path.join(dir, name), bytes);
            }
            const manifest = fs.readFileSync(path.join(dir, 'SHASUMS256.txt'));
            if (`sha256:${digest(manifest)}` !== byName.get('SHASUMS256.txt').digest) fail('public manifest raw digest differs');
            const raw = manifest.toString('utf8');
            if (raw.includes('\r')) fail('public manifest contains CR bytes');
            const lines = raw.trimEnd().split('\n');
            const map = new Map();
            for (const line of lines) {
              const match = line.match(/^([0-9a-f]{64})  (.+)$/);
              if (!match || match[2] === 'SHASUMS256.txt' || map.has(match[2])) fail('public manifest record differs');
              map.set(match[2], match[1]);
            }
            if (lines.length !== 16 || map.size !== 16 || listed.filter((asset) => asset.name !== 'SHASUMS256.txt').some((asset) => map.get(asset.name) !== asset.digest.slice(7))) fail('public manifest/API digest map differs');
            fs.writeFileSync(path.join(dir, 'public-release.json'), JSON.stringify({ release, assets: listed, manifestMap: Object.fromEntries(map) }));
            fs.writeFileSync(path.join(dir, 'public-ledger.txt'), `${expected.join('\n')}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PUBLIC_RELEASE_DIR=${dir}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Public immutable Release evidence\n\n- Release ID: ${release.id}\n- immutable: ${release.immutable}\n- ledger assets: ${listed.length}\n- manifest API digest: \`${byName.get('SHASUMS256.txt').digest}\`\n`);
          })().catch((error) => fail(error.stack || error.message));
          NODE

      - name: Verify the public checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PUBLIC_RELEASE_DIR" && sha256sum -c SHASUMS256.txt)

      - name: Install the SHA-verified GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="$RUNNER_TEMP/gh-2.98.0"
          mkdir -p "$cli_dir"
          archive="$cli_dir/gh_2.98.0_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
          printf '%s  %s\n' 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$cli_dir"
          gh_bin="$cli_dir/gh_2.98.0_linux_amd64/bin/gh"
          "$gh_bin" --version | tee "$PUBLIC_RELEASE_DIR/gh-version.txt"
          "$gh_bin" --version | grep -E '^gh version 2\.98\.0 '
          echo "GH_BIN=$gh_bin" >> "$GITHUB_ENV"

      - name: Verify immutable public Release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_BIN" release verify "$TAG" --repo mblua/AgentsCommander --format json | tee "$PUBLIC_RELEASE_DIR/release-verify.json"

      - name: Verify all public Release asset attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r asset; do
            index=$((index + 1))
            "$GH_BIN" release verify-asset "$TAG" "$PUBLIC_RELEASE_DIR/$asset" --repo mblua/AgentsCommander --format json | tee "$PUBLIC_RELEASE_DIR/asset-verify-$index.json"
          done < "$PUBLIC_RELEASE_DIR/public-ledger.txt"
          test "$index" = 17

  publish-npm:
    name: publish-npm
    needs: [verify-public-release, guard]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      REQUESTED_RUNNER: ubuntu-22.04
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Pin npm and assert runtime identity
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"
          npm ci

      - name: Record npm publication identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### npm publication identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish with npm trusted publishing only
        working-directory: npm
        shell: bash
        run: npm publish --access public --tag latest

      - name: Require the exact public version and latest dist-tag
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            version="$(npm view "@mblua/agentscommander@$VERSION" version 2>/dev/null || true)"
            latest="$(npm view "@mblua/agentscommander" dist-tags.latest 2>/dev/null || true)"
            if [ "$version" = "$VERSION" ] && [ "$latest" = "$VERSION" ]; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::NPM_PUBLICATION_MISMATCH: exact version or latest dist-tag did not become public.'
          exit 1

      - name: Prove a clean public consumer install with lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          pushd "$install_dir"
          npm init -y >/dev/null
          npm install --foreground-scripts --ignore-scripts=false --no-audit --no-fund "@mblua/agentscommander@$VERSION" 2>&1 | tee npm-install.log
          test -e node_modules/.bin/agentscommander
          grep -F 'Downloading SHASUMS256.txt from' npm-install.log
          grep -Fx 'Checksum verified.' npm-install.log
          npx --no-install agentscommander --version | tee agentscommander-version.log
          grep -E "(^|[^0-9])${VERSION//./\\.}([^0-9]|$)" agentscommander-version.log
          popd

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  NPM_VERSION: '11.6.2'
  RUST_VERSION: '1.85.0'
  CHECKOUT_ACTION_SHA: fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
  SETUP_NODE_ACTION_SHA: a0853c24544627f65ddf259abe73b1d18a591444
  TAURI_ACTION_SHA: 84b9d35b5fc46c1e45415bdb6144030364f7ebc5
  RUST_ACTION_SHA: 4360b52568e2003a75bf9bc1d59f33a8e3fc893c
  RELEASE_API_VERSION: '2026-03-10'

jobs:
  guard:
    name: guard
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      REQUESTED_RUNNER: ubuntu-22.04
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Pin npm
        shell: bash
        run: npm install -g npm@11.6.2

      - name: Assert pinned runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Release identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag must match every version location
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          npm run version:check
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./npm/package.json').version")" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prove the event tag is the immutable remote ref
        shell: bash
        run: |
          set -euo pipefail
          probe_log="$(mktemp)"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" >"$probe_log" 2>&1
          probe_rc=$?
          set -e
          if [ "$probe_rc" -ne 0 ]; then
            cat "$probe_log" >&2
            echo '::error::RELEASE_AUTHORITY_UNPROVEN: event tag remote probe failed.'
            exit 1
          fi
          test "$(awk 'NF { count += 1 } END { print count + 0 }' "$probe_log")" -ge 1
          local_tag="$(git rev-parse "$TAG^{tag}")"
          local_commit="$(git rev-parse "$TAG^{}")"
          grep -Fx "$local_tag	refs/tags/$TAG" "$probe_log"
          grep -Fx "$local_commit	refs/tags/$TAG^{}" "$probe_log"

      - name: Prove that no Release or draft owns the candidate tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fail = (message) => {
            console.error(`::error::RELEASE_AUTHORITY_UNPROVEN: ${message}`);
            process.exit(1);
          };
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          if (!process.env.GITHUB_TOKEN) fail('missing explicit GitHub token');
          const next = (link) => {
            const part = (link || '').split(',').map((entry) => entry.trim()).find((entry) => /rel="next"/.test(entry));
            return part && part.match(/^<([^>]+)>/)?.[1];
          };
          (async () => {
            const releases = [];
            let url = `https://api.github.com/repos/${process.env.REPO}/releases?per_page=100`;
            while (url) {
              let response;
              try {
                response = await fetch(url, { headers });
              } catch (error) {
                fail(`Release API transport failure: ${error.message}`);
              }
              if (!response.ok) fail(`Release API returned HTTP ${response.status}`);
              let page;
              try {
                page = await response.json();
              } catch (error) {
                fail(`Release API JSON parse failure: ${error.message}`);
              }
              if (!Array.isArray(page)) fail('Release API page is not an array');
              releases.push(...page);
              url = next(response.headers.get('link'));
            }
            if (releases.some((release) => release.tag_name === process.env.TAG)) {
              console.error('::error::IMMUTABLE_CANDIDATE_COLLISION: Release or draft already owns the candidate tag.');
              process.exit(1);
            }
          })().catch((error) => fail(error.stack || error.message));
          NODE

      - name: Prove that the npm version is explicitly absent
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          probe_log="$(mktemp)"
          set +e
          npm view "@mblua/agentscommander@$VERSION" version --json >"$probe_log" 2>&1
          probe_rc=$?
          set -e
          if [ "$probe_rc" -eq 0 ]; then
            cat "$probe_log" >&2
            echo '::error::IMMUTABLE_CANDIDATE_COLLISION: npm already serves the candidate version.'
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$probe_log" && grep -Eq '(^|[^0-9])404([^0-9]|$)' "$probe_log"; then
            exit 0
          fi
          cat "$probe_log" >&2
          echo '::error::RELEASE_AUTHORITY_UNPROVEN: npm absence was not explicit E404/HTTP 404.'
          exit 1

  prepare-release:
    name: prepare-release
    needs: guard
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.contract.outputs.release_id }}
      title_sha256: ${{ steps.contract.outputs.title_sha256 }}
      body_sha256: ${{ steps.contract.outputs.body_sha256 }}
    env:
      REQUESTED_RUNNER: ubuntu-22.04
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      BASE_SHA: 809120fa9fe09bb22c314ed462735378f6438d75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Pin npm
        shell: bash
        run: npm install -g npm@11.6.2

      - name: Assert pinned runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Release identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the annotated tag and peeled commit
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG_OBJECT=$(git rev-parse "$TAG^{tag}")" >> "$GITHUB_ENV"
          echo "MERGE_SHA=$(git rev-parse "$TAG^{}")" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{}")"
          test "$GITHUB_REF" = "refs/tags/$TAG"

      - name: Parse byte-bound tag payload and create the sole draft
        id: contract
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const fail = (message) => {
            console.error(`::error::DRAFT_RELEASE_CONTRACT_MISMATCH: ${message}`);
            process.exit(1);
          };
          const git = (args, encoding = 'utf8') => {
            try {
              return execFileSync('git', args, { encoding });
            } catch (error) {
              fail(`git ${args.join(' ')} failed: ${error.message}`);
            }
          };
          const digest = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          if (!process.env.GITHUB_TOKEN) fail('missing GitHub token');
          function headerValue(line, prefix) {
            if (!line.startsWith(prefix)) fail(`missing tag header ${prefix}`);
            return line.slice(prefix.length);
          }
          function renderBody(previousTag, mergeSha) {
            const collect = (patterns, invert = false) => {
              const args = ['log', `${previousTag}..${mergeSha}`, '--oneline', '--no-merges'];
              for (const pattern of patterns) args.push('--grep', pattern);
              if (invert) args.push('--invert-grep');
              const raw = git(args).trimEnd();
              return raw ? raw.split('\n').map((line) => line.replace(/^[0-9a-f]+ /, '- ')) : [];
            };
            const groups = [
              ['Features', collect(['^feat'])],
              ['Fixes', collect(['^fix'])],
              ['Docs', collect(['^docs'])],
              ['Other', collect(['^feat', '^fix', '^docs'], true)],
            ];
            let body = '';
            for (const [name, lines] of groups) if (lines.length) body += `### ${name}\n${lines.join('\n')}\n\n`;
            if (!body) body = 'Initial release\n\n';
            body += `### Install from npm\n\n\`\`\`\nnpx @mblua/agentscommander@${process.env.VERSION}\n\`\`\`\n\n`;
            body += '### Trust and privacy\n';
            body += '- [Code signing policy](https://github.com/mblua/AgentsCommander/blob/main/CODE_SIGNING_POLICY.md) - Windows code signing is pending SignPath setup and approval; current Windows artifacts may be unsigned.\n';
            body += '- [Privacy](https://github.com/mblua/AgentsCommander/blob/main/PRIVACY.md)\n';
            return body.replace(/\r/g, '').replace(/\n+$/, '') + '\n';
          }
          const rawTag = git(['cat-file', 'tag', process.env.TAG_OBJECT], null);
          const contentStart = rawTag.indexOf(Buffer.from('\n\n'));
          if (contentStart < 0) fail('annotated tag content is missing');
          const message = rawTag.subarray(contentStart + 2);
          const marker = Buffer.from('Release-Body:\n');
          const markerIndex = message.indexOf(marker);
          if (markerIndex < 0) fail('Release-Body marker is missing');
          const headerBytes = message.subarray(0, markerIndex + marker.length);
          const headerText = headerBytes.toString('utf8');
          if (!Buffer.from(headerText, 'utf8').equals(headerBytes)) fail('tag header is not valid UTF-8');
          const lines = headerText.trimEnd().split('\n');
          if (lines.length !== 14 || lines[0] !== `Release v${process.env.VERSION}` || lines[13] !== 'Release-Body:') {
            fail('tag header order differs');
          }
          const schema = headerValue(lines[1], 'Schema: ');
          const baseSha = headerValue(lines[2], 'Base-SHA: ');
          const hardeningMerge = headerValue(lines[3], 'Hardening-Merge-SHA: ');
          const hardeningBlob = headerValue(lines[4], 'Hardening-Workflow-Blob: ');
          const mergeSha = headerValue(lines[5], 'Merge-SHA: ');
          const previousTag = headerValue(lines[6], 'Previous-Tag: ');
          const previousObject = headerValue(lines[7], 'Previous-Tag-Object: ');
          const previousCommit = headerValue(lines[8], 'Previous-Tag-Commit: ');
          const title = headerValue(lines[9], 'Release-Title: ');
          const titleHash = headerValue(lines[10], 'Release-Title-SHA256: ');
          const bodyLength = Number(headerValue(lines[11], 'Release-Body-Bytes: '));
          const bodyHash = headerValue(lines[12], 'Release-Body-SHA256: ');
          const body = message.subarray(markerIndex + marker.length);
          if (schema !== 'agentscommander-release-v1' || baseSha !== process.env.BASE_SHA ||
              mergeSha !== process.env.MERGE_SHA || title !== `Agents Commander v${process.env.VERSION}` ||
              previousTag !== 'v0.30.3' || previousObject !== 'f8c3b2cba39dbb734b9959352ff592d7c0332539' ||
              previousCommit !== '9ffc24911685906c0222d53eb79898ce9dbdff3e' ||
              !/^[0-9a-f]{40}$/i.test(hardeningMerge) ||
              git(['rev-parse', `${hardeningMerge}:.github/workflows/release.yml`]).trim() !== hardeningBlob ||
              digest(Buffer.from(title, 'utf8')) !== titleHash ||
              !Number.isSafeInteger(bodyLength) || bodyLength !== body.length || digest(body) !== bodyHash ||
              !body.length || body.includes(13) || body.at(-1) !== 10 || body.at(-2) === 10 ||
              !Buffer.from(body.toString('utf8'), 'utf8').equals(body)) {
            fail('tag payload binding or UTF-8 LF body differs');
          }
          if (git(['rev-parse', `${previousTag}^{tag}`]).trim() !== previousObject ||
              git(['rev-parse', `${previousTag}^{}`]).trim() !== previousCommit ||
              git(['describe', '--tags', '--abbrev=0', `${mergeSha}^`]).trim() !== previousTag) {
            fail('local predecessor identity differs');
          }
          const remote = git(['ls-remote', '--tags', 'origin', `refs/tags/${previousTag}`, `refs/tags/${previousTag}^{}`]).trimEnd().split('\n');
          if (remote.length !== 2 || !remote.includes(`${previousObject}\trefs/tags/${previousTag}`) ||
              !remote.includes(`${previousCommit}\trefs/tags/${previousTag}^{}`)) {
            fail('remote predecessor identity differs');
          }
          if (!Buffer.from(renderBody(previousTag, mergeSha), 'utf8').equals(body)) fail('explicit-input body renderer differs');
          async function request(method, path, json) {
            let response;
            try {
              response = await fetch(`https://api.github.com${path}`, {
                method,
                headers,
                body: json === undefined ? undefined : JSON.stringify(json),
              });
            } catch (error) {
              fail(`Release API transport failure: ${error.message}`);
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            let value;
            try {
              value = JSON.parse(bytes.toString('utf8'));
            } catch (error) {
              fail(`Release API JSON parse failure: ${error.message}`);
            }
            if (!response.ok) fail(`Release API ${method} ${path} returned HTTP ${response.status}`);
            return { status: response.status, value };
          }
          (async () => {
            const create = await request('POST', `/repos/${process.env.REPO}/releases`, {
              tag_name: process.env.TAG,
              target_commitish: mergeSha,
              name: title,
              body: body.toString('utf8'),
              draft: true,
              prerelease: false,
              generate_release_notes: false,
            });
            if (create.status !== 201 || !Number.isSafeInteger(create.value.id)) fail('draft create did not return HTTP 201 and a Release ID');
            const draft = (await request('GET', `/repos/${process.env.REPO}/releases/${create.value.id}`)).value;
            if (draft.id !== create.value.id || draft.tag_name !== process.env.TAG || draft.target_commitish !== mergeSha ||
                draft.draft !== true || draft.prerelease !== false ||
                digest(Buffer.from(String(draft.name), 'utf8')) !== titleHash ||
                digest(Buffer.from(String(draft.body), 'utf8')) !== bodyHash) {
              fail('draft re-read differs from the Release contract');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${draft.id}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `title_sha256=${titleHash}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `body_sha256=${bodyHash}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Draft contract\n\n- Release ID: ${draft.id}\n- title SHA-256: \`${titleHash}\`\n- body SHA-256: \`${bodyHash}\`\n`);
          })().catch((error) => fail(error.stack || error.message));
          NODE

  build:
    name: build (${{ matrix.label }})
    needs: [guard, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            label: windows
            runner: windows-2022
            kind: windows
            targets: ''
            args: '--config src-tauri/tauri.prod.conf.json --bundles nsis'
          - id: linux
            label: linux
            runner: ubuntu-22.04
            kind: linux
            targets: ''
            args: '--config src-tauri/tauri.prod.conf.json'
          - id: macos-arm64
            label: macOS aarch64
            runner: macos-15
            kind: macos
            uname: arm64
            runner_arch: ARM64
            targets: aarch64-apple-darwin
            args: '--config src-tauri/tauri.prod.conf.json --target aarch64-apple-darwin'
          - id: macos-x64
            label: macOS x86_64
            runner: macos-15-intel
            kind: macos
            uname: x86_64
            runner_arch: X64
            targets: x86_64-apple-darwin
            args: '--config src-tauri/tauri.prod.conf.json --target x86_64-apple-darwin'
    runs-on: ${{ matrix.runner }}
    env:
      REQUESTED_RUNNER: ${{ matrix.runner }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.targets }}

      - name: Pin npm
        shell: bash
        run: npm install -g npm@11.6.2

      - name: Assert pinned runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Install Linux bundle dependencies
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Verify macOS producer identity
        if: matrix.kind == 'macos'
        shell: bash
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_TARGET: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          test "$REQUESTED_RUNNER" = "${{ matrix.runner }}"
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "${RUNNER_ARCH:-}" = "$EXPECTED_RUNNER_ARCH"
          rustup target list --installed | grep -Fx "$EXPECTED_TARGET"

      - name: Record producer identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Producer identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build macOS artifacts before upload
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri build -- ${{ matrix.args }}

      - name: Prepare macOS raw artifacts before Tauri upload
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.id }}" = macos-arm64 ]; then
            target_dir='target/aarch64-apple-darwin/release'
            raw='agentscommander-mac-aarch64'
            archive='agentscommander-mac-aarch64.app.tar.gz'
          else
            target_dir='target/x86_64-apple-darwin/release'
            raw='agentscommander-mac-x86_64'
            archive='agentscommander-mac-x86_64.app.tar.gz'
          fi
          cp "$target_dir/agentscommander" "$raw"
          source_archive="$(find "$target_dir/bundle/macos" -type f -name '*.app.tar.gz' -print -quit)"
          test -s "$source_archive"
          cp "$source_archive" "$archive"

      - name: Verify exact macOS output names before Tauri upload
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.id }}" = macos-arm64 ]; then
            bundle_dir='target/aarch64-apple-darwin/release/bundle/macos'
            raw='agentscommander-mac-aarch64'
            archive='agentscommander-mac-aarch64.app.tar.gz'
            expected="$(printf '%s\n' "Agents.Commander_${VERSION}_aarch64.dmg" 'Agents.Commander_aarch64.app.tar.gz' "$raw" "$archive" | LC_ALL=C sort)"
          else
            bundle_dir='target/x86_64-apple-darwin/release/bundle/macos'
            raw='agentscommander-mac-x86_64'
            archive='agentscommander-mac-x86_64.app.tar.gz'
            expected="$(printf '%s\n' "Agents.Commander_${VERSION}_x64.dmg" 'Agents.Commander_x64.app.tar.gz' "$raw" "$archive" | LC_ALL=C sort)"
          fi
          actual="$( { find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -exec basename {} \;; printf '%s\n' "$raw" "$archive"; } | LC_ALL=C sort)"
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l | tr -d ' ')" = 4
          test "$actual" = "$expected"
          while IFS= read -r asset; do
            if [ "$asset" = "$raw" ] || [ "$asset" = "$archive" ]; then
              test -s "$asset"
            else
              test -s "$(find "$bundle_dir" -type f -name "$asset" -print -quit)"
            fi
          done <<< "$expected"

      - name: Build and upload Tauri bundles to the retained draft
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Package raw producer assets and smoke the portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/raw-${{ matrix.id }}.txt"
          case "${{ matrix.kind }}" in
            windows)
              node scripts/copy-testable-binary.mjs
              cp target/release/agentscommander.exe agentscommander-windows-x86_64.exe
              cp target/release/agentscommander_testeable.exe agentscommander-testeable-windows-x86_64.exe
              pwsh -NoProfile -Command "
                \$ErrorActionPreference = 'Stop'
                \$zip = 'agentscommander-$VERSION-windows-x86_64-portable.zip'
                node scripts/pack-windows-portable.mjs --binary target/release/agentscommander.exe --version '$VERSION' --out \$zip
                if (\$LASTEXITCODE -ne 0) { throw 'portable ZIP packing failed' }
                pwsh -File scripts/smoke-windows-portable.ps1 -Zip \$zip -ExpectedVersion '$VERSION'
                if (\$LASTEXITCODE -ne 0) { throw 'portable ZIP smoke failed' }
              "
              printf '%s\n' agentscommander-windows-x86_64.exe agentscommander-testeable-windows-x86_64.exe "agentscommander-${VERSION}-windows-x86_64-portable.zip" > "$list"
              ;;
            linux)
              cp target/release/agentscommander agentscommander-linux-x86_64
              printf '%s\n' agentscommander-linux-x86_64 > "$list"
              ;;
            macos)
              if [ "${{ matrix.id }}" = macos-arm64 ]; then
                target_dir='target/aarch64-apple-darwin/release'
                raw='agentscommander-mac-aarch64'
                archive='agentscommander-mac-aarch64.app.tar.gz'
              else
                target_dir='target/x86_64-apple-darwin/release'
                raw='agentscommander-mac-x86_64'
                archive='agentscommander-mac-x86_64.app.tar.gz'
              fi
              cp "$target_dir/agentscommander" "$raw"
              source_archive="$(find "$target_dir/bundle/macos" -type f -name '*.app.tar.gz' -print -quit)"
              test -s "$source_archive"
              cp "$source_archive" "$archive"
              printf '%s\n' "$raw" "$archive" > "$list"
              ;;
            *) exit 1 ;;
          esac
          while IFS= read -r asset; do test -s "$asset"; done < "$list"
          echo "RAW_ASSET_LIST=$list" >> "$GITHUB_ENV"

      - name: Upload raw assets through the retained draft Release ID
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const fail = (message) => { console.error(`::error::DRAFT_RELEASE_CONTRACT_MISMATCH: ${message}`); process.exit(1); };
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          async function request(url, options = {}) {
            let response;
            try { response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } }); }
            catch (error) { fail(`Release API transport failure: ${error.message}`); }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!response.ok) fail(`Release API returned HTTP ${response.status}`);
            return bytes;
          }
          (async () => {
            const release = JSON.parse((await request(`https://api.github.com/repos/${process.env.REPO}/releases/${process.env.RELEASE_ID}`)).toString('utf8'));
            if (release.id !== Number(process.env.RELEASE_ID) || release.draft !== true || release.tag_name !== process.env.TAG) fail('draft contract differs');
            const upload = String(release.upload_url || '').replace(/\{\?name,label\}$/, '');
            if (!upload) fail('draft upload URL is missing');
            const files = fs.readFileSync(process.env.RAW_ASSET_LIST, 'utf8').trim().split(/\r?\n/);
            if (!files.length || new Set(files).size !== files.length) fail('raw asset list is empty or duplicated');
            for (const file of files) {
              const bytes = fs.readFileSync(file);
              const asset = JSON.parse((await request(`${upload}?name=${encodeURIComponent(file)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/octet-stream' },
                body: bytes,
              })).toString('utf8'));
              if (asset.name !== file || asset.state !== 'uploaded' || asset.size <= 0) fail(`upload differs for ${file}`);
            }
          })().catch((error) => fail(error.stack || error.message));
          NODE

  checksums:
    name: checksums
    needs: [build, guard, prepare-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      REQUESTED_RUNNER: ubuntu-22.04
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Pin npm and assert runtime identity
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"
          npm ci

      - name: Record release identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Checksum identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the exact 16-record manifest and upload only it
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const fail = (message) => { console.error(`::error::DRAFT_RELEASE_CONTRACT_MISMATCH: ${message}`); process.exit(1); };
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const sortBytes = (a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b));
          async function request(url, options = {}) {
            let response;
            try { response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } }); }
            catch (error) { fail(`Release API transport failure: ${error.message}`); }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!response.ok) fail(`Release API returned HTTP ${response.status}`);
            return bytes;
          }
          async function assets(base) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const value = JSON.parse((await request(`${base}/assets?per_page=100&page=${page}`)).toString('utf8'));
              if (!Array.isArray(value)) fail('asset page is not an array');
              all.push(...value);
              if (value.length < 100) return all;
            }
          }
          (async () => {
            const expected = [
              `Agents.Commander-${process.env.VERSION}-1.x86_64.rpm`,
              `Agents.Commander_${process.env.VERSION}_aarch64.dmg`,
              `Agents.Commander_${process.env.VERSION}_amd64.AppImage`,
              `Agents.Commander_${process.env.VERSION}_amd64.deb`,
              `Agents.Commander_${process.env.VERSION}_x64-setup.exe`,
              `Agents.Commander_${process.env.VERSION}_x64.dmg`,
              'Agents.Commander_aarch64.app.tar.gz',
              'Agents.Commander_x64.app.tar.gz',
              'agentscommander-linux-x86_64',
              'agentscommander-mac-aarch64',
              'agentscommander-mac-aarch64.app.tar.gz',
              'agentscommander-mac-x86_64',
              'agentscommander-mac-x86_64.app.tar.gz',
              'agentscommander-testeable-windows-x86_64.exe',
              'agentscommander-windows-x86_64.exe',
              `agentscommander-${process.env.VERSION}-windows-x86_64-portable.zip`,
            ];
            const base = `https://api.github.com/repos/${process.env.REPO}/releases/${process.env.RELEASE_ID}`;
            const release = JSON.parse((await request(base)).toString('utf8'));
            if (release.id !== Number(process.env.RELEASE_ID) || release.draft !== true || release.tag_name !== process.env.TAG) fail('draft contract differs');
            const listed = await assets(base);
            const names = listed.map((asset) => asset.name);
            if (listed.length !== 16 || new Set(names).size !== 16 ||
                names.slice().sort(sortBytes).join('\n') !== expected.slice().sort(sortBytes).join('\n')) fail('candidate 16-name ledger differs');
            const byName = new Map(listed.map((asset) => [asset.name, asset]));
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'candidate-assets-'));
            const rows = [];
            for (const name of expected) {
              const asset = byName.get(name);
              if (!asset || asset.state !== 'uploaded' || asset.size <= 0 || !/^sha256:[0-9a-f]{64}$/.test(asset.digest || '')) fail(`candidate asset differs: ${name}`);
              const bytes = await request(asset.url, { headers: { Accept: 'application/octet-stream' } });
              if (!bytes.length) fail(`candidate asset is empty: ${name}`);
              fs.writeFileSync(path.join(dir, name), bytes);
              rows.push(`${crypto.createHash('sha256').update(bytes).digest('hex')}  ${name}`);
            }
            const manifest = `${rows.join('\n')}\n`;
            if (rows.length !== 16 || manifest.includes('SHASUMS256.txt')) fail('manifest record set differs');
            fs.writeFileSync('SHASUMS256.txt', manifest, 'utf8');
            const upload = String(release.upload_url || '').replace(/\{\?name,label\}$/, '');
            const result = JSON.parse((await request(`${upload}?name=SHASUMS256.txt`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/octet-stream' },
              body: Buffer.from(manifest, 'utf8'),
            })).toString('utf8'));
            if (result.name !== 'SHASUMS256.txt' || result.state !== 'uploaded' || result.size <= 0) fail('manifest upload differs');
          })().catch((error) => fail(error.stack || error.message));
          NODE

  verify-attestation-authority:
    name: verify-attestation-authority
    needs: [checksums, guard, prepare-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
    env:
      REQUESTED_RUNNER: ubuntu-22.04
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Pin npm and assert runtime identity
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          rustc --version | grep -F "rustc $RUST_VERSION"
          cargo --version | grep -F "cargo $RUST_VERSION"
          npm ci

      - name: Record verification identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Pre-publication attestation identity'
            echo
            echo "- requested runner: $REQUESTED_RUNNER"
            echo "- ImageOS: ${ImageOS:-unavailable}"
            echo "- ImageVersion: ${ImageVersion:-unavailable}"
            echo "- checked-out SHA: $(git rev-parse HEAD)"
            echo "- tag: $TAG"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- rustc: $(rustc --version)"
            echo "- cargo: $(cargo --version)"
            echo "- local Tauri CLI: $(npx --no-install tauri --version)"
            echo "- actions/checkout: $CHECKOUT_ACTION_SHA"
            echo "- actions/setup-node: $SETUP_NODE_ACTION_SHA"
            echo "- tauri-apps/tauri-action: $TAURI_ACTION_SHA"
            echo "- dtolnay/rust-toolchain: $RUST_ACTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and validate the immutable predecessor ledger
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: mblua/AgentsCommander
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const fail = (message) => { console.error(`::error::PRE_PUBLICATION_ATTESTATION_AUTHORIZATION_FAILED: ${message}`); process.exit(1); };
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': process.env.RELEASE_API_VERSION,
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const expected = [
            'Agents.Commander-0.30.3-1.x86_64.rpm',
            'Agents.Commander_0.30.3_aarch64.dmg',
            'Agents.Commander_0.30.3_amd64.AppImage',
            'Agents.Commander_0.30.3_amd64.deb',
            'Agents.Commander_0.30.3_x64-setup.exe',
            'Agents.Commander_0.30.3_x64.dmg',
            'Agents.Commander_aarch64.app.tar.gz',
            'Agents.Commander_x64.app.tar.gz',
            'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64',
            'agentscommander-mac-aarch64.app.tar.gz',
            'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz',
            'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe',
            'SHASUMS256.txt',
          ];
          const sortBytes = (a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b));
          async function request(url, options = {}) {
            let response;
            try { response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } }); }
            catch (error) { fail(`Release API transport failure: ${error.message}`); }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!response.ok) fail(`Release API returned HTTP ${response.status}`);
            return bytes;
          }
          async function list(base) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const value = JSON.parse((await request(`${base}/assets?per_page=100&page=${page}`)).toString('utf8'));
              if (!Array.isArray(value)) fail('asset page is not an array');
              all.push(...value);
              if (value.length < 100) return all;
            }
          }
          (async () => {
            const release = JSON.parse((await request(`https://api.github.com/repos/${process.env.REPO}/releases/tags/v0.30.3`)).toString('utf8'));
            if (release.tag_name !== 'v0.30.3' || release.draft !== false || release.prerelease !== false || release.immutable !== true) fail('predecessor Release state differs');
            const listed = await list(`https://api.github.com/repos/${process.env.REPO}/releases/${release.id}`);
            const names = listed.map((asset) => asset.name);
            if (listed.length !== 16 || new Set(names).size !== 16 ||
                names.slice().sort(sortBytes).join('\n') !== expected.slice().sort(sortBytes).join('\n')) fail('predecessor 16-name ledger differs');
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'predecessor-assets-'));
            const byName = new Map(listed.map((asset) => [asset.name, asset]));
            for (const name of expected) {
              const asset = byName.get(name);
              if (!asset || asset.state !== 'uploaded' || asset.size <= 0 || !/^sha256:[0-9a-f]{64}$/.test(asset.digest || '')) fail(`predecessor asset differs: ${name}`);
              const bytes = await request(asset.url, { headers: { Accept: 'application/octet-stream' } });
              if (!bytes.length) fail(`predecessor asset is empty: ${name}`);
              fs.writeFileSync(path.join(dir, name), bytes);
            }
            const manifest = fs.readFileSync(path.join(dir, 'SHASUMS256.txt'));
            const manifestAsset = byName.get('SHASUMS256.txt');
            if (crypto.createHash('sha256').update(manifest).digest('hex') !== manifestAsset.digest.slice(7)) fail('predecessor manifest API digest differs');
            fs.writeFileSync(path.join(dir, 'predecessor-assets.json'), JSON.stringify({ release, assets: listed }));
            fs.writeFileSync(path.join(dir, 'predecessor-ledger.txt'), `${expected.join('\n')}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PREDECESSOR_DIR=${dir}\n`);
          })().catch((error) => fail(error.stack || error.message));
          NODE

      - name: Verify the predecessor checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PREDECESSOR_DIR" && sha256sum -c SHASUMS256.txt)

      - name: Verify the predecessor checksum map against API digests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const fail = (message) => { console.error(`::error::PRE_PUBLICATION_ATTESTATION_AUTHORIZATION_FAILED: ${message}`); process.exit(1); };
          const { assets } = JSON.parse(fs.readFileSync(path.join(process.env.PREDECESSOR_DIR, 'predecessor-assets.json'), 'utf8'));
          const data = assets.filter((asset) => asset.name !== 'SHASUMS256.txt');
          const raw = fs.readFileSync(path.join(process.env.PREDECESSOR_DIR, 'SHASUMS256.txt'), 'utf8');
          if (raw.includes('\r')) fail('predecessor manifest contains CR bytes');
          const lines = raw.trimEnd().split('\n');
          if (lines.length !== 15) fail('predecessor manifest does not have 15 data records');
          const map = new Map();
          for (const line of lines) {
            const match = line.match(/^([0-9a-f]{64})  (.+)$/);
            if (!match || map.has(match[2]) || match[2] === 'SHASUMS256.txt') fail('predecessor manifest record is malformed or duplicated');
            map.set(match[2], match[1]);
          }
          if (map.size !== data.length || data.some((asset) => map.get(asset.name) !== asset.digest.slice(7))) fail('predecessor manifest/API map differs');
          NODE

      - name: Install the SHA-verified GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="$RUNNER_TEMP/gh-2.98.0"
          mkdir -p "$cli_dir"
          archive="$cli_dir/gh_2.98.0_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
          printf '%s  %s\n' 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$cli_dir"
          gh_bin="$cli_dir/gh_2.98.0_linux_amd64/bin/gh"
          "$gh_bin" --version | tee "$PREDECESSOR_DIR/gh-version.txt"
          "$gh_bin" --version | grep -E '^gh version 2\.98\.0 '
          echo "GH_BIN=$gh_bin" >> "$GITHUB_ENV"

      - name: Verify immutable predecessor Release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$GH_BIN" release verify v0.30.3 --repo mblua/AgentsCommander --format json | tee "$PREDECESSOR_DIR/release-verify.json"

      - name: Verify all immutable predecessor asset attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r asset; do
            index=$((index + 1))
            "$GH_BIN" release verify-asset v0.30.3 "$PREDECESSOR_DIR/$asset" --repo mblua/AgentsCommander --format json | tee "$PREDECESSOR_DIR/asset-verify-$index.json"
          done < "$PREDECESSOR_DIR/predecessor-ledger.txt"
          test "$index" = 16

  publish-github:
    name: publish-github
    needs: [checksums, verify-attestation-authority, guard, prepare-release]
    runs-on: ubuntu-22.04
    permissions:

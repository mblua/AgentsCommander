# Temporary I3528 acquisition only. MUST NEVER MERGE; no debt ceiling is selected here.
name: Clippy seven native measurement

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      S: 4481370e87f47b986503dfc1f359b970d0ec2ca6
      SOURCE_TREE: d641b90715ad34853bf884e47a12429f99ce1558
      W: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      E: ${{ runner.temp }}/i3528-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ROOT: ${{ runner.temp }}/i3528-source-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize evidence
        run: |
          set -euo pipefail
          mkdir "$E"
          date -u +%FT%TZ > "$E/started"
          uname -a > "$E/host.txt"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate measured source S
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W"
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$SOURCE_ROOT" \
            > "$E/clone.stdout" 2> "$E/clone.stderr"
          git -C "$SOURCE_ROOT" checkout --detach "$S" \
            > "$E/checkout.stdout" 2> "$E/checkout.stderr"
          git -C "$SOURCE_ROOT" rev-parse HEAD 'HEAD^{tree}' > "$E/source-before.txt"
          git -C "$SOURCE_ROOT" status --porcelain --untracked-files=no > "$E/status-before.txt"
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$S"
          test "$(git -C "$SOURCE_ROOT" rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test ! -s "$E/status-before.txt"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Capture pinned prerequisites
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          capture() {
            local name=$1
            shift
            printf '%q ' "$@" > "$E/$name.command"
            date -u +%FT%TZ > "$E/$name.started"
            set +e
            "$@" > "$E/$name.stdout" 2> "$E/$name.stderr"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$E/$name.exit"
            date -u +%FT%TZ > "$E/$name.finished"
            return "$rc"
          }
          capture npm-pin npm install -g npm@11.6.2 --ignore-scripts
          capture linux-deps bash scripts/ci-install-linux-deps.sh
          capture npm-ci npm ci --ignore-scripts
          capture frontend npm run build
          node --version > "$E/node-version.txt"
          npm --version > "$E/npm-version.txt"
          test "$(npm --version)" = 11.6.2

      - name: Install Rust 1.98.1 and Clippy
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
          toolchain: '1.98.1'

      - name: Record tools and effective controls
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/src-tauri"
          pwd > "$E/cwd.txt"
          rustc +1.98.1 -vV > "$E/rustc.txt"
          cargo +1.98.1 clippy --version > "$E/clippy.txt"
          test "$(sed -n 's/^release: //p' "$E/rustc.txt")" = 1.98.1
          grep -q '^clippy 0.1.98 ' "$E/clippy.txt"
          command -v cargo > "$E/cargo-path.txt"
          command -v rustc > "$E/rustc-path.txt"
          rustup which --toolchain 1.98.1 cargo > "$E/pinned-cargo-path.txt"
          rustup which --toolchain 1.98.1 rustc > "$E/pinned-rustc-path.txt"
          rustup which --toolchain 1.98.1 clippy-driver > "$E/driver-path.txt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const {E, SOURCE_ROOT: root} = process.env;
          const save = (name, value) => fs.writeFileSync(path.join(E, name),
            JSON.stringify(value, null, 2) + '\n');
          const keys = ['RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_BUILD_RUSTFLAGS',
            'CLIPPY_CONF_DIR', 'CARGO_MANIFEST_DIR', 'RUSTC', 'RUSTC_WRAPPER',
            'RUSTC_WORKSPACE_WRAPPER', 'RUSTUP_TOOLCHAIN', 'CARGO_HOME', 'CARGO_TARGET_DIR',
            'CARGO_BUILD_BUILD_DIR'];
          keys.push(...Object.keys(process.env).filter(k => /^CARGO_TARGET_.*RUSTFLAGS$/.test(k)));
          const environment = Object.fromEntries(keys.map(k => [k, process.env[k] ?? null]));
          save('environment.json', environment);
          const errors = [];
          const inside = p => p === root || p.startsWith(root + path.sep);
          for (const [key, value] of Object.entries(environment)) {
            if (!value) continue;
            if (key === 'CARGO_HOME') continue;
            if (key === 'RUSTUP_TOOLCHAIN' && value === '1.98.1') continue;
            if (key === 'CARGO_MANIFEST_DIR' && inside(path.resolve(value))) continue;
            errors.push(`Unexplained inherited control ${key}`);
          }
          // Cargo configuration lookup: cwd ancestors, then Cargo home; both legacy names.
          const candidates = new Set();
          for (let dir = process.cwd();; dir = path.dirname(dir)) {
            for (const name of ['config', 'config.toml']) {
              candidates.add(path.join(dir, '.cargo', name));
            }
            if (dir === path.dirname(dir)) break;
          }
          const cargoHome = process.env.CARGO_HOME || path.join(process.env.HOME, '.cargo');
          for (const name of ['config', 'config.toml']) candidates.add(path.join(cargoHome, name));
          const configs = [...candidates].map(filename => {
            if (!fs.existsSync(filename)) return {filename, present: false};
            const bytes = fs.readFileSync(filename);
            const text = bytes.toString('utf8');
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            // S has only build.jobs=4. Any additional config needs explanation before capture.
            const approved = filename === path.join(root, '.cargo', 'config.toml') &&
              text.replace(/\r/g, '').trim() === '[build]\njobs = 4';
            if (!approved) errors.push(`Unexplained Cargo configuration ${filename}`);
            return {filename, present: true, bytes: bytes.length, sha256, approved,
              childEnvironment: /\[env(?:\.|\])/.test(text) ? 'present; blocked' : 'absent'};
          });
          save('cargo-configs.json', configs);
          const files = execFileSync('git', ['ls-files', '-z'], {cwd: root, encoding: 'utf8'})
            .split('\0').filter(Boolean).filter(p => /(^|\/)Cargo\.(toml|lock)$/.test(p) ||
              /(^|\/)(rust-toolchain(?:\.toml)?|\.?clippy\.toml)$/.test(p) ||
              /(^|\/)\.cargo\/config(?:\.toml)?$/.test(p));
          save('source-inputs.json', files.map(name => {
            const bytes = fs.readFileSync(path.join(root, name));
            return {name, bytes: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex')};
          }));
          save('effective-controls.json', {cwd: process.cwd(), errors,
            clippySelection: 'S root clippy.toml; no CLIPPY_CONF_DIR or external selector',
            cargoChildEnvironment: 'No accepted Cargo config has [env] redirection',
            build: 'S .cargo/config.toml build.jobs=4; default target/build-dir retained',
            limitations: ['Direct driver bypasses wrappers; cache correctness remains unproven',
              'Force-warn and positive controls do not prove universal coverage',
              'macOS unmeasured']});
          if (errors.length) throw new Error(errors.join('\n'));
          JS

      - name: Capture Cargo and corrected direct-driver control
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT/src-tauri"
          flags=( -D warnings
            --force-warn clippy::cognitive_complexity --force-warn clippy::too_many_lines
            --force-warn clippy::doc_markdown --force-warn clippy::implicit_clone
            --force-warn clippy::map_unwrap_or --force-warn clippy::match_same_arms
            --force-warn clippy::semicolon_if_nothing_returned
            --force-warn clippy::unnested_or_patterns --force-warn clippy::map_err_ignore )
          for mode in all production; do
            selector=( --all-targets )
            if [ "$mode" = production ]; then selector=( --lib --bins ); fi
            printf '%q ' cargo +1.98.1 clippy --locked --workspace "${selector[@]}" \
              --message-format=json -- "${flags[@]}" > "$E/$mode.command"
            date -u +%FT%TZ > "$E/$mode.started"
            set +e
            cargo +1.98.1 clippy --locked --workspace "${selector[@]}" \
              --message-format=json -- "${flags[@]}" \
              > "$E/$mode.jsonl" 2> "$E/$mode.stderr"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$E/$mode.exit"
            date -u +%FT%TZ > "$E/$mode.finished"
          done
          cat > "$E/control.rs" <<'RS'
          /// Uses SomeType in prose.
          pub fn docs() {}
          pub fn clone_site(v: Vec<u8>) -> Vec<u8> { v.to_vec() }
          pub fn option_site(v: Option<u8>) -> u8 { v.map(|x| x + 1).unwrap_or(0) }
          pub fn arms(v: u8) -> u8 {
              match v { 1 => 7, 2 => 7, _ => 9 }
          }
          pub fn unit_site(v: &mut Vec<u8>) {
              v.push(1)
          }
          pub fn patterns(v: Option<u8>) -> bool {
              matches!(v, Some(1) | Some(2))
          }
          pub enum Failure { Invalid }
          pub fn error_site(v: Result<u8, u8>) -> Result<u8, Failure> {
              v.map_err(|_| Failure::Invalid)
          }
          pub fn two_sites(a: Vec<u8>, b: Vec<u8>) -> (Vec<u8>, Vec<u8>) {
              (a.to_vec(), b.to_vec())
          }
          macro_rules! clone_expression { ($v:expr) => { $v.to_vec() }; }
          pub fn macro_site(v: Vec<u8>) -> Vec<u8> { clone_expression!(v) }
          RS
          driver=$(rustup which --toolchain 1.98.1 clippy-driver)
          printf '%q ' "$driver" --crate-name i3528_control --crate-type lib --edition=2021 \
            --emit=metadata --error-format=json "$E/control.rs" \
            -o "$E/control.rmeta" "${flags[@]}" > "$E/control.command"
          date -u +%FT%TZ > "$E/control.started"
          set +e
          "$driver" --crate-name i3528_control --crate-type lib --edition=2021 \
            --emit=metadata --error-format=json "$E/control.rs" \
            -o "$E/control.rmeta" "${flags[@]}" \
            > "$E/control.stdout" 2> "$E/control.jsonl"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$E/control.exit"
          date -u +%FT%TZ > "$E/control.finished"

      - name: Validate captures and describe observations
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const {E, SOURCE_ROOT: root} = process.env;
          const codes = ['doc_markdown', 'implicit_clone', 'map_unwrap_or', 'match_same_arms',
            'semicolon_if_nothing_returned', 'unnested_or_patterns', 'map_err_ignore']
            .map(c => `clippy::${c}`);
          const errors = [];
          const read = name => fs.readFileSync(path.join(E, name), 'utf8');
          const save = (name, value) => fs.writeFileSync(path.join(E, name),
            JSON.stringify(value, null, 2) + '\n');
          function stream(name) {
            const text = read(name);
            if (!text.trim()) throw new Error(`${name}: empty capture`);
            const lines = text.endsWith('\n') ? text.slice(0, -1).split('\n') : text.split('\n');
            return lines.map((line, i) => {
              try { return JSON.parse(line); }
              catch { throw new Error(`${name}:${i + 1}: malformed JSON`); }
            });
          }
          function receipt(name) {
            for (const suffix of ['command', 'started', 'finished', 'exit']) {
              if (!read(`${name}.${suffix}`).trim()) errors.push(`${name}: missing ${suffix}`);
            }
            if (read(`${name}.exit`).trim() !== '0') errors.push(`${name}: original exit nonzero`);
          }
          const observations = {};
          for (const mode of ['all', 'production']) {
            receipt(mode);
            const records = stream(`${mode}.jsonl`);
            const terminals = records.filter(r => r.reason === 'build-finished');
            if (terminals.length !== 1 || terminals[0].success !== true ||
                records.at(-1) !== terminals[0]) errors.push(`${mode}: incomplete terminal`);
            const diagnostics = records.filter(r => r.reason === 'compiler-message');
            if (diagnostics.some(r => r.message.level === 'error' ||
                r.message.level === 'failure-note')) errors.push(`${mode}: error diagnostics`);
            const selected = diagnostics.filter(r => codes.includes(r.message.code?.code));
            const counts = Object.fromEntries(codes.map(c => [c,
              selected.filter(r => r.message.code.code === c).length]));
            // Keep target/profile identities and full spans, children, fixes and expansion chains.
            observations[mode] = {platform: 'linux', records: records.length, counts,
              targets: [...new Set(selected.map(r => JSON.stringify({package_id: r.package_id,
                target: r.target, profile: r.profile})))].map(t => JSON.parse(t)),
              selected, otherDiagnostics: diagnostics.filter(r =>
                !codes.includes(r.message.code?.code))};
          }
          receipt('control');
          const control = stream('control.jsonl');
          if (control.some(r => r.level === 'error' || r.level === 'failure-note')) {
            errors.push('control: error diagnostics');
          }
          const activated = new Set(control.map(r => r.code?.code).filter(Boolean));
          for (const code of codes) {
            if (!activated.has(code)) errors.push(`control: missing ${code}`);
          }
          const normalize = filename => filename.startsWith(root + '/')
            ? filename.slice(root.length + 1) : filename;
          function candidate(record) {
            return JSON.stringify({code: record.message.code?.code,
              spans: record.message.spans.map(s => ({file: normalize(s.file_name),
                byte_start: s.byte_start, byte_end: s.byte_end, is_primary: s.is_primary}))});
          }
          const groups = new Map();
          for (const mode of ['all', 'production']) {
            observations[mode].selected.forEach((record, index) => {
              const key = candidate(record);
              if (!groups.has(key)) groups.set(key, {candidate: JSON.parse(key), all: [],
                production: []});
              groups.get(key)[mode].push({index, package_id: record.package_id,
                target: record.target, profile: record.profile});
            });
          }
          const membership = [...groups.values()].map(g => ({...g,
            status: g.all.length === 1 && g.production.length === 1 ? 'one-to-one candidate' :
              g.all.length && g.production.length ? 'ambiguous/repeated targets' : 'unmatched'}));
          const diagnosticShapes = control.filter(r => codes.includes(r.code?.code)).map(r => ({
            code: r.code.code, spans: r.spans, children: r.children}));
          const macroLine = read('control.rs').split('\n')
            .findIndex(line => line.startsWith('pub fn macro_site')) + 1;
          const macroDiagnostics = control.filter(r => r.spans?.some(s =>
            s.line_start === macroLine || s.expansion));
          save('observations.json', {observations, membership, diagnosticShapes,
            macro: {present: macroDiagnostics.length > 0, diagnostics: macroDiagnostics,
              limit: 'Absence supplies no macro expansion shape; no emission assumed'},
            repeatedTargets: membership.filter(g => g.all.length > 1 || g.production.length > 1),
            distinctSameFunctionSpans: diagnosticShapes.filter(r =>
              r.spans.some(s => s.line_start === 19)),
            limitations: ['Exact spans are candidate groups, not final identity or deduplication',
              'Unmatched/ambiguous production membership blocks final design, not hidden here',
              'Raw originals retain doc/expression spans, children, suggestions and expansions',
              'macOS unmeasured; cache replay and controls cannot prove universal coverage'],
            errors});
          if (errors.length) throw new Error(errors.join('\n'));
          JS

      - name: Verify source custody after execution
        if: always()
        run: |
          set -euo pipefail
          git -C "$SOURCE_ROOT" rev-parse HEAD 'HEAD^{tree}' > "$E/source-after.txt"
          git -C "$SOURCE_ROOT" status --porcelain --untracked-files=no > "$E/status-after.txt"
          test "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" = "$S"
          test "$(git -C "$SOURCE_ROOT" rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test ! -s "$E/status-after.txt"

      - name: Hash every evidence file and record provenance
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$E"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const env = process.env;
          const files = fs.readdirSync(env.E).sort().filter(name => name !== 'manifest.json')
            .map(name => {
              const bytes = fs.readFileSync(path.join(env.E, name));
              return {name, bytes: bytes.length,
                sha256: crypto.createHash('sha256').update(bytes).digest('hex')};
            });
          const read = name => fs.existsSync(path.join(env.E, name))
            ? fs.readFileSync(path.join(env.E, name), 'utf8') : null;
          const commands = Object.fromEntries(files.filter(f => f.name.endsWith('.command'))
            .map(f => {
              const name = f.name.slice(0, -8);
              return [name, {argv: read(f.name), exit: read(`${name}.exit`),
                started: read(`${name}.started`), finished: read(`${name}.finished`)}];
            }));
          const manifest = {S: env.S, sourceTree: env.SOURCE_TREE, W: env.W,
            eventSha: env.EVENT_SHA, pr: {number: env.PR_NUMBER, base: env.PR_BASE, head: env.W},
            run: {id: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT,
              url: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/` +
                env.GITHUB_RUN_ID}, platform: 'linux', host: read('host.txt'),
            started: read('started'), finished: new Date().toISOString(), status: env.JOB_STATUS,
            cwd: read('cwd.txt'), rustc: read('rustc.txt'), clippy: read('clippy.txt'),
            commands, effectiveControlsFile: 'effective-controls.json', files};
          fs.writeFileSync(path.join(env.E, 'manifest.json'),
            JSON.stringify(manifest, null, 2) + '\n');
          JS

      - name: Upload native evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i3528-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E }}
          if-no-files-found: error
          retention-days: 14

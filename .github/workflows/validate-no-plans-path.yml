name: Validate no plans path

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-no-plans-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-no-plans-path:
    name: validate-no-plans-path
    # Skip branch-deletion push events (after-SHA is all zeros). The guard is scoped to
    # push because `github.event.after` is absent on pull_request, where GitHub casts the
    # comparison operands to numbers and the whole condition evaluates false.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Reads the git index of the checked-out tree, so it catches a path however it
      # arrived: `git add -f`, `git commit --no-verify`, or `git push --no-verify`.
      - name: Reject tracked paths under plans/
        run: node scripts/validate-no-plans-path.mjs

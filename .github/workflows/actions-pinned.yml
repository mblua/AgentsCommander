name: Actions pinned

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: actions-pinned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-pinned:
    name: actions-pinned
    # Skip branch-deletion push events (after-SHA is all zeros); same guard as
    # validate-no-plans-path.yml.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Self-test
        run: node scripts/check-actions-pinned.mjs --self-test

      - name: Reject uses not pinned to a commit SHA with a version comment
        run: node scripts/check-actions-pinned.mjs

name: npm audit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Pin npm version
        run: npm install -g npm@11.6.2 --ignore-scripts

      - name: Self-test
        run: node scripts/check-npm-audit.mjs --self-test

      - name: npm audit gate
        run: node scripts/check-npm-audit.mjs

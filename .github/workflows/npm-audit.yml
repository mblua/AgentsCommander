name: npm audit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pin npm version
        run: npm install -g npm@12.2.3 --ignore-scripts

      - name: Self-test
        run: node scripts/check-npm-audit.mjs --self-test

      - name: npm audit gate
        run: node scripts/check-npm-audit.mjs

name: Cache warm

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: cache-warm-main
  cancel-in-progress: false

jobs:
  warm-debug:
    name: warm-debug
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned for #2234
        with:
          components: clippy
          toolchain: '1.98.1'

      - name: Record toolchain identity
        run: rustc -vV

      - name: Rust cache
        id: cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-debug'
          env-vars: 'ImageOS'

      - name: cargo check
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo clippy
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings --force-warn clippy::cognitive_complexity --force-warn clippy::too_many_lines

      - name: cargo test (compile only)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: cargo test --locked --lib --bins --tests --no-run

  warm-release:
    name: warm-release
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Record toolchain identity
        run: rustc -vV

      - name: Rust cache
        id: cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-release'
          env-vars: 'ImageOS'

      - name: Build Windows release binary
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build:prod:no-bundle

      # The release test harnesses pull in dev-dependencies and their features,
      # which the binary build above never compiles. Warm them too, so
      # issue-1850-release-windows and issue-1850-profile-windows (release)
      # restore them instead of compiling them on every pull request.
      - name: cargo test --release (compile only)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: cargo test --locked --release --lib --test issue_1850_default_root --no-run

  # The macOS release dependencies for issue-1850-release-macos. PR regression
  # gates never runs on main, so without this every pull request compiled them
  # cold. Only dependencies are cached; the crate itself still compiles per run.
  warm-release-macos:
    name: warm-release-macos
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2 --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Record toolchain identity
        run: rustc -vV

      - name: Rust cache
        id: cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-release-macos'
          env-vars: 'ImageOS'

      - name: cargo test --release (compile only)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src-tauri
        run: cargo test --locked --release --lib --no-run

  # The .deb files the Linux jobs of pr-regression-gates.yml restore (#3190).
  # One entry per runner image; a new one is saved only when the set of
  # packages changes.
  warm-apt-linux:
    name: warm-apt-linux (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: apt cache key
        id: apt_key
        run: echo "prefix=apt-debs-${ImageOS}-" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt_key.outputs.prefix }}none
          restore-keys: ${{ steps.apt_key.outputs.prefix }}

      - name: Install Tauri system dependencies
        run: bash scripts/ci-install-linux-deps.sh

      - name: Key the cache by its package set
        id: content
        env:
          PREFIX: ${{ steps.apt_key.outputs.prefix }}
        run: |
          set -euo pipefail
          digest=$(find ~/apt-debs -maxdepth 1 -name '*.deb' -printf '%f\n' | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "key=${PREFIX}${digest}" >> "$GITHUB_OUTPUT"

      - name: Save apt package cache
        if: steps.content.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.content.outputs.key }}

  verify-warm-debug:
    name: verify-warm-debug
    needs: warm-debug
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned for #2234
        with:
          components: clippy
          toolchain: '1.98.1'

      - name: Probe debug cache
        id: probe
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-debug'
          env-vars: 'ImageOS'
          save-if: 'false'
          lookup-only: 'true'

      - name: Fail if the debug cache is not present
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          Write-Error "No exact gate-debug cache entry exists after the warm job. The warm job's save step failed silently or the key diverged. PR gates will run cold until this is fixed."
          exit 1

  verify-warm-release:
    name: verify-warm-release
    needs: warm-release
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Probe release cache
        id: probe
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-release'
          env-vars: 'ImageOS'
          save-if: 'false'
          lookup-only: 'true'

      - name: Fail if the release cache is not present
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          Write-Error "No exact gate-release cache entry exists after the warm job. The warm job's save step failed silently or the key diverged. PR gates will run cold until this is fixed."
          exit 1

  verify-warm-release-macos:
    name: verify-warm-release-macos
    needs: warm-release-macos
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Probe macOS release cache
        id: probe
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-release-macos'
          env-vars: 'ImageOS'
          save-if: 'false'
          lookup-only: 'true'

      - name: Fail if the macOS release cache is not present
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          echo "::error::No exact gate-release-macos cache entry exists after the warm job. The warm job's save step failed silently or the key diverged. issue-1850-release-macos will run cold until this is fixed."
          exit 1

name: cargo deny

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: '0.20.2'
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - name: Install cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download"
          archive="$RUNNER_TEMP/${name}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$archive" \
            "${base}/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"

      - name: cargo deny check
        shell: bash
        run: cargo deny --locked check

name: Bundle validation

on:
  pull_request:
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/tauri.prod.conf.json'
      - 'src-tauri/nsis/**'
      - 'src-tauri/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.lock'
      - '.github/workflows/bundle-validation.yml'
      - 'packaging/windows/**'
      - 'scripts/pack-windows-portable.mjs'
      - 'scripts/smoke-windows-portable.ps1'

permissions:
  contents: read

concurrency:
  group: bundle-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-validation:
    name: bundle-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-release'
          env-vars: 'ImageOS'
          save-if: 'false'

      - name: Build installers (MSI and NSIS)
        run: npm run build:prod

      - name: Assert both installers exist
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path 'target/release/bundle/msi' -Filter '*.msi' -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Path 'target/release/bundle/nsis' -Filter '*-setup.exe' -ErrorAction SilentlyContinue
          if (-not $msi) { Write-Error 'No MSI produced'; exit 1 }
          if (-not $nsis) { Write-Error 'No NSIS installer produced'; exit 1 }
          Write-Host "MSI: $($msi.Name)"
          Write-Host "NSIS: $($nsis.Name)"

      # The portable zip is assembled and smoked here as well as in release.yml
      # (#1589). The release path is the only other place it runs, and there a
      # failure is discovered with a tag already pushed; this gate answers the
      # same questions on the pull request instead.
      - name: Pack and smoke the Windows portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "dist-portable/agentscommander-$version-windows-x86_64-portable.zip"

          node scripts/pack-windows-portable.mjs `
            --binary target/release/agentscommander.exe `
            --version $version `
            --out $zip
          if ($LASTEXITCODE -ne 0) { throw "packing the portable zip failed" }

          pwsh -File scripts/smoke-windows-portable.ps1 -Zip $zip -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { throw "the portable zip failed its smoke test" }

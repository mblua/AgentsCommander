name: probe clippy macOS cross (temporary; deleted before merge)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install -g npm@11.6.2 && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
          toolchain: '1.98.1'
          targets: aarch64-apple-darwin
      - name: cross clippy
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin \
            -- -D warnings --force-warn clippy::cognitive_complexity 2>&1 | tee clippy.log
          echo "exit=${PIPESTATUS[0]}"
          grep -E "^error" clippy.log | sort | uniq -c | sort -rn | head -20

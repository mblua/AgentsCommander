name: Flaky test rate

on:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: flaky-rate
  cancel-in-progress: false

jobs:
  flaky-rate:
    name: flaky-rate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Collect observations and build the report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/flaky-rate.mjs --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/flaky-rate"
      - name: Open or update advisory quarantine issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/flaky-quarantine.mjs --repo "$GITHUB_REPOSITORY"
          --report "$RUNNER_TEMP/flaky-rate/report.json" --out "$RUNNER_TEMP/flaky-rate"
      - name: Upload history
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-rate-history
          path: ${{ runner.temp }}/flaky-rate/history.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-rate-report
          path: |
            ${{ runner.temp }}/flaky-rate/report.json
            ${{ runner.temp }}/flaky-rate/report.md
            ${{ runner.temp }}/flaky-rate/quarantine.json
          retention-days: 90
          if-no-files-found: ignore

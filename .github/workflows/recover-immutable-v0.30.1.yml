              name: 'Agents Commander v0.30.1',
              prerelease: false,
              tagName: 'v0.30.1',
              tagObjectSha: process.env.TAG_OBJECT_SHA,
              targetCommitish: process.env.RELEASE_SHA,
            },
            repository: {
              id: Number(process.env.REPOSITORY_ID),
              name: 'mblua/AgentsCommander',
            },

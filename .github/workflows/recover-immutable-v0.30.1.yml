name: Recover immutable Release v0.30.1
run-name: Recover immutable Release v0.30.1

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-v0.30.1
  cancel-in-progress: false

jobs:
  prepare-recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.finalize.outputs.release_id }}
      release_mode: ${{ steps.finalize.outputs.release_mode }}
      repository_id: ${{ steps.validate.outputs.repository_id }}
      tag_object_sha: ${{ steps.validate.outputs.tag_object_sha }}
      release_sha: ${{ steps.validate.outputs.release_sha }}
      history_snapshot_hash: ${{ steps.validate.outputs.history_snapshot_hash }}
      release_body_hash: ${{ steps.validate.outputs.release_body_hash }}
      release_body_base64: ${{ steps.validate.outputs.release_body_base64 }}
      failed_run_proof_hash: ${{ steps.validate.outputs.failed_run_proof_hash }}
    steps:
      - name: Check out the fixed release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: da116e0b2463d6ebec6ace5495e2954d6d8ccbee
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Read the immutable setting for initial authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_ADMIN_TOKEN }}
          OUTPUT_PATH: ${{ runner.temp }}/immutable-setting-initial.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const https = require('node:https');
          const path = require('node:path');

          const token = process.env.GH_TOKEN;
          if (typeof token !== 'string' || token.length === 0) {
            throw new Error('the immutable-release admin-read credential is unavailable');
          }
          const runnerTemp = path.resolve(process.env.RUNNER_TEMP);
          const output = path.resolve(process.env.OUTPUT_PATH);
          if (!output.startsWith(runnerTemp + path.sep) || fs.existsSync(output)) {
            throw new Error('the bounded immutable-setting output path is invalid');
          }

          const request = https.request({
            hostname: 'api.github.com',
            method: 'GET',
            path: '/repos/mblua/AgentsCommander/immutable-releases',
            port: 443,
            protocol: 'https:',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + token,
              'User-Agent': 'AgentsCommander-recovery-v0.30.1',
              'X-GitHub-Api-Version': '2026-03-10',
            },
          });
          request.setTimeout(30000, () => request.destroy(new Error('immutable-setting request timed out')));
          request.on('response', (response) => {
            const chunks = [];
            let size = 0;
            response.on('data', (chunk) => {
              size += chunk.length;
              if (size > 65536) {
                request.destroy(new Error('immutable-setting response exceeded 65536 bytes'));
                return;
              }
              chunks.push(chunk);
            });
            response.on('end', () => {
              if (response.statusCode !== 200) {
                throw new Error('immutable-setting request did not return HTTP 200');
              }
              const parsed = JSON.parse(Buffer.concat(chunks).toString('utf8'));
              if (
                !parsed
                || typeof parsed !== 'object'
                || Array.isArray(parsed)
                || parsed.enabled !== true
                || parsed.enforced_by_owner !== false
              ) {
                throw new Error('immutable-setting response is not the authorized exact state');
              }
              fs.writeFileSync(
                output,
                JSON.stringify({ enabled: true, enforced_by_owner: false }) + '\n',
                { flag: 'wx', mode: 0o600 },
              );
            });
          });
          request.on('error', (error) => {
            throw error;
          });
          request.end();
          NODE

      - name: Validate recovery authority, evidence, and classify the release
        id: validate
        shell: bash
        env:
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_REF_NAME: ${{ github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW: ${{ github.workflow }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_sha="da116e0b2463d6ebec6ace5495e2954d6d8ccbee"
          tag_object_sha="5e4da64d42acf341580ff5de623d18539e267c8e"
          [[ "$EXPECTED_REPOSITORY" == "mblua/AgentsCommander" ]]
          [[ "$EXPECTED_EVENT" == "workflow_dispatch" ]]
          [[ "$EXPECTED_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_REF_NAME" == "main" ]]
          [[ "$EXPECTED_WORKFLOW" == "Recover immutable Release v0.30.1" ]]
          [[ "$EXPECTED_WORKFLOW_REF" == "mblua/AgentsCommander/.github/workflows/recover-immutable-v0.30.1.yml@refs/heads/main" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$EXPECTED_SHA" ]]
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          jq -e '((.inputs // {}) | type == "object" and length == 0)' "$GITHUB_EVENT_PATH" > /dev/null
          [[ "$(node --version)" == "v22.23.2" ]]
          [[ "$(npm --version)" == "10.9.8" ]]
          [[ "$(gh --version | head -n 1 | awk '{print $3}')" == "2.86.0" ]]
          [[ -z "$(git status --porcelain=v1)" ]]
          [[ "$(git rev-parse HEAD)" == "$release_sha" ]]
          [[ "$(git cat-file -t "$release_sha")" == "commit" ]]
          git merge-base --is-ancestor "$release_sha" "$EXPECTED_SHA"

          check_blob() {
            local commit="$1"
            local file="$2"
            local expected="$3"
            [[ "$(git rev-parse "$commit:$file")" == "$expected" ]]
          }
          check_blob "$release_sha" ".github/workflows/release.yml" "a5e437996ea3a91e0688842f80e6c466f35cff19"
          check_blob "$release_sha" "CHANGELOG.md" "b0095eac4158e3fa575de36b1f4be9ada94b542e"
          check_blob "$release_sha" "scripts/check-version-sync.mjs" "0ef5d4507f43873d3bd1062fcb78bd2d6a59d83f"
          check_blob "$release_sha" "package.json" "9c821a40c7e74c8c7e1e8dacb0694f18ac5b717b"
          check_blob "$release_sha" "package-lock.json" "5212baf5c045b665990a3734e1a0628fa82f1960"
          check_blob "$release_sha" "npm/package.json" "40c9d0c706a609254eff0c053ea3edddfdf1393d"
          check_blob "$release_sha" "npm/install.js" "b99725505ffc6937b9a85bee796e0668d6dd20a6"
          check_blob "$release_sha" "Cargo.lock" "f3fe3d2c9acc2c5acf531ffa9208768500223b7e"
          check_blob "$release_sha" "src-tauri/Cargo.toml" "4c254ebb849346ee678824562a2d4d2b642636cd"
          check_blob "$release_sha" "src-tauri/tauri.conf.json" "36a0915839395ea228705ffd6e788ddbc1472a44"
          check_blob "$release_sha" "src-tauri/tauri.prod.conf.json" "794c9f54191b8e73aa113d0e707e58201e16f0ba"
          check_blob "$release_sha" "scripts/copy-testable-binary.mjs" "6a58510b4b351846bdd33af494494b867cdf6983"
          check_blob "$EXPECTED_SHA" ".github/workflows/release.yml" "a5e437996ea3a91e0688842f80e6c466f35cff19"
          check_blob "$EXPECTED_SHA" "CHANGELOG.md" "b0095eac4158e3fa575de36b1f4be9ada94b542e"
          git cat-file -e "$EXPECTED_SHA:.github/workflows/recover-immutable-v0.30.1.yml"
          npm run version:check

          [[ "$(git cat-file -t refs/tags/v0.30.1)" == "tag" ]]
          [[ "$(git rev-parse refs/tags/v0.30.1)" == "$tag_object_sha" ]]
          [[ "$(git rev-parse refs/tags/v0.30.1^{commit})" == "$release_sha" ]]
          [[ "$(git cat-file -t refs/tags/v0.30.0)" == "tag" ]]
          [[ "$(git rev-parse refs/tags/v0.30.0^{commit})" == "45530b46b0a3d4bfe8715ac8b19916df98b6f8cd" ]]

          NOTES_PATH="$RUNNER_TEMP/release-notes.md" node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = /^## 0\.30\.1[ \t]*$/gm;
          const matches = [...text.matchAll(heading)];
          if (matches.length !== 1) {
            throw new Error(`expected one 0.30.1 changelog heading, found ${matches.length}`);
          }
          const start = matches[0].index + matches[0][0].length;
          const rest = text.slice(start);
          const next = rest.search(/^## [^\r\n]+$/m);
          const body = (next === -1 ? rest : rest.slice(0, next)).trim();
          if (!body) {
            throw new Error('0.30.1 changelog body is empty');
          }
          fs.writeFileSync(process.env.NOTES_PATH, body + '\n', { flag: 'wx' });
          NODE
          release_body_hash="$(sha256sum -- "$RUNNER_TEMP/release-notes.md" | awk '{print $1}')"
          [[ "$release_body_hash" =~ ^[0-9a-f]{64}$ ]]
          release_body_base64="$(base64 -w 0 -- "$RUNNER_TEMP/release-notes.md")"
          [[ -n "$release_body_base64" && "$release_body_base64" != *$'\n'* ]]

          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander \
            > "$RUNNER_TEMP/repository.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/git/ref/heads/main \
            > "$RUNNER_TEMP/main-ref.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/git/ref/tags/v0.30.1 \
            > "$RUNNER_TEMP/tag-ref-v0.30.1.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/git/tags/$tag_object_sha" \
            > "$RUNNER_TEMP/tag-object-v0.30.1.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/git/ref/tags/v0.30.0 \
            > "$RUNNER_TEMP/tag-ref-v0.30.0.json"
          previous_tag_object="$(jq -r '.object.sha' "$RUNNER_TEMP/tag-ref-v0.30.0.json")"
          [[ "$previous_tag_object" =~ ^[0-9a-f]{40}$ ]]
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/git/tags/$previous_tag_object" \
            > "$RUNNER_TEMP/tag-object-v0.30.0.json"

          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/actions/runs/32791566112 \
            > "$RUNNER_TEMP/failed-run.json"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/actions/runs/32791566112/attempts/1/jobs?per_page=100" \
            > "$RUNNER_TEMP/failed-run-jobs-pages.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/actions/runs/32791566112/artifacts?per_page=100" \
            > "$RUNNER_TEMP/failed-run-artifacts.json"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/actions/workflows/249288854/runs?per_page=100" \
            > "$RUNNER_TEMP/tag-workflow-runs-pages.json"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/actions/workflows/recover-immutable-v0.30.1.yml/runs?per_page=100" \
            > "$RUNNER_TEMP/recovery-runs-pages.json"
          mkdir "$RUNNER_TEMP/recovery-attempt-jobs"
          RECOVERY_RUNS="$RUNNER_TEMP/recovery-runs-pages.json" \
          REQUESTS="$RUNNER_TEMP/recovery-attempt-requests.txt" \
          node <<'NODE'
          const fs = require('node:fs');
          const pages = JSON.parse(fs.readFileSync(process.env.RECOVERY_RUNS, 'utf8'));
          if (
            !Array.isArray(pages)
            || pages.length === 0
            || pages.some(
              (page) => !page
                || typeof page !== 'object'
                || !Number.isInteger(page.total_count)
                || !Array.isArray(page.workflow_runs),
            )
          ) {
            throw new Error('recovery-run pagination is malformed');
          }
          const runs = pages.flatMap((page) => page.workflow_runs);
          if (pages.some((page) => page.total_count !== runs.length)) {
            throw new Error('recovery-run pagination is incomplete');
          }
          const expectedRunId = Number(process.env.EXPECTED_RUN_ID);
          const expectedAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
          const seenIds = new Set();
          const requests = [];
          for (const run of runs) {
            const runId = Number(run.id);
            const runAttempt = Number(run.run_attempt);
            const current = runId === expectedRunId;
            if (
              !Number.isInteger(runId)
              || runId <= 0
              || seenIds.has(runId)
              || !Number.isInteger(runAttempt)
              || runAttempt <= 0
              || run.event !== 'workflow_dispatch'
              || run.head_branch !== 'main'
              || !/^[0-9a-f]{40}$/.test(run.head_sha)
              || run.path !== '.github/workflows/recover-immutable-v0.30.1.yml'
              || (current && (
                runAttempt !== expectedAttempt
                || run.status !== 'in_progress'
                || run.conclusion !== null
                || run.head_sha !== process.env.EXPECTED_SHA
              ))
              || (!current && (
                run.status !== 'completed'
                || typeof run.conclusion !== 'string'
                || run.conclusion.length === 0
              ))
            ) {
              throw new Error('recovery-run identity or terminal state is not exact');
            }
            seenIds.add(runId);
            const lastPriorAttempt = current ? runAttempt - 1 : runAttempt;
            for (let attempt = 1; attempt <= lastPriorAttempt; attempt += 1) {
              requests.push({ attempt, runId });
            }
          }
          if (!seenIds.has(expectedRunId)) {
            throw new Error('the current recovery run is missing');
          }
          requests.sort((left, right) => left.runId - right.runId || left.attempt - right.attempt);
          const text = requests.map(({ attempt, runId }) => `${runId} ${attempt}`).join('\n');
          fs.writeFileSync(process.env.REQUESTS, text === '' ? '' : text + '\n', { flag: 'wx' });
          NODE
          while IFS=' ' read -r recovery_run_id recovery_attempt; do
            [[ "$recovery_run_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$recovery_attempt" =~ ^[1-9][0-9]*$ ]]
            gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/mblua/AgentsCommander/actions/runs/$recovery_run_id/attempts/$recovery_attempt/jobs?per_page=100" \
              > "$RUNNER_TEMP/recovery-attempt-jobs/$recovery_run_id-$recovery_attempt.json"
          done < "$RUNNER_TEMP/recovery-attempt-requests.txt"

          PROOF_PATH="$RUNNER_TEMP/failed-run-proof.json" node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          function pages(path, key) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (
              !Array.isArray(value)
              || value.length === 0
              || value.some(
                (page) => !page
                  || typeof page !== 'object'
                  || !Number.isInteger(page.total_count)
                  || !Array.isArray(page[key]),
              )
            ) {
              throw new Error('paginated API response is malformed');
            }
            const items = value.flatMap((page) => page[key]);
            if (value.some((page) => page.total_count !== items.length)) {
              throw new Error('paginated API total_count does not match the exhausted item set');
            }
            return items;
          }
          const repository = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/repository.json', 'utf8'));
          const mainRef = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/main-ref.json', 'utf8'));
          const tagRef = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/tag-ref-v0.30.1.json', 'utf8'));
          const tagObject = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/tag-object-v0.30.1.json', 'utf8'));
          const previousRef = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/tag-ref-v0.30.0.json', 'utf8'));
          const previousObject = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/tag-object-v0.30.0.json', 'utf8'));
          if (
            repository.full_name !== 'mblua/AgentsCommander'
            || repository.default_branch !== 'main'
            || !Number.isInteger(repository.id)
            || repository.id <= 0
            || mainRef.ref !== 'refs/heads/main'
            || mainRef.object?.type !== 'commit'
            || mainRef.object?.sha !== process.env.EXPECTED_SHA
            || tagRef.ref !== 'refs/tags/v0.30.1'
            || tagRef.object?.type !== 'tag'
            || tagRef.object?.sha !== '5e4da64d42acf341580ff5de623d18539e267c8e'
            || tagObject.sha !== '5e4da64d42acf341580ff5de623d18539e267c8e'
            || tagObject.tag !== 'v0.30.1'
            || tagObject.object?.type !== 'commit'
            || tagObject.object?.sha !== 'da116e0b2463d6ebec6ace5495e2954d6d8ccbee'
            || previousRef.ref !== 'refs/tags/v0.30.0'
            || previousRef.object?.type !== 'tag'
            || previousObject.sha !== previousRef.object.sha
            || previousObject.tag !== 'v0.30.0'
            || previousObject.object?.type !== 'commit'
            || previousObject.object?.sha !== '45530b46b0a3d4bfe8715ac8b19916df98b6f8cd'
          ) {
            throw new Error('repository, main, or remote tag identity is not exact');
          }

          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/failed-run.json', 'utf8'));
          const jobs = pages(process.env.RUNNER_TEMP + '/failed-run-jobs-pages.json', 'jobs');
          const artifacts = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + '/failed-run-artifacts.json', 'utf8'),
          );
          const tagRuns = pages(
            process.env.RUNNER_TEMP + '/tag-workflow-runs-pages.json',
            'workflow_runs',
          )
            .filter((item) => (
              item.event === 'push'
              && item.head_branch === 'v0.30.1'
              && item.head_sha === 'da116e0b2463d6ebec6ace5495e2954d6d8ccbee'
            ));
          const recoveryRuns = pages(
            process.env.RUNNER_TEMP + '/recovery-runs-pages.json',
            'workflow_runs',
          );
          function recoveryAttemptProof(runs, directory) {
            const expectedRunId = Number(process.env.EXPECTED_RUN_ID);
            const expectedAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            const seenIds = new Set();
            const proof = [];
            for (const recoveryRun of runs) {
              const runId = Number(recoveryRun.id);
              const runAttempt = Number(recoveryRun.run_attempt);
              const current = runId === expectedRunId;
              if (
                !Number.isInteger(runId)
                || runId <= 0
                || seenIds.has(runId)
                || !Number.isInteger(runAttempt)
                || runAttempt <= 0
                || recoveryRun.event !== 'workflow_dispatch'
                || recoveryRun.head_branch !== 'main'
                || !/^[0-9a-f]{40}$/.test(recoveryRun.head_sha)
                || recoveryRun.path !== '.github/workflows/recover-immutable-v0.30.1.yml'
                || (current && (
                  runAttempt !== expectedAttempt
                  || recoveryRun.status !== 'in_progress'
                  || recoveryRun.conclusion !== null
                  || recoveryRun.head_sha !== process.env.EXPECTED_SHA
                ))
                || (!current && (
                  recoveryRun.status !== 'completed'
                  || typeof recoveryRun.conclusion !== 'string'
                  || recoveryRun.conclusion.length === 0
                ))
              ) {
                throw new Error('recovery-run identity or terminal state is not exact');
              }
              seenIds.add(runId);
              const lastPriorAttempt = current ? runAttempt - 1 : runAttempt;
              for (let attempt = 1; attempt <= lastPriorAttempt; attempt += 1) {
                const attemptJobs = pages(
                  path.join(directory, `${runId}-${attempt}.json`),
                  'jobs',
                );
                const prepareJobs = attemptJobs.filter((job) => job.name === 'prepare-recovery');
                const prepareJob = prepareJobs[0];
                const createSteps = Array.isArray(prepareJob?.steps)
                  ? prepareJob.steps.filter(
                    (step) => step.name === 'Create the sole fresh draft and reconcile its result',
                  )
                  : [];
                const createStep = createSteps[0];
                const prepareJobValid = prepareJobs.length === 1
                  && Number.isInteger(Number(prepareJob.id))
                  && Number(prepareJob.id) > 0
                  && prepareJob.status === 'completed'
                  && typeof prepareJob.conclusion === 'string'
                  && prepareJob.conclusion.length > 0;
                const createStepValid = createSteps.length === 1
                  && Number.isInteger(Number(createStep.number))
                  && Number(createStep.number) > 0
                  && typeof createStep.status === 'string'
                  && typeof createStep.conclusion === 'string';
                const state = prepareJobValid
                  && createStepValid
                  && createStep.status === 'completed'
                  && createStep.conclusion === 'skipped'
                  ? 'skipped'
                  : 'crossed-or-ambiguous';
                proof.push({
                  createStep: createStepValid ? {
                    conclusion: createStep.conclusion,
                    name: createStep.name,
                    number: createStep.number,
                    status: createStep.status,
                  } : null,
                  prepareJob: prepareJobValid ? {
                    conclusion: prepareJob.conclusion,
                    id: prepareJob.id,
                    name: prepareJob.name,
                    status: prepareJob.status,
                  } : null,
                  runAttempt: attempt,
                  runId,
                  state,
                });
              }
            }
            if (!seenIds.has(expectedRunId)) {
              throw new Error('the current recovery run is missing');
            }
            return proof.sort(
              (left, right) => left.runId - right.runId || left.runAttempt - right.runAttempt,
            );
          }
          const recoveryAttempts = recoveryAttemptProof(
            recoveryRuns,
            path.join(process.env.RUNNER_TEMP, 'recovery-attempt-jobs'),
          );
          const recoveryFreshSafe = recoveryAttempts.every(
            (attempt) => attempt.state === 'skipped',
          );
          if (
            Number(run.id) !== 32791566112
            || Number(run.run_attempt) !== 1
            || Number(run.workflow_id) !== 249288854
            || run.status !== 'completed'
            || run.conclusion !== 'failure'
            || run.event !== 'push'
            || run.head_branch !== 'v0.30.1'
            || run.head_sha !== 'da116e0b2463d6ebec6ace5495e2954d6d8ccbee'
            || run.path !== '.github/workflows/release.yml'
            || run.repository?.full_name !== 'mblua/AgentsCommander'
            || run.created_at !== '2026-08-24T23:56:42Z'
            || run.updated_at !== '2026-08-24T23:56:57Z'
          ) {
            throw new Error('the frozen failed workflow run changed');
          }

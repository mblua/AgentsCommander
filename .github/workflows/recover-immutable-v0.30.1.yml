      - name: Read the immutable setting for final verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_ADMIN_TOKEN }}
          OUTPUT_PATH: ${{ runner.temp }}/immutable-setting-final.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const https = require('node:https');
          const path = require('node:path');
          const token = process.env.GH_TOKEN;
          if (typeof token !== 'string' || token.length === 0) {
            throw new Error('the immutable-release admin-read credential is unavailable');
          }
          const runnerTemp = path.resolve(process.env.RUNNER_TEMP);
          const output = path.resolve(process.env.OUTPUT_PATH);
          if (!output.startsWith(runnerTemp + path.sep) || fs.existsSync(output)) {
            throw new Error('the bounded immutable-setting output path is invalid');
          }
          const request = https.request({
            hostname: 'api.github.com',
            method: 'GET',
            path: '/repos/mblua/AgentsCommander/immutable-releases',
            port: 443,
            protocol: 'https:',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + token,
              'User-Agent': 'AgentsCommander-recovery-v0.30.1',
              'X-GitHub-Api-Version': '2026-03-10',
            },
          });
          request.setTimeout(30000, () => request.destroy(new Error('immutable-setting request timed out')));
          request.on('response', (response) => {
            const chunks = [];
            let size = 0;
            response.on('data', (chunk) => {
              size += chunk.length;
              if (size > 65536) {
                request.destroy(new Error('immutable-setting response exceeded 65536 bytes'));
                return;
              }
              chunks.push(chunk);
            });
            response.on('end', () => {
              if (response.statusCode !== 200) {
                throw new Error('immutable-setting request did not return HTTP 200');
              }
              const parsed = JSON.parse(Buffer.concat(chunks).toString('utf8'));
              if (
                !parsed
                || typeof parsed !== 'object'
                || Array.isArray(parsed)
                || parsed.enabled !== true
                || parsed.enforced_by_owner !== false
              ) {
                throw new Error('immutable-setting response is not the authorized exact state');
              }
              fs.writeFileSync(
                output,
                JSON.stringify({ enabled: true, enforced_by_owner: false }) + '\n',
                { flag: 'wx', mode: 0o600 },
              );
            });
          });
          request.on('error', (error) => {
            throw error;
          });
          request.end();
          NODE


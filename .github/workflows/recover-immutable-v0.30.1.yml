              throw new Error('publication-boundary pagination is incomplete');
            }
            return items;
          };
          const repository = read('repository-before-patch.json');
          const main = read('main-before-patch.json');
          const tagRef = read('tag-ref-before-patch.json');
          const tagObject = read('tag-object-before-patch.json');
          const workflowBlob = read('main-workflow-blob-before-patch.json');
          const changelogBlob = read('main-changelog-blob-before-patch.json');
          const run = read('failed-run-before-patch.json');
          const jobs = flatten('failed-jobs-before-patch.json', 'jobs');
          const artifacts = read('failed-artifacts-before-patch.json');
          const tagRuns = flatten('tag-runs-before-patch.json', 'workflow_runs').filter((item) => (
            item.event === 'push'
            && item.head_branch === 'v0.30.1'
            && item.head_sha === process.env.RELEASE_SHA
          ));
          const recoveryRuns = flatten('recovery-runs-before-patch.json', 'workflow_runs');
          function recoveryAttemptProof(runs, directory) {
            const expectedRunId = Number(process.env.EXPECTED_RUN_ID);
            const expectedAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
            const seenIds = new Set();
            const proof = [];
            for (const recoveryRun of runs) {
              const runId = Number(recoveryRun.id);
              const runAttempt = Number(recoveryRun.run_attempt);
              const current = runId === expectedRunId;
              if (
                !Number.isInteger(runId)
                || runId <= 0
                || seenIds.has(runId)
                || !Number.isInteger(runAttempt)
                || runAttempt <= 0
                || recoveryRun.event !== 'workflow_dispatch'
                || recoveryRun.head_branch !== 'main'
                || !/^[0-9a-f]{40}$/.test(recoveryRun.head_sha)
                || recoveryRun.path !== '.github/workflows/recover-immutable-v0.30.1.yml'
                || (current && (
                  runAttempt !== expectedAttempt
                  || recoveryRun.status !== 'in_progress'
                  || recoveryRun.conclusion !== null
                  || recoveryRun.head_sha !== process.env.EXPECTED_SHA
                ))
                || (!current && (
                  recoveryRun.status !== 'completed'
                  || typeof recoveryRun.conclusion !== 'string'

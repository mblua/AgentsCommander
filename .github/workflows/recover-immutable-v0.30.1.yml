              || release.immutable !== true
              || typeof release.published_at !== 'string'
              || !Array.isArray(release.assets)
              || release.assets.length !== 16
            ) {
              throw new Error('final immutable readback changed after attestation verification');
            }
            const byName = new Map(release.assets.map((asset) => [asset.name, asset]));
            for (const record of records) {
              const asset = byName.get(record.name);
              if (
                !asset
                || asset.id !== record.id
                || asset.size !== record.size
                || asset.digest !== record.digest
                || asset.url !== record.url
                || asset.browser_download_url !== record.browserUrl
              ) {
                throw new Error('final asset readback changed: ' + record.name);
              }
            }
          }
          const tag = JSON.parse(fs.readFileSync(process.env.FINAL_TAG, 'utf8'));
          if (
            tag.ref !== 'refs/tags/v0.30.1'
            || tag.object?.type !== 'tag'
            || tag.object?.sha !== process.env.TAG_OBJECT_SHA
          ) {
            throw new Error('final annotated tag object changed');
          }
          NODE

          evidence="$RUNNER_TEMP/final-evidence"
          mkdir "$evidence"
          EVIDENCE="$evidence" \
          ASSET_RECORDS="$records" \
          FINAL_RELEASE="$RUNNER_TEMP/published-release-final.json" \
          FINAL_HISTORY_HASH="$final_history_hash" \
          FINAL_DOWNLOADS="$final_downloads" \
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          function canonical(value) {
            if (Array.isArray(value)) {
              return value.map(canonical);
            }
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonical(value[key])]),
              );
            }
            return value;
          }
          const release = JSON.parse(fs.readFileSync(process.env.FINAL_RELEASE, 'utf8'));
          const assets = JSON.parse(fs.readFileSync(process.env.ASSET_RECORDS, 'utf8'))
            .map((asset) => ({
              browserUrl: asset.browserUrl,
              digest: asset.digest,
              id: asset.id,
              name: asset.name,
              size: asset.size,
              url: asset.url,
            }))
            .sort((left, right) => left.name.localeCompare(right.name, 'en'));
          const checksumHash = crypto.createHash('sha256')
            .update(fs.readFileSync(path.join(process.env.FINAL_DOWNLOADS, 'SHASUMS256.txt')))
            .digest('hex');
          const attestationBytes = fs.readFileSync(
            process.env.RUNNER_TEMP + '/attestation-verification.json',
          );
          const attestationHash = crypto.createHash('sha256').update(attestationBytes).digest('hex');
          const immutableManifest = canonical({
            assets,
            release: {
              bodySha256: process.env.EXPECTED_BODY_HASH,
              draft: false,
              htmlUrl: release.html_url,
              id: Number(process.env.RELEASE_ID),
              immutable: true,
              name: 'Agents Commander v0.30.1',
              prerelease: false,
              publishedAt: release.published_at,
              tagName: 'v0.30.1',
              tagObjectSha: process.env.TAG_OBJECT_SHA,
              targetCommitish: process.env.RELEASE_SHA,
              url: release.url,
            },
            repository: {
              id: Number(process.env.REPOSITORY_ID),
              name: 'mblua/AgentsCommander',
            },
          });
          const immutablePath = path.join(
            process.env.EVIDENCE,
            'release-manifest-immutable.json',
          );
          fs.writeFileSync(immutablePath, JSON.stringify(immutableManifest) + '\n', {
            flag: 'wx',
          });
          const immutableHash = crypto.createHash('sha256')
            .update(fs.readFileSync(immutablePath))
            .digest('hex');
          fs.writeFileSync(
            immutablePath + '.sha256',
            immutableHash + '  release-manifest-immutable.json\n',
            { flag: 'wx' },
          );
          const finalRecord = canonical({
            attestations: {
              recordSha256: attestationHash,
              releaseVerified: true,
              verifiedAssetCount: 16,
            },
            failedRunProofSha256: process.env.EXPECTED_FAILED_PROOF_HASH,
            historicalSnapshotSha256: process.env.FINAL_HISTORY_HASH,
            immutableManifestSha256: immutableHash,
            npmVersion0301Absent: true,
            publication: {
              commandStatus: process.env.PUBLISH_COMMAND_STATUS === ''
                ? null
                : Number(process.env.PUBLISH_COMMAND_STATUS),
              httpStatus: process.env.PUBLISH_HTTP_STATUS === ''
                ? null
                : Number(process.env.PUBLISH_HTTP_STATUS),
              httpStatusState: process.env.PUBLISH_HTTP_STATUS_STATE,
              invoked: process.env.PUBLISH_INVOKED === 'true',
              outcome: process.env.PUBLISH_OUTCOME,
              reconciliation: process.env.RECONCILIATION_STATUS,
              responseStderrBytes: process.env.PUBLISH_STDERR_BYTES === ''
                ? null
                : Number(process.env.PUBLISH_STDERR_BYTES),
              responseStderrSha256: process.env.PUBLISH_STDERR_SHA256 || null,
              responseStdoutBytes: process.env.PUBLISH_STDOUT_BYTES === ''
                ? null
                : Number(process.env.PUBLISH_STDOUT_BYTES),
              responseStdoutSha256: process.env.PUBLISH_STDOUT_SHA256 || null,
            },
            recovery: {
              headSha: process.env.EXPECTED_SHA,
              mode: process.env.RELEASE_MODE,
              reconstructionStatus: process.env.RELEASE_MODE === 'resume'
                ? process.env.RECONSTRUCTION_STATUS
                : 'not-required',
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              runId: Number(process.env.GITHUB_RUN_ID),
              workflowPath: '.github/workflows/recover-immutable-v0.30.1.yml',
            },
            release: immutableManifest.release,
            releaseAssets: assets,
            releaseSha: process.env.RELEASE_SHA,
            repository: immutableManifest.repository,
            shasums256Sha256: checksumHash,
            tagObjectSha: process.env.TAG_OBJECT_SHA,
          });
          fs.writeFileSync(
            path.join(process.env.EVIDENCE, 'final-evidence.json'),
            JSON.stringify(finalRecord) + '\n',
            { flag: 'wx' },
          );
          const commandStatuses = canonical({
            assetVerify: assets.map((asset) => ({ name: asset.name, status: 0 })),
            finalImmutableSettingRead: 0,
            finalReleaseByIdRead: 0,
            finalReleaseByTagRead: 0,
            finalSnapshotValidation: 0,
            finalTagObjectRead: 0,
            npmAbsenceRead: 0,
            publishCommandStatus: process.env.PUBLISH_COMMAND_STATUS === ''
              ? null
              : Number(process.env.PUBLISH_COMMAND_STATUS),
            publishHttpStatus: process.env.PUBLISH_HTTP_STATUS === ''
              ? null
              : Number(process.env.PUBLISH_HTTP_STATUS),
            publishHttpStatusState: process.env.PUBLISH_HTTP_STATUS_STATE,
            publishResponseStderrBytes: process.env.PUBLISH_STDERR_BYTES === ''
              ? null
              : Number(process.env.PUBLISH_STDERR_BYTES),
            publishResponseStderrSha256: process.env.PUBLISH_STDERR_SHA256 || null,
            publishResponseStdoutBytes: process.env.PUBLISH_STDOUT_BYTES === ''
              ? null
              : Number(process.env.PUBLISH_STDOUT_BYTES),
            publishResponseStdoutSha256: process.env.PUBLISH_STDOUT_SHA256 || null,
            publishStepOutcome: process.env.PUBLISH_OUTCOME,
            reconciliation: 0,
            releaseVerify: 0,
            resumeReconstruction: process.env.RELEASE_MODE === 'resume' ? 0 : null,
          });
          fs.writeFileSync(
            path.join(process.env.EVIDENCE, 'command-statuses.json'),
            JSON.stringify(commandStatuses) + '\n',
            { flag: 'wx' },
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'immutable_manifest_hash=' + immutableHash + '\n');
          NODE

          cp -- "$RUNNER_TEMP/immutable-setting-final.json" "$evidence/immutable-setting.json"
          cp -- "$RUNNER_TEMP/published-release-final.json" "$evidence/published-release.json"
          cp -- "$RUNNER_TEMP/release-asset-records-final.json" "$evidence/release-assets.json"
          cp -- "$RUNNER_TEMP/failed-run-proof-final.json" "$evidence/failed-run-proof.json"
          cp -- "$RUNNER_TEMP/historical-snapshot-final.json" "$evidence/historical-releases.json"
          cp -- "$RUNNER_TEMP/attestation-verification.json" "$evidence/attestation-verification.json"
          cp -- "$RUNNER_TEMP/release-verify.json" "$evidence/release-verify.json"
          cp -- "$final_downloads/SHASUMS256.txt" "$evidence/SHASUMS256.txt"
          for index in $(seq 1 16); do
            ordinal="$(printf '%02d' "$index")"
            cp -- \
              "$RUNNER_TEMP/asset-verify-$ordinal.json" \
              "$evidence/asset-verify-$ordinal.json"
          done

          EVIDENCE="$evidence" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = [
            'SHASUMS256.txt',
            'attestation-verification.json',
            ...Array.from(
              { length: 16 },
              (_, index) => 'asset-verify-' + String(index + 1).padStart(2, '0') + '.json',
            ),
            'command-statuses.json',
            'failed-run-proof.json',
            'final-evidence.json',
            'historical-releases.json',
            'immutable-setting.json',
            'published-release.json',
            'release-assets.json',
            'release-manifest-immutable.json',
            'release-manifest-immutable.json.sha256',
            'release-verify.json',
          ].sort();
          const entries = fs.readdirSync(process.env.EVIDENCE, { withFileTypes: true });
          if (
            entries.length !== expected.length
            || entries.some(
              (entry) => !entry.isFile()
                || entry.isSymbolicLink()
                || fs.statSync(path.join(process.env.EVIDENCE, entry.name)).size <= 0,
            )
            || JSON.stringify(entries.map((entry) => entry.name).sort())
              !== JSON.stringify(expected)
          ) {
            throw new Error('final recovery evidence inventory is not closed');
          }
          NODE

      - name: Upload final immutable-release evidence
        id: final-evidence-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recover-v0.30.1-${{ github.run_id }}-${{ github.run_attempt }}-final-evidence
          path: ${{ runner.temp }}/final-evidence/*
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 90

      - name: Record final immutable-release evidence
        id: final-record
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.final-evidence-upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.final-evidence-upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.final-evidence-upload.outputs.artifact-url }}
          IMMUTABLE_MANIFEST_HASH: ${{ steps.verify.outputs.immutable_manifest_hash }}
          RELEASE_ID: ${{ needs.prepare-recovery.outputs.release_id }}
          RELEASE_MODE: ${{ needs.prepare-recovery.outputs.release_mode }}
          RELEASE_SHA: ${{ needs.prepare-recovery.outputs.release_sha }}
          TAG_OBJECT_SHA: ${{ needs.prepare-recovery.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_URL" == "https://github.com/mblua/AgentsCommander/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID" ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$IMMUTABLE_MANIFEST_HASH" =~ ^[0-9a-f]{64}$ ]]
          jq -n \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson releaseId "$RELEASE_ID" \
            --arg releaseMode "$RELEASE_MODE" \
            --arg tagObjectSha "$TAG_OBJECT_SHA" \
            --arg releaseSha "$RELEASE_SHA" \
            --argjson artifactId "$ARTIFACT_ID" \
            --arg artifactUrl "$ARTIFACT_URL" \
            --arg artifactDigest "$ARTIFACT_DIGEST" \
            --arg immutableManifestHash "$IMMUTABLE_MANIFEST_HASH" \
            '{
              runId: $runId,
              runAttempt: $runAttempt,
              releaseId: $releaseId,
              releaseMode: $releaseMode,
              tagObjectSha: $tagObjectSha,
              releaseSha: $releaseSha,
              artifactId: $artifactId,
              artifactUrl: $artifactUrl,
              artifactDigest: $artifactDigest,
              immutableManifestHash: $immutableManifestHash
            }' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_url=$ARTIFACT_URL"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "immutable_manifest_hash=$IMMUTABLE_MANIFEST_HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Record safe publication failure guidance
        if: ${{ failure() }}
        shell: bash
        env:
          PUBLISH_INVOKED: ${{ steps.publish.outputs.mutation_invoked }}
        run: |
          set -euo pipefail
          {
            echo "### Recovery publication stopped"
            if [[ "$PUBLISH_INVOKED" == "true" ]]; then
              echo "The publication PATCH was invoked. Query the exact external state first."
            else
              echo "No publication PATCH was invoked by this job."
            fi
            echo "Do not rerun, rebuild, reupload, retag, delete, recreate, or republish from uncertainty."
          } >> "$GITHUB_STEP_SUMMARY"

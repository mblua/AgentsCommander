            echo "reconciliation_status=verified"
            echo "publish_invoked=${PUBLISH_INVOKED:-false}"
            echo "publish_outcome=$PUBLISH_OUTCOME"
            echo "publish_command_status=$PUBLISH_COMMAND_STATUS"
            echo "publish_http_status=$PUBLISH_HTTP_STATUS"
            echo "publish_http_status_state=${PUBLISH_HTTP_STATUS_STATE:-not-invoked}"
            echo "publish_response_stdout_sha256=$PUBLISH_STDOUT_SHA256"
            echo "publish_response_stderr_sha256=$PUBLISH_STDERR_SHA256"
            echo "publish_response_stdout_bytes=$PUBLISH_STDOUT_BYTES"
            echo "publish_response_stderr_bytes=$PUBLISH_STDERR_BYTES"

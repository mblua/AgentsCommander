            /repos/mblua/AgentsCommander/releases/tags/v0.30.1 \
            > "$RUNNER_TEMP/draft-before-patch-by-tag.json"

          PROOF_PATH="$RUNNER_TEMP/failed-proof-before-patch.json" node <<'NODE'
          const crypto = require('node:crypto');

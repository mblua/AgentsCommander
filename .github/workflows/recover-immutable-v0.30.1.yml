            for (const remote of release.assets) {
              if (byName.has(remote.name) || ids.has(remote.id)) {
                throw new Error('publication reconciliation has duplicate assets');
              }
              byName.set(remote.name, remote);
              ids.add(remote.id);
            }
            for (const expected of manifest.assets) {
              const remote = byName.get(expected.name);
              if (
                !remote
                || remote.id !== expected.id
                || remote.size !== expected.size
                || remote.state !== 'uploaded'
                || remote.digest !== expected.digest
                || remote.url
                  !== 'https://api.github.com/repos/mblua/AgentsCommander/releases/assets/'
                    + expected.id
              ) {
                throw new Error('publication reconciliation asset changed: ' + expected.name);
              }
            }
            let candidate;
            if (
              release.draft === false
              && release.immutable === true
              && typeof release.published_at === 'string'
              && release.published_at.length > 0
            ) {
              candidate = 'immutable';
            } else if (release.draft === true && release.immutable === false) {
              candidate = 'draft';
            } else if (release.draft === false && release.immutable === false) {
              candidate = 'published-mutable';
            } else {
              throw new Error('publication reconciliation entered an invalid state');
            }
            if (state !== null && state !== candidate) {
              throw new Error('Release-by-ID and Release-by-tag states disagree');
            }
            state = candidate;
          }
          if (state === 'immutable') {
            process.exit(0);
          }
          if (state === 'published-mutable') {
            process.exit(75);
          }
          process.exit(76);
          NODE
            reconcile_rc=$?
            set -e
            if [[ "$reconcile_rc" -eq 0 ]]; then
              immutable=1
              break
            fi
            if [[ "$reconcile_rc" -eq 76 ]]; then
              echo "The publication readback is still an exact draft. Owner review is required before any later PATCH." >&2
              exit 1
            fi
            [[ "$reconcile_rc" -eq 75 ]]

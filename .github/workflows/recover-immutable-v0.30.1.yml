            JSON.stringify({ releases: snapshot }) + '\n',
            { flag: 'wx' },
          );
          NODE
          current_history_hash="$(
            sha256sum -- "$RUNNER_TEMP/historical-snapshot-before-upload.json" | awk '{print $1}'
          )"
          [[ "$current_history_hash" == "$EXPECTED_HISTORY_HASH" ]]

      - name: Read the immutable setting before the first asset upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_ADMIN_TOKEN }}
          OUTPUT_PATH: ${{ runner.temp }}/immutable-setting-before-upload.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const https = require('node:https');
          const path = require('node:path');
          const token = process.env.GH_TOKEN;
          if (typeof token !== 'string' || token.length === 0) {
            throw new Error('the immutable-release admin-read credential is unavailable');
          }
          const runnerTemp = path.resolve(process.env.RUNNER_TEMP);
          const output = path.resolve(process.env.OUTPUT_PATH);
          if (!output.startsWith(runnerTemp + path.sep) || fs.existsSync(output)) {
            throw new Error('the bounded immutable-setting output path is invalid');
          }
          const request = https.request({
            hostname: 'api.github.com',
            method: 'GET',
            path: '/repos/mblua/AgentsCommander/immutable-releases',
            port: 443,
            protocol: 'https:',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: 'Bearer ' + token,
              'User-Agent': 'AgentsCommander-recovery-v0.30.1',
              'X-GitHub-Api-Version': '2026-03-10',
            },
          });
          request.setTimeout(30000, () => request.destroy(new Error('immutable-setting request timed out')));
          request.on('response', (response) => {
            const chunks = [];
            let size = 0;
            response.on('data', (chunk) => {
              size += chunk.length;
              if (size > 65536) {
                request.destroy(new Error('immutable-setting response exceeded 65536 bytes'));
                return;
              }
              chunks.push(chunk);
            });
            response.on('end', () => {
              if (response.statusCode !== 200) {
                throw new Error('immutable-setting request did not return HTTP 200');
              }
              const parsed = JSON.parse(Buffer.concat(chunks).toString('utf8'));
              if (
                !parsed
                || typeof parsed !== 'object'
                || Array.isArray(parsed)
                || parsed.enabled !== true
                || parsed.enforced_by_owner !== false
              ) {
                throw new Error('immutable-setting response is not the authorized exact state');
              }
              fs.writeFileSync(
                output,
                JSON.stringify({ enabled: true, enforced_by_owner: false }) + '\n',
                { flag: 'wx', mode: 0o600 },
              );
            });
          });
          request.on('error', (error) => {
            throw error;
          });
          request.end();
          NODE

      - name: Upload the closed release asset set serially
        id: release-upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
          RELEASE_ID: ${{ needs.prepare-recovery.outputs.release_id }}
          RELEASE_SHA: ${{ needs.prepare-recovery.outputs.release_sha }}
        run: |
          set -euo pipefail
          assets=(
            "Agents.Commander-0.30.1-1.x86_64.rpm"
            "Agents.Commander_0.30.1_aarch64.dmg"
            "Agents.Commander_0.30.1_amd64.AppImage"
            "Agents.Commander_0.30.1_amd64.deb"
            "Agents.Commander_0.30.1_x64-setup.exe"
            "Agents.Commander_0.30.1_x64.dmg"
            "Agents.Commander_aarch64.app.tar.gz"
            "Agents.Commander_x64.app.tar.gz"
            "agentscommander-linux-x86_64"
            "agentscommander-mac-aarch64"
            "agentscommander-mac-aarch64.app.tar.gz"
            "agentscommander-mac-x86_64"
            "agentscommander-mac-x86_64.app.tar.gz"
            "agentscommander-testeable-windows-x86_64.exe"
            "agentscommander-windows-x86_64.exe"
            "SHASUMS256.txt"
          )
          cmp --silent -- \
            "$PAYLOAD_DIR/agentscommander-testeable-windows-x86_64.exe" \
            "$PAYLOAD_DIR/agentscommander-windows-x86_64.exe"
          cmp --silent -- \
            "$PAYLOAD_DIR/Agents.Commander_aarch64.app.tar.gz" \
            "$PAYLOAD_DIR/agentscommander-mac-aarch64.app.tar.gz"
          cmp --silent -- \
            "$PAYLOAD_DIR/Agents.Commander_x64.app.tar.gz" \
            "$PAYLOAD_DIR/agentscommander-mac-x86_64.app.tar.gz"
          echo "mutation_invoked=true" >> "$GITHUB_OUTPUT"
          for index in "${!assets[@]}"; do
            asset="${assets[$index]}"
            gh release upload \
              v0.30.1 \
              "$PAYLOAD_DIR/$asset" \
              --repo mblua/AgentsCommander
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/mblua/AgentsCommander/releases/$RELEASE_ID" \
              > "$RUNNER_TEMP/draft-upload-prefix-$index.json"
            EXPECTED_COUNT="$((index + 1))" \
            SNAPSHOT="$RUNNER_TEMP/draft-upload-prefix-$index.json" \
            node <<'NODE'
          const fs = require('node:fs');
          const expectedNames = [
            'Agents.Commander-0.30.1-1.x86_64.rpm',
            'Agents.Commander_0.30.1_aarch64.dmg',
            'Agents.Commander_0.30.1_amd64.AppImage',
            'Agents.Commander_0.30.1_amd64.deb',
            'Agents.Commander_0.30.1_x64-setup.exe',
            'Agents.Commander_0.30.1_x64.dmg',
            'Agents.Commander_aarch64.app.tar.gz',
            'Agents.Commander_x64.app.tar.gz',
            'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64',
            'agentscommander-mac-aarch64.app.tar.gz',
            'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz',
            'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe',
            'SHASUMS256.txt',
          ].slice(0, Number(process.env.EXPECTED_COUNT));
          const release = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8'));
          const expectedBody = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
          if (
            Number(release.id) !== Number(process.env.RELEASE_ID)
            || release.tag_name !== 'v0.30.1'
            || release.target_commitish !== process.env.RELEASE_SHA
            || release.name !== 'Agents Commander v0.30.1'
            || release.body !== expectedBody
            || release.draft !== true
            || release.prerelease !== false
            || release.immutable !== false
            || !Array.isArray(release.assets)
            || release.assets.length !== expectedNames.length
          ) {
            throw new Error('the draft prefix identity or count changed during upload');
          }
          const byName = new Map();
          const ids = new Set();
          for (const remote of release.assets) {
            if (
              !expectedNames.includes(remote.name)
              || byName.has(remote.name)
              || !Number.isInteger(remote.id)
              || remote.id <= 0
              || ids.has(remote.id)
              || !Number.isInteger(remote.size)
              || remote.size <= 0
              || remote.state !== 'uploaded'
              || !/^sha256:[0-9a-f]{64}$/.test(remote.digest)
              || remote.url
                !== 'https://api.github.com/repos/mblua/AgentsCommander/releases/assets/' + remote.id
            ) {
              throw new Error('the uploaded prefix contains an invalid asset: ' + remote.name);
            }
            byName.set(remote.name, remote);
            ids.add(remote.id);
          }
          if (expectedNames.some((name) => !byName.has(name))) {
            throw new Error('the uploaded prefix inventory is incomplete');
          }
          NODE
          done

      - name: Poll and capture uploaded release asset metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_ID: ${{ needs.prepare-recovery.outputs.release_id }}
          RELEASE_SHA: ${{ needs.prepare-recovery.outputs.release_sha }}
        run: |
          set -euo pipefail
          complete=0
          for attempt in $(seq 1 30); do
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/mblua/AgentsCommander/releases/$RELEASE_ID" \
              > "$RUNNER_TEMP/draft-assets-poll.json"
            set +e
            SNAPSHOT="$RUNNER_TEMP/draft-assets-poll.json" \
            RECORD_PATH="$RUNNER_TEMP/release-asset-records.json" \
            node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            'Agents.Commander-0.30.1-1.x86_64.rpm',
            'Agents.Commander_0.30.1_aarch64.dmg',
            'Agents.Commander_0.30.1_amd64.AppImage',
            'Agents.Commander_0.30.1_amd64.deb',
            'Agents.Commander_0.30.1_x64-setup.exe',
            'Agents.Commander_0.30.1_x64.dmg',
            'Agents.Commander_aarch64.app.tar.gz',
            'Agents.Commander_x64.app.tar.gz',
            'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64',
            'agentscommander-mac-aarch64.app.tar.gz',
            'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz',
            'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe',
            'SHASUMS256.txt',
          ];
          const release = JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8'));
          const expectedBody = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
          if (
            Number(release.id) !== Number(process.env.RELEASE_ID)
            || release.tag_name !== 'v0.30.1'
            || release.target_commitish !== process.env.RELEASE_SHA
            || release.name !== 'Agents Commander v0.30.1'
            || release.body !== expectedBody
            || release.draft !== true
            || release.prerelease !== false
            || release.immutable !== false
            || !Array.isArray(release.assets)
          ) {
            throw new Error('draft identity or state changed while polling assets');
          }
          const byName = new Map();
          const ids = new Set();
          for (const asset of release.assets) {
            if (!expected.includes(asset.name)) {
              throw new Error(`unexpected release asset: ${asset.name}`);
            }
            if (byName.has(asset.name)) {
              throw new Error(`duplicate release asset: ${asset.name}`);
            }
            byName.set(asset.name, asset);
            if (!Number.isInteger(asset.id) || asset.id <= 0 || ids.has(asset.id)) {
              throw new Error(`invalid or duplicate release asset id: ${asset.id}`);
            }
            ids.add(asset.id);
          }
          if (byName.size < expected.length) {
            process.exit(75);
          }
          const records = [];
          for (const name of expected) {
            const asset = byName.get(name);
            if (
              !asset
              || asset.state !== 'uploaded'
              || !Number.isInteger(asset.size)
              || asset.size <= 0
            ) {
              process.exit(75);
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(asset.digest)) {
              if (asset.digest == null || asset.digest === '') {
                process.exit(75);
              }
              throw new Error(`invalid release asset digest: ${name}`);
            }
            if (
              asset.url
                !== `https://api.github.com/repos/mblua/AgentsCommander/releases/assets/${asset.id}`
              || asset.browser_download_url
                !== `https://github.com/mblua/AgentsCommander/releases/download/v0.30.1/${asset.name}`
            ) {
              throw new Error(`unexpected release asset URL: ${name}`);
            }
            records.push({
              digest: asset.digest,
              id: asset.id,
              name: asset.name,
              size: asset.size,
              state: asset.state,
              url: asset.url,
            });
          }
          fs.writeFileSync(process.env.RECORD_PATH, `${JSON.stringify(records, null, 2)}\n`);
          fs.copyFileSync(process.env.SNAPSHOT, `${process.env.RUNNER_TEMP}/draft-assets-complete.json`);
          NODE
            poll_rc=$?
            set -e
            if [[ "$poll_rc" -eq 0 ]]; then
              complete=1
              break
            fi
            [[ "$poll_rc" -eq 75 ]]
            sleep 5
          done
          [[ "$complete" -eq 1 ]]

      - name: Download every release asset by captured ID
        shell: bash
        env:
          ASSET_RECORDS: ${{ runner.temp }}/release-asset-records.json
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/release-downloads"
          mkdir "$download_dir"

          record_count="$(jq 'length' "$ASSET_RECORDS")"
          [[ "$record_count" -eq 16 ]]
          for index in $(seq 0 15); do
            name="$(jq -r ".[$index].name" "$ASSET_RECORDS")"
            asset_id="$(jq -r ".[$index].id" "$ASSET_RECORDS")"
            expected_size="$(jq -r ".[$index].size" "$ASSET_RECORDS")"
            expected_digest="$(jq -r ".[$index].digest" "$ASSET_RECORDS")"
            [[ "$name" != *"/"* ]]
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]

            headers="$RUNNER_TEMP/release-asset-$index.headers"
            response="$RUNNER_TEMP/release-asset-$index.body"
            status="$(
              printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" \
                | curl \
                    --disable \
                    --silent \
                    --show-error \
                    --max-redirs 0 \
                    --config - \
                    --header "Accept: application/octet-stream" \
                    --header "X-GitHub-Api-Version: 2026-03-10" \
                    --dump-header "$headers" \
                    --output "$response" \
                    --write-out '%{http_code}' \
                    "https://api.github.com/repos/mblua/AgentsCommander/releases/assets/$asset_id"
            )"

            destination="$download_dir/$name"
            if [[ "$status" == "200" ]]; then
              mv "$response" "$destination"
            elif [[ "$status" == "302" ]]; then
              mapfile -t locations < <(
                awk '
                  BEGIN { IGNORECASE=1 }
                  /^Location:/ {
                    sub(/^Location:[[:space:]]+/, "")
                    sub(/\r$/, "")
                    print
                  }
                ' "$headers"
              )
              [[ "${#locations[@]}" -eq 1 ]]
              location="$(
                LOCATION="${locations[0]}" node <<'NODE'
          const value = process.env.LOCATION;
          const parsed = new URL(value);
          const allowedHosts = new Set([
            'objects.githubusercontent.com',
            'release-assets.githubusercontent.com',
          ]);
          if (
            parsed.protocol !== 'https:'
            || !allowedHosts.has(parsed.hostname)
            || (parsed.port !== '' && parsed.port !== '443')
            || parsed.username !== ''
            || parsed.password !== ''
            || parsed.hash !== ''
          ) {
            throw new Error('asset redirect is not an approved credential-free HTTPS URL');
          }
          process.stdout.write(parsed.href);
          NODE
              )"
              second_status="$(
                env -u GH_TOKEN curl \
                  --disable \
                  --silent \
                  --show-error \
                  --max-redirs 0 \
                  --proto '=https' \
                  --tlsv1.2 \
                  --output "$destination" \
                  --write-out '%{http_code}' \
                  "$location"
              )"
              [[ "$second_status" == "200" ]]
            else
              echo "unexpected asset download status: $status" >&2
              exit 1
            fi

            [[ -f "$destination" && ! -L "$destination" ]]
            [[ "$(stat -c '%s' "$destination")" == "$expected_size" ]]
            actual_digest="$(sha256sum -- "$destination" | awk '{print $1}')"
            [[ "sha256:$actual_digest" == "$expected_digest" ]]
            cmp --silent "$PAYLOAD_DIR/$name" "$destination"
          done

          DOWNLOAD_DIR="$download_dir" node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const records = JSON.parse(fs.readFileSync(process.env.ASSET_RECORDS, 'utf8'));
          const proof = records.map((record) => {
            const file = path.join(process.env.DOWNLOAD_DIR, record.name);
            return {
              digest: `sha256:${crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}`,
              id: record.id,
              name: record.name,
              size: fs.statSync(file).size,
            };
          });
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/remote-download-verification.json`,
            `${JSON.stringify(proof, null, 2)}\n`,
            { flag: 'wx' },
          );
          NODE

      - name: Create the canonical draft manifest and handoff
        id: manifest
        shell: bash
        env:
          ASSET_RECORDS: ${{ runner.temp }}/release-asset-records.json
          FAILED_RUN_PROOF_HASH: ${{ needs.prepare-recovery.outputs.failed_run_proof_hash }}
          HISTORY_SNAPSHOT_HASH: ${{ needs.prepare-recovery.outputs.history_snapshot_hash }}
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
          RELEASE_BODY_HASH: ${{ needs.prepare-recovery.outputs.release_body_hash }}
          RELEASE_ID: ${{ needs.prepare-recovery.outputs.release_id }}
          RELEASE_SHA: ${{ needs.prepare-recovery.outputs.release_sha }}
          REPOSITORY_ID: ${{ needs.prepare-recovery.outputs.repository_id }}
          TAG_OBJECT_SHA: ${{ needs.prepare-recovery.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-manifest-draft.json"
          MANIFEST="$manifest" node <<'NODE'
          const fs = require('node:fs');
          function canonical(value) {
            if (Array.isArray(value)) {
              return value.map(canonical);
            }
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonical(value[key])]),
              );
            }
            return value;
          }
          const sourceAssets = JSON.parse(fs.readFileSync(process.env.ASSET_RECORDS, 'utf8'));
          if (sourceAssets.length !== 16) {
            throw new Error('draft manifest requires exactly 16 assets');
          }
          const expectedNames = [
            'Agents.Commander-0.30.1-1.x86_64.rpm',
            'Agents.Commander_0.30.1_aarch64.dmg',
            'Agents.Commander_0.30.1_amd64.AppImage',
            'Agents.Commander_0.30.1_amd64.deb',
            'Agents.Commander_0.30.1_x64-setup.exe',
            'Agents.Commander_0.30.1_x64.dmg',
            'Agents.Commander_aarch64.app.tar.gz',
            'Agents.Commander_x64.app.tar.gz',
            'SHASUMS256.txt',
            'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64',
            'agentscommander-mac-aarch64.app.tar.gz',
            'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz',
            'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe',
          ];
          const compareNames = (left, right) => (
            left.name === right.name ? 0 : (left.name < right.name ? -1 : 1)
          );
          const assets = sourceAssets.map((asset) => {
            if (
              !expectedNames.includes(asset.name)
              || !Number.isInteger(asset.id)
              || asset.id <= 0
              || !Number.isInteger(asset.size)
              || asset.size <= 0
              || !/^sha256:[0-9a-f]{64}$/.test(asset.digest)
              || asset.state !== 'uploaded'
              || asset.url
                !== `https://api.github.com/repos/mblua/AgentsCommander/releases/assets/${asset.id}`
            ) {
              throw new Error(`invalid source release asset record: ${asset.name}`);
            }
            return {
              digest: asset.digest,
              id: asset.id,
              name: asset.name,
              size: asset.size,
            };
          }).sort(compareNames);
          if (
            new Set(assets.map((asset) => asset.name)).size !== 16
            || JSON.stringify(assets.map((asset) => asset.name)) !== JSON.stringify(expectedNames)
          ) {
            throw new Error('draft manifest assets are not the exact name-sorted set');
          }
          const manifest = canonical({
            assets,
            release: {
              draft: true,
              id: Number(process.env.RELEASE_ID),
              immutable: false,
              name: 'Agents Commander v0.30.1',
              prerelease: false,
              tagName: 'v0.30.1',
              tagObjectSha: process.env.TAG_OBJECT_SHA,
              targetCommitish: process.env.RELEASE_SHA,
            },
            repository: {
              id: Number(process.env.REPOSITORY_ID),
              name: 'mblua/AgentsCommander',
            },
          });
          fs.writeFileSync(process.env.MANIFEST, `${JSON.stringify(manifest)}\n`, { flag: 'wx' });
          NODE

          manifest_hash="$(sha256sum -- "$manifest" | awk '{print $1}')"
          [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' \
            "$manifest_hash" \
            "release-manifest-draft.json" \
            > "$RUNNER_TEMP/release-manifest-draft.json.sha256"

          IDENTITY_PATH="$RUNNER_TEMP/release-identity.json" node <<'NODE'
          const fs = require('node:fs');
          const identity = {
            bodySha256: process.env.RELEASE_BODY_HASH,
            failedRunProofSha256: process.env.FAILED_RUN_PROOF_HASH,
            historicalSnapshotSha256: process.env.HISTORY_SNAPSHOT_HASH,
            recovery: {
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              runId: Number(process.env.GITHUB_RUN_ID),
              workflowPath: '.github/workflows/recover-immutable-v0.30.1.yml',
            },
            release: {
              id: Number(process.env.RELEASE_ID),
              name: 'Agents Commander v0.30.1',
              tagName: 'v0.30.1',
              tagObjectSha: process.env.TAG_OBJECT_SHA,
              targetCommitish: process.env.RELEASE_SHA,
            },
            repository: {
              id: Number(process.env.REPOSITORY_ID),
              name: 'mblua/AgentsCommander',
            },
          };
          if (
            !/^[0-9a-f]{64}$/.test(identity.bodySha256)
            || !/^[0-9a-f]{64}$/.test(identity.failedRunProofSha256)
            || !/^[0-9a-f]{64}$/.test(identity.historicalSnapshotSha256)
          ) {
            throw new Error('release identity evidence hashes are invalid');
          }
          fs.writeFileSync(process.env.IDENTITY_PATH, JSON.stringify(identity) + '\n', {
            flag: 'wx',
          });
          NODE

          handoff="$RUNNER_TEMP/release-handoff"
          mkdir "$handoff"
          assets=(
            "Agents.Commander-0.30.1-1.x86_64.rpm"
            "Agents.Commander_0.30.1_aarch64.dmg"
            "Agents.Commander_0.30.1_amd64.AppImage"
            "Agents.Commander_0.30.1_amd64.deb"
            "Agents.Commander_0.30.1_x64-setup.exe"
            "Agents.Commander_0.30.1_x64.dmg"
            "Agents.Commander_aarch64.app.tar.gz"
            "Agents.Commander_x64.app.tar.gz"
            "agentscommander-linux-x86_64"
            "agentscommander-mac-aarch64"
            "agentscommander-mac-aarch64.app.tar.gz"
            "agentscommander-mac-x86_64"
            "agentscommander-mac-x86_64.app.tar.gz"
            "agentscommander-testeable-windows-x86_64.exe"
            "agentscommander-windows-x86_64.exe"
            "SHASUMS256.txt"
          )
          for asset in "${assets[@]}"; do
            cp --preserve=mode -- "$PAYLOAD_DIR/$asset" "$handoff/$asset"
          done
          cp -- "$RUNNER_TEMP/release-identity.json" "$handoff/release-identity.json"
          cp -- "$manifest" "$handoff/release-manifest-draft.json"

          HANDOFF="$handoff" node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            'Agents.Commander-0.30.1-1.x86_64.rpm',
            'Agents.Commander_0.30.1_aarch64.dmg',
            'Agents.Commander_0.30.1_amd64.AppImage',
            'Agents.Commander_0.30.1_amd64.deb',
            'Agents.Commander_0.30.1_x64-setup.exe',
            'Agents.Commander_0.30.1_x64.dmg',
            'Agents.Commander_aarch64.app.tar.gz',
            'Agents.Commander_x64.app.tar.gz',
            'SHASUMS256.txt',
            'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64',
            'agentscommander-mac-aarch64.app.tar.gz',
            'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz',
            'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe',
            'release-identity.json',
            'release-manifest-draft.json',
          ].sort();
          const entries = fs.readdirSync(process.env.HANDOFF, { withFileTypes: true });
          if (
            entries.length !== 18
            || entries.some((entry) => !entry.isFile() || entry.isSymbolicLink())
            || JSON.stringify(entries.map((entry) => entry.name).sort()) !== JSON.stringify(expected)
          ) {
            throw new Error('verified handoff does not have the exact 18-file inventory');
          }
          NODE

          echo "manifest_hash=$manifest_hash" >> "$GITHUB_OUTPUT"

      - name: Upload the verified handoff
        id: handoff-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recover-v0.30.1-${{ github.run_id }}-${{ github.run_attempt }}-verified-draft
          path: ${{ runner.temp }}/release-handoff/*
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 7

      - name: Create prepublication evidence
        shell: bash
        env:
          HANDOFF_DIGEST: ${{ steps.handoff-upload.outputs.artifact-digest }}
          HANDOFF_ID: ${{ steps.handoff-upload.outputs.artifact-id }}
          HANDOFF_URL: ${{ steps.handoff-upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          handoff_name="recover-v0.30.1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-verified-draft"
          [[ "$HANDOFF_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HANDOFF_URL" == "https://github.com/mblua/AgentsCommander/actions/runs/$GITHUB_RUN_ID/artifacts/$HANDOFF_ID" ]]
          [[ "$HANDOFF_DIGEST" =~ ^[0-9a-f]{64}$ ]]

          evidence="$RUNNER_TEMP/prepublication-evidence"
          mkdir "$evidence"
          HANDOFF_NAME="$handoff_name" \
          EVIDENCE="$evidence" \
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const identity = {
            digest: process.env.HANDOFF_DIGEST,
            id: Number(process.env.HANDOFF_ID),
            name: process.env.HANDOFF_NAME,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            runId: Number(process.env.GITHUB_RUN_ID),
            url: process.env.HANDOFF_URL,
          };
          fs.writeFileSync(
            path.join(process.env.EVIDENCE, 'handoff-artifact-identity.json'),
            `${JSON.stringify(identity, null, 2)}\n`,
            { flag: 'wx' },
          );
          NODE

          cp -- "$RUNNER_TEMP/transport-artifacts-api.json" "$evidence/transport-artifacts-api.json"
          cp -- "$RUNNER_TEMP/transport-artifacts.json" "$evidence/transport-artifacts.json"
          cp -- "$RUNNER_TEMP/draft-before-upload.json" "$evidence/draft-before-upload.json"
          cp -- "$RUNNER_TEMP/draft-assets-complete.json" "$evidence/draft-assets-complete.json"
          cp -- "$RUNNER_TEMP/release-asset-records.json" "$evidence/release-asset-records.json"
          cp -- "$RUNNER_TEMP/checksum-assertions.json" "$evidence/checksum-assertions.json"
          cp -- \
            "$RUNNER_TEMP/remote-download-verification.json" \
            "$evidence/remote-download-verification.json"
          cp -- "$RUNNER_TEMP/release-payload/SHASUMS256.txt" "$evidence/SHASUMS256.txt"
          cp -- "$RUNNER_TEMP/release-identity.json" "$evidence/release-identity.json"
          cp -- \
            "$RUNNER_TEMP/release-manifest-draft.json" \
            "$evidence/release-manifest-draft.json"
          cp -- \
            "$RUNNER_TEMP/release-manifest-draft.json.sha256" \
            "$evidence/release-manifest-draft.json.sha256"
          printf '%s\n' \
            'transport-artifact-identities=verified' \
            'transport-payloads=securely-extracted' \
            'payload-inventory=closed-15-files' \
            'checksum-rows=independently-verified' \
            'installer-substring-selections=exact-and-unique' \
            'draft-upload-state=closed-16-assets' \
            'remote-asset-downloads=byte-identical' \
            'handoff-inventory=closed-18-files' \
            'handoff-artifact-identity=recorded' \
            > "$evidence/prepublication-checks.log"

          EVIDENCE="$evidence" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = [
            'SHASUMS256.txt',
            'checksum-assertions.json',
            'draft-assets-complete.json',
            'draft-before-upload.json',
            'handoff-artifact-identity.json',
            'prepublication-checks.log',
            'release-asset-records.json',
            'release-identity.json',
            'release-manifest-draft.json',
            'release-manifest-draft.json.sha256',
            'remote-download-verification.json',
            'transport-artifacts-api.json',
            'transport-artifacts.json',
          ].sort();
          const entries = fs.readdirSync(process.env.EVIDENCE, { withFileTypes: true });
          if (
            entries.length !== expected.length
            || entries.some(
              (entry) => !entry.isFile()
                || entry.isSymbolicLink()
                || fs.statSync(path.join(process.env.EVIDENCE, entry.name)).size <= 0,
            )
            || JSON.stringify(entries.map((entry) => entry.name).sort())
              !== JSON.stringify(expected)
          ) {
            throw new Error('prepublication evidence inventory is not closed');
          }
          NODE

      - name: Upload prepublication evidence
        id: prepublication-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recover-v0.30.1-${{ github.run_id }}-${{ github.run_attempt }}-prepublication-evidence
          path: ${{ runner.temp }}/prepublication-evidence/*
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 7

      - name: Record the verified artifacts
        id: record-handoff
        shell: bash
        env:
          HANDOFF_DIGEST: ${{ steps.handoff-upload.outputs.artifact-digest }}
          HANDOFF_ID: ${{ steps.handoff-upload.outputs.artifact-id }}
          HANDOFF_URL: ${{ steps.handoff-upload.outputs.artifact-url }}
          PREPUBLICATION_DIGEST: ${{ steps.prepublication-upload.outputs.artifact-digest }}
          PREPUBLICATION_ID: ${{ steps.prepublication-upload.outputs.artifact-id }}
          PREPUBLICATION_URL: ${{ steps.prepublication-upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          HANDOFF_NAME="recover-v0.30.1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-verified-draft"
          [[ "$HANDOFF_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HANDOFF_URL" == "https://github.com/mblua/AgentsCommander/actions/runs/$GITHUB_RUN_ID/artifacts/$HANDOFF_ID" ]]
          [[ "$HANDOFF_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREPUBLICATION_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREPUBLICATION_URL" == "https://github.com/mblua/AgentsCommander/actions/runs/$GITHUB_RUN_ID/artifacts/$PREPUBLICATION_ID" ]]
          [[ "$PREPUBLICATION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "handoff_id=$HANDOFF_ID"
            echo "handoff_name=$HANDOFF_NAME"
            echo "handoff_url=$HANDOFF_URL"
            echo "handoff_digest=$HANDOFF_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Record safe upload failure guidance
        if: ${{ failure() }}
        shell: bash
        env:
          MUTATION_INVOKED: ${{ steps.release-upload.outputs.mutation_invoked }}
        run: |
          set -euo pipefail
          {
            echo "### Recovery assembly stopped"
            if [[ "$MUTATION_INVOKED" == "true" ]]; then
              echo "At least one asset upload may have been invoked. Query the exact external state first."
            else
              echo "No asset upload was invoked by this job."
            fi
            echo "Do not rerun, rebuild, reupload, retag, delete, recreate, or republish from uncertainty."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-and-verify-release:
    needs:
      - prepare-recovery
      - assemble-release
    if: ${{ always() && !cancelled() && needs.prepare-recovery.result == 'success' && (needs.prepare-recovery.outputs.release_mode == 'resume' || (needs.prepare-recovery.outputs.release_mode == 'fresh' && needs.assemble-release.result == 'success')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: da116e0b2463d6ebec6ace5495e2954d6d8ccbee
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Assert reviewed publication tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v22.23.2" ]]
          [[ "$(npm --version)" == "10.9.8" ]]
          [[ "$(gh --version | head -n 1 | awk '{print $3}')" == "2.86.0" ]]

          gh release verify --repo mblua/AgentsCommander --help \
            | grep -Fq 'gh release verify [<tag>] [flags]'
          gh release verify-asset --repo mblua/AgentsCommander --help \
            | grep -Fq 'gh release verify-asset [<tag>] <file-path> [flags]'

          timeout --version | head -n 1 | grep -Fq 'GNU coreutils'
          sha256sum --version | head -n 1 | grep -Fq 'GNU coreutils'
          sha512sum --version | head -n 1 | grep -Fq 'GNU coreutils'
          sort --version | head -n 1 | grep -Fq 'GNU coreutils'
          tar --version | head -n 1 | grep -Fq 'GNU tar'

      - name: Reconstruct the fixed release notes
        shell: bash
        env:
          EXPECTED_BODY_HASH: ${{ needs.prepare-recovery.outputs.release_body_hash }}
          RELEASE_BODY_BASE64: ${{ needs.prepare-recovery.outputs.release_body_base64 }}
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/release-notes.md" node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const encoded = process.env.RELEASE_BODY_BASE64;
          if (typeof encoded !== 'string' || encoded.length === 0) {
            throw new Error('the fixed Release body transport is empty');
          }
          const body = Buffer.from(encoded, 'base64');
          if (
            body.length === 0
            || body.toString('base64') !== encoded
            || body[body.length - 1] !== 0x0a
            || (body.length > 1 && body[body.length - 2] === 0x0a)
            || crypto.createHash('sha256').update(body).digest('hex')
              !== process.env.EXPECTED_BODY_HASH
          ) {
            throw new Error('the fixed Release body transport is not byte-exact');
          }
          fs.writeFileSync(process.env.NOTES_PATH, body, { flag: 'wx' });
          NODE

      - name: Verify the handoff artifact record
        if: ${{ needs.prepare-recovery.outputs.release_mode == 'fresh' }}
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.assemble-release.outputs.handoff_digest }}
          EXPECTED_ID: ${{ needs.assemble-release.outputs.handoff_id }}
          EXPECTED_NAME: ${{ needs.assemble-release.outputs.handoff_name }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_URL: ${{ needs.assemble-release.outputs.handoff_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_NAME" == "recover-v0.30.1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-verified-draft" ]]
          [[ "$EXPECTED_URL" == "https://github.com/mblua/AgentsCommander/actions/runs/$GITHUB_RUN_ID/artifacts/$EXPECTED_ID" ]]

          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/actions/artifacts/$EXPECTED_ID" \
            > "$RUNNER_TEMP/handoff-artifact-record.json"

          RECORD="$RUNNER_TEMP/handoff-artifact-record.json" node <<'NODE'
          const fs = require('node:fs');
          const artifact = JSON.parse(fs.readFileSync(process.env.RECORD, 'utf8'));
          if (
            Number(artifact.id) !== Number(process.env.EXPECTED_ID)
            || artifact.name !== process.env.EXPECTED_NAME
            || artifact.expired !== false
            || !Number.isInteger(artifact.size_in_bytes)
            || artifact.size_in_bytes <= 0
            || artifact.digest !== `sha256:${process.env.EXPECTED_DIGEST}`
            || artifact.created_at !== artifact.updated_at
            || artifact.url
              !== `https://api.github.com/repos/mblua/AgentsCommander/actions/artifacts/${artifact.id}`
            || artifact.archive_download_url !== `${artifact.url}/zip`
            || Number(artifact.workflow_run?.id) !== Number(process.env.GITHUB_RUN_ID)
            || artifact.workflow_run?.head_sha !== process.env.EXPECTED_SHA
          ) {
            throw new Error('handoff artifact metadata does not match its recorded identity');
          }
          NODE

      - name: Download the verified handoff only by ID
        if: ${{ needs.prepare-recovery.outputs.release_mode == 'fresh' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble-release.outputs.handoff_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-handoff
          merge-multiple: true

      - name: Reconstruct the verified handoff from the immutable release
        id: reconstruct
        if: ${{ needs.prepare-recovery.outputs.release_mode == 'resume' }}
        timeout-minutes: 10
        shell: bash
        env:
          EXPECTED_HISTORY_HASH: ${{ needs.prepare-recovery.outputs.history_snapshot_hash }}
          FAILED_RUN_PROOF_HASH: ${{ needs.prepare-recovery.outputs.failed_run_proof_hash }}
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_BODY_HASH: ${{ needs.prepare-recovery.outputs.release_body_hash }}
          RELEASE_ID: ${{ needs.prepare-recovery.outputs.release_id }}
          RELEASE_SHA: ${{ needs.prepare-recovery.outputs.release_sha }}
          REPOSITORY_ID: ${{ needs.prepare-recovery.outputs.repository_id }}
          TAG_OBJECT_SHA: ${{ needs.prepare-recovery.outputs.tag_object_sha }}
        run: |
          set -euo pipefail

          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander \
            > "$RUNNER_TEMP/repository-resume.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/git/ref/heads/main \
            > "$RUNNER_TEMP/main-ref-resume.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/git/ref/tags/v0.30.1 \
            > "$RUNNER_TEMP/tag-ref-resume.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/git/tags/$TAG_OBJECT_SHA" \
            > "$RUNNER_TEMP/tag-object-resume.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/contents/.github/workflows/release.yml?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/main-workflow-blob-resume.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/contents/CHANGELOG.md?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/main-changelog-blob-resume.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/mblua/AgentsCommander/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/immutable-release-resume-by-id.json"
          gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/mblua/AgentsCommander/releases/tags/v0.30.1 \
            > "$RUNNER_TEMP/immutable-release-resume-by-tag.json"

          ASSET_RECORDS="$RUNNER_TEMP/release-asset-records-resume.json" \
          BY_ID="$RUNNER_TEMP/immutable-release-resume-by-id.json" \
          BY_TAG="$RUNNER_TEMP/immutable-release-resume-by-tag.json" \
          node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + '/' + name, 'utf8'),
          );
          const repository = read('repository-resume.json');
          const main = read('main-ref-resume.json');
          const tagRef = read('tag-ref-resume.json');
          const tagObject = read('tag-object-resume.json');
          const workflowBlob = read('main-workflow-blob-resume.json');
          const changelogBlob = read('main-changelog-blob-resume.json');
          if (
            repository.full_name !== 'mblua/AgentsCommander'
            || repository.default_branch !== 'main'
            || Number(repository.id) !== Number(process.env.REPOSITORY_ID)
            || main.ref !== 'refs/heads/main'
            || main.object?.type !== 'commit'
            || main.object?.sha !== process.env.GITHUB_SHA
            || tagRef.ref !== 'refs/tags/v0.30.1'
            || tagRef.object?.type !== 'tag'
            || tagRef.object?.sha !== process.env.TAG_OBJECT_SHA
            || tagObject.sha !== process.env.TAG_OBJECT_SHA
            || tagObject.tag !== 'v0.30.1'
            || tagObject.object?.type !== 'commit'
            || tagObject.object?.sha !== process.env.RELEASE_SHA
            || workflowBlob.sha !== 'a5e437996ea3a91e0688842f80e6c466f35cff19'
            || changelogBlob.sha !== 'b0095eac4158e3fa575de36b1f4be9ada94b542e'
          ) {
            throw new Error('resume repository, main, tag, or blob identity changed');
          }

          const expectedNames = [
            'Agents.Commander-0.30.1-1.x86_64.rpm',
            'Agents.Commander_0.30.1_aarch64.dmg',
            'Agents.Commander_0.30.1_amd64.AppImage',
            'Agents.Commander_0.30.1_amd64.deb',
            'Agents.Commander_0.30.1_x64-setup.exe',
            'Agents.Commander_0.30.1_x64.dmg',
            'Agents.Commander_aarch64.app.tar.gz',
            'Agents.Commander_x64.app.tar.gz',
            'agentscommander-linux-x86_64',
            'agentscommander-mac-aarch64',
            'agentscommander-mac-aarch64.app.tar.gz',
            'agentscommander-mac-x86_64',
            'agentscommander-mac-x86_64.app.tar.gz',
            'agentscommander-testeable-windows-x86_64.exe',
            'agentscommander-windows-x86_64.exe',
            'SHASUMS256.txt',
          ];
          const expectedBody = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
          const releases = [
            JSON.parse(fs.readFileSync(process.env.BY_ID, 'utf8')),
            JSON.parse(fs.readFileSync(process.env.BY_TAG, 'utf8')),
          ];
          let records;
          for (const release of releases) {
            if (
              Number(release.id) !== Number(process.env.RELEASE_ID)
              || release.url
                !== 'https://api.github.com/repos/mblua/AgentsCommander/releases/' + release.id
              || release.html_url
                !== 'https://github.com/mblua/AgentsCommander/releases/tag/v0.30.1'
              || release.tag_name !== 'v0.30.1'
              || release.target_commitish !== process.env.RELEASE_SHA
              || release.name !== 'Agents Commander v0.30.1'
              || release.body !== expectedBody
              || release.draft !== false
              || release.prerelease !== false
              || release.immutable !== true
              || typeof release.published_at !== 'string'
              || release.published_at.length === 0
              || !Array.isArray(release.assets)
              || release.assets.length !== expectedNames.length
            ) {
              throw new Error('resume Release identity or immutable state is not exact');
            }
            const byName = new Map();
            const ids = new Set();
            for (const asset of release.assets) {
              if (
                !expectedNames.includes(asset.name)
                || byName.has(asset.name)
                || !Number.isInteger(asset.id)
                || asset.id <= 0
                || ids.has(asset.id)
                || !Number.isInteger(asset.size)
                || asset.size <= 0
                || asset.state !== 'uploaded'
                || !/^sha256:[0-9a-f]{64}$/.test(asset.digest)
                || asset.url
                  !== 'https://api.github.com/repos/mblua/AgentsCommander/releases/assets/' + asset.id
                || asset.browser_download_url
                  !== 'https://github.com/mblua/AgentsCommander/releases/download/v0.30.1/' + asset.name
              ) {
                throw new Error('resume Release asset is invalid: ' + asset.name);
              }
              byName.set(asset.name, asset);
              ids.add(asset.id);
            }
            if (expectedNames.some((name) => !byName.has(name))) {
              throw new Error('resume Release asset inventory is not exact');
            }
            const candidate = expectedNames.map((name) => {
              const asset = byName.get(name);
              return {
                browserUrl: asset.browser_download_url,
                digest: asset.digest,
                id: asset.id,
                name: asset.name,
                size: asset.size,
                state: asset.state,
                url: asset.url,
              };
            });
            if (records && JSON.stringify(records) !== JSON.stringify(candidate)) {
              throw new Error('resume Release asset IDs are not stable');
            }
            records = candidate;
          }
          fs.writeFileSync(
            process.env.ASSET_RECORDS,
            JSON.stringify(records, null, 2) + '\n',
            { flag: 'wx' },
          );
          NODE

          handoff="$RUNNER_TEMP/release-handoff"
          mkdir "$handoff"
          records="$RUNNER_TEMP/release-asset-records-resume.json"
          [[ "$(jq 'length' "$records")" -eq 16 ]]
          for index in $(seq 0 15); do
            name="$(jq -r ".[$index].name" "$records")"
            asset_id="$(jq -r ".[$index].id" "$records")"
            expected_size="$(jq -r ".[$index].size" "$records")"
            expected_digest="$(jq -r ".[$index].digest" "$records")"
            [[ "$name" != *"/"* && "$name" != *"\\"* ]]
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]

            headers="$RUNNER_TEMP/resume-release-asset-$index.headers"
            response="$RUNNER_TEMP/resume-release-asset-$index.body"
            status="$(
              printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" \
                | curl \
                    --disable \
                    --silent \
                    --show-error \
                    --max-redirs 0 \
                    --config - \
                    --header "Accept: application/octet-stream" \
                    --header "X-GitHub-Api-Version: 2026-03-10" \
                    --dump-header "$headers" \
                    --output "$response" \
                    --write-out '%{http_code}' \
                    "https://api.github.com/repos/mblua/AgentsCommander/releases/assets/$asset_id"
            )"

            destination="$handoff/$name"
            if [[ "$status" == "200" ]]; then
              mv "$response" "$destination"
            elif [[ "$status" == "302" ]]; then
              mapfile -t locations < <(
                awk '
                  BEGIN { IGNORECASE=1 }
                  /^Location:/ {
                    sub(/^Location:[[:space:]]+/, "")
                    sub(/\r$/, "")
                    print
                  }
                ' "$headers"
              )
              [[ "${#locations[@]}" -eq 1 ]]
              location="$(
                LOCATION="${locations[0]}" node <<'NODE'
          const parsed = new URL(process.env.LOCATION);
          const allowedHosts = new Set([
            'objects.githubusercontent.com',
            'release-assets.githubusercontent.com',
          ]);
          if (
            parsed.protocol !== 'https:'
            || !allowedHosts.has(parsed.hostname)

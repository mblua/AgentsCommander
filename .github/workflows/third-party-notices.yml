name: Third-party notices

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/generate-third-party-notices*.mjs'
      - 'scripts/third-party-notices/**'
      - '.github/workflows/third-party-notices.yml'

permissions:
  contents: read

concurrency:
  group: third-party-notices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  third-party-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Pin npm version
        run: npm install -g --ignore-scripts npm@11.6.2
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: node --test scripts/generate-third-party-notices.test.mjs
      - run: node scripts/generate-third-party-notices.mjs --check

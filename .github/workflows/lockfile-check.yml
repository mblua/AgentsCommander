name: Lockfile drift check

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'dependabot/**'
      - 'revert/**'
      - 'gh-readonly-queue/**'
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-drift:
    name: lockfile-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect lockfile inputs
        id: changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD^1 HEAD -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Failed to detect npm manifest or lockfile changes (git diff exited $status)."
              exit "$status"
            fi
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        if: steps.changes.outputs.changed == 'true'
        run: npm install -g npm@11.6.2 --ignore-scripts

      - name: Regenerate lockfile in-place
        if: steps.changes.outputs.changed == 'true'
        run: npm install --package-lock-only --ignore-scripts

      - name: Fail if lockfile is out of sync
        if: steps.changes.outputs.changed == 'true'
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' locally and commit the result."
            exit 1
          fi

name: PR regression gates

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'dependabot/**'
      - 'revert/**'
      - 'gh-readonly-queue/**'

permissions:
  contents: read

concurrency:
  group: pr-regression-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-debt:
    name: test-debt
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Check ignored and placeholder test debt
        run: npm run test:debt
      - name: "Check #480 guard controls"
        run: |
          npm run test:classify:self
          npm run test:report:self

  rust-regression:
    name: rust-regression
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-debug'
          env-vars: 'ImageOS'
          save-if: 'false'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --bins --tests

  rust-regression-linux:
    name: rust-regression-linux
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: rust-regression-linux

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # IS #1577: the ONLY CI execution of the primary-case test. It copies a
      # binary into a mode-0555 directory and depends on that mode actually
      # being enforced, so it must run on a native Linux filesystem.
      # ubuntu-latest is ext4, which enforces.
      #
      # Do NOT move this to a Windows runner, a DrvFs path (/mnt/<drive>), or a
      # bind mount from a Windows host. There, chmod 0555 is silently ignored,
      # stat reports 777, the write succeeds, the fallback never fires, and the
      # test reports ok while proving nothing.
      #
      # Only this one test runs here, by name. The suite runs on the Windows
      # leg; enabling it wholesale on Linux would light up #[cfg(unix)] tests
      # that have compiled for months and never once executed.
      - name: cargo test (IS #1577 primary case)
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          TEST='tests::issue_1577_linux_unmarked_adjacent_unwritable_falls_back_to_home'

          cargo test --lib "$TEST" -- --exact --test-threads=1 --nocapture 2>&1 | tee test-1577.log

          # Three independent guards, and none is redundant:
          #
          #   1. The exit code (via `set -o pipefail`, which is LOAD-BEARING
          #      through the `tee`) catches a test that ran and FAILED.
          #   2. The identifier grep catches a test that never ran at all,
          #      because a filtered cargo test matching nothing exits 0 and
          #      prints "0 passed".
          #   3. The "1 passed" grep catches the filter matching nothing or
          #      matching something else instead.
          #
          # Do NOT drop `pipefail` and rely on the greps. The test re-executes
          # its own harness as a child with --nocapture, so the child's output
          # interleaves and BOTH the identifier and a "1 passed" line appear
          # TWICE. If the parent fails, the child's "ok" line is still in the
          # log and both greps would still succeed. Only the exit code
          # distinguishes those cases.
          #
          # Do NOT tighten these into count-based assertions (`grep -c ... 1`).
          # Two occurrences are expected and correct.
          grep -qF "$TEST" test-1577.log || {
            echo "::error::$TEST never ran. It was renamed, moved, or gated out, and this step was silently testing nothing."
            exit 1
          }
          grep -qE '^test result: ok\. 1 passed; 0 failed' test-1577.log || {
            echo "::error::expected exactly one passing test; the filter matched nothing or the count changed."
            exit 1
          }

  rust-regression-macos:
    name: rust-regression-macos
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: rust-regression-macos

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  rust-fmt:
    name: rust-fmt
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  terminal-snapshot-portable:
    name: terminal-snapshot-portable (${{ matrix.os }})
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Test locked terminal snapshot renderer
        run: cargo test --locked -p terminal-snapshot-renderer

      - name: Test locked terminal snapshot helper
        run: cargo test --locked -p session-bridge --bin agentscommander-api-helper terminal_snapshot

  windows-release-cli-smoke:
    name: windows-release-cli-smoke
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-release'
          env-vars: 'ImageOS'
          save-if: 'false'

      - name: Build Windows release binary
        run: npm run build:prod:no-bundle

      - name: Run Windows release CLI smoke
        run: npm run smoke:cli-release-windows

      - name: Upload CLI smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-cli-smoke-logs
          path: artifacts/cli-release-smoke
          if-no-files-found: ignore

  frontend-regression:
    name: frontend-regression
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: "npm test with #480 known-debt guard"
        run: |
          # The three classifier inputs are removed first and the removal is
          # checked. After this line each of them exists only if this run wrote it,
          # which is what makes the tolerate decision's inputs this run's (#1206).
          if ! rm -f npm-test-results.json npm-test.log npm-test.normalized.log; then
            echo "::error::#480 guard: a stale classifier input could not be removed, so this run's inputs cannot be established. Not classifying."
            exit 1
          fi

          # Nothing may be added to this region. It is the only place in the step
          # where a failure is not caught, and every command in it has its status
          # captured on the next line.
          set +e
          npm test -- --reporter=default --reporter=json --outputFile.json=npm-test-results.json 2>&1 | tee npm-test.log
          pipe_status=("${PIPESTATUS[@]}")
          set -e

          # The whole array is captured in one assignment because PIPESTATUS holds
          # only the most recent pipeline and the next command replaces it, a plain
          # assignment included. Reading PIPESTATUS[1] after `status=` would read
          # the assignment's own status and never fire.
          status=${pipe_status[0]}

          if [ "${#pipe_status[@]}" -ne 2 ]; then
            echo "::error::#480 guard: the test pipeline no longer has exactly two stages, so these are not the statuses this check was written against. Not classifying."
            exit 1
          fi

          if [ "${pipe_status[1]}" -ne 0 ]; then
            echo "::error::#480 guard: tee failed, so npm-test.log is not this run's output. Not classifying."
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          perl -pe 's/\x1b\[[0-9;?]*[ -\/]*[@-~]//g' npm-test.log > npm-test.normalized.log

          # Classification and reporting are two steps and the order is
          # load-bearing: classify first, annotate only a failure that was not
          # tolerated. A reporter cannot do this, because it emits during the run
          # and would annotate a run this guard later tolerates (#1206).
          #
          # The classifier is a whitelist: it tolerates only the one known-good
          # state and fails closed on everything else, including any error it
          # raises while deciding. It is an `if` condition, so `set -e` does not
          # abort the step when it says no.
          #
          # Temporary #480 guard: remove this block when the unhandled WebSocket rejection is fixed.
          if node scripts/classify-test-run.mjs npm-test-results.json npm-test.normalized.log; then
            echo "::warning::npm test is temporarily tolerated only for the known #480 unhandled WebSocket rejection signature. Remove this guard when #480 is fixed."
            exit 0
          fi

          # `|| true` is load-bearing: `set -e` is on again, and without it a throw
          # in the reporter would abort the step before `exit "$status"`, making the
          # reported cause the reporting defect instead of the failing test.
          node scripts/report-failed-tests.mjs npm-test-results.json || true

          # Deliberately does not promise annotations: an unusable report
          # legitimately produces none, and this line must be true in every branch.
          echo "::error::npm test failed and was not tolerated by the #480 guard. See any annotations above and the uploaded npm-test.log."
          exit "$status"

      - name: "Upload npm test diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-test-diagnostics
          path: |
            npm-test.log
            npm-test-results.json
          if-no-files-found: ignore

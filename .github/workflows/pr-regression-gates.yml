name: PR regression gates

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'dependabot/**'
      - 'revert/**'
      - 'gh-readonly-queue/**'

permissions:
  contents: read

concurrency:
  group: pr-regression-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-debt:
    name: test-debt
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Check ignored and placeholder test debt
        run: npm run test:debt
      - name: "Check #480 guard controls"
        run: |
          npm run test:classify:self
          npm run test:report:self

  rust-regression:
    name: rust-regression
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-debug'
          env-vars: 'ImageOS'
          save-if: 'false'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --bins --tests

      # IS #1850: ordinary Windows runs prove the copy-and-run mechanism and
      # refusal safety only. Refusal safety and the mechanism control moved off
      # the lib target (whose `ISSUE1850_REFUSAL_ONLY` printer this round
      # deletes) onto the integration target that actually runs here.
      - name: "cargo test (IS #1850 default-route acceptance, integration)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --test issue_1850_default_root -- --test-threads=1 --nocapture 2>&1 | tee test-1850-refusal.log
          for name in issue_1850_admission_gate_table issue_1850_default_root_acceptance; do
            grep -qF "test ${name} ..." test-1850-refusal.log || { echo "::error::${name} never ran in the ordinary Windows run"; exit 1; }
          done
          grep -qE '^ISSUE1850_MECHANISM_OK' test-1850-refusal.log || { echo "::error::the copied-binary mechanism control did not report success in the ordinary Windows run"; exit 1; }
          grep -qE '^ISSUE1850_REFUSAL_ONLY' test-1850-refusal.log || { echo "::error::the ordinary Windows run did not take the refusal-only route"; exit 1; }
          if grep -qF 'ISSUE1850_WINDOWS_PROFILE_PROOF_OK' test-1850-refusal.log; then
            echo "::error::the ordinary Windows run must not claim the real-profile proof"
            exit 1
          fi
          if grep -qF 'ISSUE1850_CASE_OK' test-1850-refusal.log; then
            echo "::error::the ordinary Windows run must not execute real-profile cases"
            exit 1
          fi
          grep -qE '^test result: ok\. 2 passed; 0 failed' test-1850-refusal.log || { echo "::error::expected exactly two passing tests"; exit 1; }

      # IS #1850: focused debug execution of every issue_1850 test. Guards
      # mirror the #1577 step: pipefail catches a failing test, the identifier
      # greps catch a filter that selected nothing or something else, and the
      # anchored result line requires a positive passing count with no failure.
      - name: "cargo test (IS #1850 focused, debug)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --lib issue_1850 -- --test-threads=1 --nocapture 2>&1 | tee test-1850-debug.log

          for name in \
            'config::profile::tests::issue_1850_config_dir_name_table_is_profile_independent' \
            'config::tests::issue_1850_unsuffixed_executables_select_canonical_home_for_every_probe_outcome' \
            'config::tests::issue_1850_overrides_keep_precedence_and_identity_over_canonical_home' \
            'config::tests::issue_1850_lazy_helper_never_probes_unsuffixed_or_overridden_routes' \
            'config::tests::issue_1850_lazy_helper_probes_suffixed_routes_marker_first_then_write_once'; do
            grep -qF "test ${name} ..." test-1850-debug.log || {
              echo "::error::${name} never ran in the focused #1850 debug run; it was renamed, moved, or gated out."
              exit 1
            }
          done
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' test-1850-debug.log || {
            echo "::error::the focused #1850 debug run did not report a positive passing count with zero failures."
            exit 1
          }
          if grep -qF 'ISSUE1850_WINDOWS_PROFILE_PROOF_OK' test-1850-debug.log; then
            echo "::error::the ordinary Windows run must not claim the real-profile proof."
            exit 1
          fi

      # IS #1850: focused release execution of every issue_1850 test. Guards
      # mirror the #1577 step: pipefail catches a failing test, the identifier
      # greps catch a filter that selected nothing or something else, and the
      # anchored result line requires a positive passing count with no failure.
      - name: "cargo test (IS #1850 focused, release)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --release --lib issue_1850 -- --test-threads=1 --nocapture 2>&1 | tee test-1850-release.log

          for name in \
            'config::profile::tests::issue_1850_config_dir_name_table_is_profile_independent' \
            'config::tests::issue_1850_unsuffixed_executables_select_canonical_home_for_every_probe_outcome' \
            'config::tests::issue_1850_overrides_keep_precedence_and_identity_over_canonical_home' \
            'config::tests::issue_1850_lazy_helper_never_probes_unsuffixed_or_overridden_routes' \
            'config::tests::issue_1850_lazy_helper_probes_suffixed_routes_marker_first_then_write_once'; do
            grep -qF "test ${name} ..." test-1850-release.log || {
              echo "::error::${name} never ran in the focused #1850 release run; it was renamed, moved, or gated out."
              exit 1
            }
          done
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' test-1850-release.log || {
            echo "::error::the focused #1850 release run did not report a positive passing count with zero failures."
            exit 1
          }
          if grep -qF 'ISSUE1850_WINDOWS_PROFILE_PROOF_OK' test-1850-release.log; then
            echo "::error::the ordinary Windows run must not claim the real-profile proof."
            exit 1
          fi

  rust-regression-linux:
    name: rust-regression-linux
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # The four original packages are Tauri's own. The rest are the #1842
          # xcap native chain: bindgen needs libclang; system-deps needs the
          # pkg-config metadata for libpipewire-0.3 AND libspa-0.2 (E1 proved
          # libspa-0.2-dev is a SEPARATE package that only arrives
          # transitively, so listing it is what stops a future dependency
          # change breaking the build silently); libwayshot-xcap needs
          # gbm/drm/EGL; xcb needs libxcb + randr.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libdbus-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: rust-regression-linux

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # IS #1577: the ONLY CI execution of the primary-case test. It copies a
      # binary into a mode-0555 directory and depends on that mode actually
      # being enforced, so it must run on a native Linux filesystem.
      # ubuntu-latest is ext4, which enforces.
      #
      # Do NOT move this to a Windows runner, a DrvFs path (/mnt/<drive>), or a
      # bind mount from a Windows host. There, chmod 0555 is silently ignored,
      # stat reports 777, the write succeeds, the fallback never fires, and the
      # test reports ok while proving nothing.
      #
      # Only this one test runs here, by name. The suite runs on the Windows
      # leg; enabling it wholesale on Linux would light up #[cfg(unix)] tests
      # that have compiled for months and never once executed.
      - name: cargo test (IS #1577 primary case)
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          TEST='tests::issue_1577_linux_unmarked_adjacent_unwritable_falls_back_to_home'

          cargo test --lib "$TEST" -- --exact --test-threads=1 --nocapture 2>&1 | tee test-1577.log

          # Three independent guards, and none is redundant:
          #
          #   1. The exit code (via `set -o pipefail`, which is LOAD-BEARING
          #      through the `tee`) catches a test that ran and FAILED.
          #   2. The identifier grep catches a test that never ran at all,
          #      because a filtered cargo test matching nothing exits 0 and
          #      prints "0 passed".
          #   3. The "1 passed" grep catches the filter matching nothing or
          #      matching something else instead.
          #
          # The test re-executes itself as a child process, but the child's
          # stdout and stderr are Stdio::piped() and collected into a String.
          # On the success path that output is NEVER printed, so the identifier
          # and the result line each appear EXACTLY ONCE in this log.
          #
          # On a FAILURE path the parent embeds the child's captured stdout
          # into its panic message via {:?}, which debug-escapes the newlines
          # onto a single line. That embedded text contains a literal
          # "test result: ok. 1 passed" from a child that succeeded before the
          # parent's own assertions failed. Two consequences:
          #
          #   - Guard 3 is anchored with `^` for exactly this reason. Embedded
          #     mid-line, the child's "ok" cannot satisfy an anchored match.
          #     Do NOT remove the `^`.
          #   - Guard 2 is unanchored and CAN be satisfied by that embedded
          #     text, so guard 2 alone cannot tell a real pass from a parent
          #     failure that dumped a successful child's output.
          #
          # Keep `pipefail`. It is the only guard that does not depend on
          # parsing text at all, so it is the only one no output shape can
          # fool.
          #
          # Do NOT tighten these into count-based assertions (`grep -c ... 1`).
          # The success path yields one occurrence and the failure paths yield
          # a different number depending on which assertion failed, so a fixed
          # count would be wrong for some real failure it is meant to catch.
          grep -qF "$TEST" test-1577.log || {
            echo "::error::$TEST never ran. It was renamed, moved, or gated out, and this step was silently testing nothing."
            exit 1
          }
          grep -qE '^test result: ok\. 1 passed; 0 failed' test-1577.log || {
            echo "::error::expected exactly one passing test; the filter matched nothing or the count changed."
            exit 1
          }

      # IS #1842: the full suite runs only on the Windows leg, so without this
      # the screenshot tests would compile on Linux and never execute. The
      # filter is a MODULE PATH, not the bare word `screenshot`, which would
      # also match api/mod.rs's window-screenshot limiter tests — gated
      # `any(target_os = "windows", test)`, compiled for months, never run on
      # Linux, and lighting those up is what the comment above forbids.
      - name: cargo test (IS #1842 screenshot module on Linux)
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          FILTER='screenshot::native::tests::'
          # 19 pre-existing + overlay_window_traits_match_target + the two
          # Linux-gated tests. LINUX count (Windows runs 20); update it in the
          # same commit that adds or removes a test in that module.
          EXPECTED=22
          cargo test --lib "$FILTER" -- --test-threads=1 --nocapture 2>&1 | tee test-1842.log

          # Three guards, matching the #1577 step, none redundant:
          #   1. The exit code, via `set -o pipefail` (LOAD-BEARING through the
          #      `tee`), catches a test that ran and FAILED.
          #   2. The sentinel grep is the POSITIVE CONTROL: a filter matching
          #      nothing exits 0 and prints "0 passed", so green alone proves
          #      nothing. linux_display_server_classification is Linux-gated and
          #      cannot exist unless mod.rs really compiled `native` on Linux.
          #      Not redundant with 3: a sentinel renamed, or moved out of the
          #      filter, with the count left at 22 keeps guards 1 and 3 green
          #      and only this grep red -- that is probe P1, measured. The
          #      other way mod.rs can lose `native` on Linux, narrowing its
          #      cfg, never reaches this line: the crate stops compiling, cargo
          #      exits 101, and guard 1 takes it. The match is a PREFIX (-F on
          #      the module path), so a rename that only appends a suffix stays
          #      green -- correctly: a Linux-gated test with that prefix still
          #      ran, which is all this control asserts.
          #   3. The anchored count is the MUTATION PROBE: gating a test out
          #      moves the number.
          grep -qF 'screenshot::native::tests::linux_display_server_classification' test-1842.log || {
            echo "::error::the Linux-only sentinel test never ran. screenshot::native is not compiling on Linux, or the test was renamed, and this step was testing nothing."
            exit 1
          }
          grep -qE "^test result: ok\. ${EXPECTED} passed; 0 failed" test-1842.log || {
            echo "::error::expected exactly ${EXPECTED} passing tests in ${FILTER}; the count changed or the filter matched something else."
            exit 1
          }

      # IS #1850: focused debug execution of every issue_1850 test. Guards
      # mirror the #1577 step: pipefail catches a failing test, the identifier
      # greps catch a filter that selected nothing or something else, and the
      # anchored result line requires a positive passing count with no failure.
      - name: "cargo test (IS #1850 focused, debug)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --lib issue_1850 -- --test-threads=1 --nocapture 2>&1 | tee test-1850-debug.log

          for name in \
            'config::profile::tests::issue_1850_config_dir_name_table_is_profile_independent' \
            'config::tests::issue_1850_unsuffixed_executables_select_canonical_home_for_every_probe_outcome' \
            'config::tests::issue_1850_overrides_keep_precedence_and_identity_over_canonical_home' \
            'config::tests::issue_1850_lazy_helper_never_probes_unsuffixed_or_overridden_routes' \
            'config::tests::issue_1850_lazy_helper_probes_suffixed_routes_marker_first_then_write_once'; do
            grep -qF "test ${name} ..." test-1850-debug.log || {
              echo "::error::${name} never ran in the focused #1850 debug run; it was renamed, moved, or gated out."
              exit 1
            }
          done
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' test-1850-debug.log || {
            echo "::error::the focused #1850 debug run did not report a positive passing count with zero failures."
            exit 1
          }

      # IS #1850: focused release execution of every issue_1850 test. Guards
      # mirror the #1577 step: pipefail catches a failing test, the identifier
      # greps catch a filter that selected nothing or something else, and the
      # anchored result line requires a positive passing count with no failure.
      - name: "cargo test (IS #1850 focused, release)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --release --lib issue_1850 -- --test-threads=1 --nocapture 2>&1 | tee test-1850-release.log

          for name in \
            'config::profile::tests::issue_1850_config_dir_name_table_is_profile_independent' \
            'config::tests::issue_1850_unsuffixed_executables_select_canonical_home_for_every_probe_outcome' \
            'config::tests::issue_1850_overrides_keep_precedence_and_identity_over_canonical_home' \
            'config::tests::issue_1850_lazy_helper_never_probes_unsuffixed_or_overridden_routes' \
            'config::tests::issue_1850_lazy_helper_probes_suffixed_routes_marker_first_then_write_once'; do
            grep -qF "test ${name} ..." test-1850-release.log || {
              echo "::error::${name} never ran in the focused #1850 release run; it was renamed, moved, or gated out."
              exit 1
            }
          done
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' test-1850-release.log || {
            echo "::error::the focused #1850 release run did not report a positive passing count with zero failures."
            exit 1
          }

      # IS #1850: the debug acceptance target on a native Linux filesystem. The
      # copied product binary must select the injected HOME, run all eight
      # cases, and materialise app.log/.gitignore only under
      # <home>/.agentscommander. Release behaviour of this route differs only
      # by the debug-only override being compiled out, which the Windows
      # real-profile release leg and the release focused lib tests cover.
      - name: "cargo test (IS #1850 default-root acceptance, debug)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo test --locked --test issue_1850_default_root -- --test-threads=1 --nocapture 2>&1 | tee test-1850-default-root.log
          for name in issue_1850_admission_gate_table issue_1850_default_root_acceptance; do
            grep -qF "test ${name} ..." test-1850-default-root.log || { echo "::error::${name} never ran"; exit 1; }
          done
          grep -qE '^ISSUE1850_MECHANISM_OK' test-1850-default-root.log || { echo "::error::copied-binary mechanism control did not report success"; exit 1; }
          for case in adjacent-legacy-alone home-new-alone home-new-dev-alone all-legacy-conflicting \
                      canonical-valid-settings canonical-invalid-settings canonical-absent-with-marker canonical-absent-without-marker; do
            grep -qE "^ISSUE1850_CASE_OK case=${case}$" test-1850-default-root.log || { echo "::error::missing case record ${case}"; exit 1; }
          done
          test "$(grep -oE '^ISSUE1850_CASE_OK case=[^ ]+$' test-1850-default-root.log | sort -u | wc -l)" -eq 8 || { echo "::error::expected 8 unique case records"; exit 1; }
          grep -qE '^ISSUE1850_DEFAULT_ROOT_PROOF_OK cases=8$' test-1850-default-root.log || { echo "::error::final proof record missing"; exit 1; }
          grep -qE '^test result: ok\. 2 passed; 0 failed' test-1850-default-root.log || { echo "::error::expected exactly two passing tests"; exit 1; }
          grep -qE '^ISSUE1850_REFUSAL_ONLY' test-1850-default-root.log && { echo "::error::refusal-only route taken on a non-Windows leg"; exit 1; } || true

  rust-linux-release-parity:
    name: rust-linux-release-parity
    # #1842: the Linux PR gate runs ubuntu-latest (24.04) while the Linux
    # RELEASE build runs ubuntu-22.04 (release.yml). A green PR gate therefore
    # did not prove the release build. This job compiles AND LINKS src-tauri on
    # the exact release runner so a chain that will not build there fails a PR
    # instead of a release.
    #
    # `cargo build`, NOT `cargo check`: check stops at metadata and never
    # invokes the final linker
    # (https://doc.rust-lang.org/cargo/commands/cargo-check.html). It would
    # prove apt resolution and build-script/pkg-config discovery and nothing
    # about the link. The xcap chain is FFI; a missing -l flag or an unresolved
    # symbol on 22.04 appears only at link time, which is the exact failure
    # this job exists to catch before release.yml does.
    #
    # `--release`, NOT debug. "release is only optimisation" is FALSE in this
    # repo and the difference is not cosmetic:
    #   * build.rs:8-19 turns PROFILE=release into BUILD_PROFILE=prod, emits it
    #     as cargo:rustc-env, and feeds it to configure_embedded_dist, so the
    #     BUILD SCRIPT takes a different path.
    #   * config/mod.rs:850-853 has a real cfg(debug_assertions) /
    #     cfg(not(debug_assertions)) split in instance_location.
    # Cargo flips debug_assertions with the profile, so a debug build exercises
    # neither branch the release runner will take. Since this job's whole
    # purpose is parity with release.yml's Linux producer — which builds
    # release — it must build release too. This removes the entire release-only
    # residual class (compile, build script AND link), not just the link.
    #
    # `--bins` and NOT `--all-targets`: the bin is the artifact release.yml
    # ships, and linking it costs one link instead of 27 (1 bin + 25 integration
    # tests in src-tauri/tests + the lib). Nothing is lost: rust-regression-linux
    # on 24.04 already runs `cargo check --all-targets` AND
    # `cargo clippy --all-targets -- -D warnings`, so test-target type checking
    # keeps its owner, and no clippy or #1577 test runs here either. This job
    # exists solely to prove the runner. `--bins` also skips the cdylib and
    # staticlib crate-types (Cargo.toml:82-84); a missing -l breaks all three
    # links identically, so that adds no risk.
    #
    # If release.yml's Linux runner ever moves, move this job's runs-on with it
    # or delete this job; a parity job pinned to a runner nobody ships from
    # proves nothing.
    #
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libdbus-1-dev

      # The four frontend steps below are copied verbatim from
      # rust-regression-linux. They are MANDATORY here, and for a stronger
      # reason than in the job they were copied from: there they exist because
      # tauri-build validates tauri.conf.json's frontendDist; in THIS job the
      # profile is release, and build.rs:44-49 panics outright when
      # ../dist/index.html is missing for any profile other than dev -- in
      # debug it only emits a cargo:warning. So without `npm run build` this
      # job does not warn, it dies. They look redundant with
      # rust-regression-linux and someone will eventually try to delete them;
      # do not.
      # IS #1915: ubuntu-22.04's libspa-0.2-dev (0.3.48) has no `flags` field in
      # spa/param/video/raw.h and an int64_t `modifier`; libspa 0.9.2 --
      # reached through xcap 0.9.6 -> pipewire 0.9.2 -> libspa-sys 0.9.2's
      # build-time bindgen -- writes both and fails to compile with 5 errors
      # before the linker. 24.04's headers match, which is why every other leg
      # is green.
      #
      # libspa-0.2-dev ships NO library: `pkg-config --libs libspa-0.2` is
      # empty and the .deb contains zero .so files. This therefore changes the
      # COMPILE only -- never the link, never a DT_NEEDED, never the shipped
      # binary's minimum glibc. Do not "simplify" this into moving the runner
      # or into bumping libpipewire-0.3-dev: the first raises the shipped
      # minimum glibc, which is the user's decision, and the second is
      # unnecessary (measured) and would put 1.0.5 headers in front of a
      # 0.3.48 .so at link time.
      - name: Use noble libspa-0.2 headers on ubuntu-22.04 (IS #1915)
        shell: bash
        env:
          SPA_DEB: libspa-0.2-dev_1.0.5-1ubuntu3.3_amd64.deb
          SPA_SHA256: 93a60e7656fb35c97a78159fd0556842c62c2d8b9aff096009f9a20c64c1f272
          SPA_SNAPSHOT: https://snapshot.ubuntu.com/ubuntu/20260901T000000Z/pool/main/p/pipewire
          SPA_FALLBACK: https://security.ubuntu.com/ubuntu/pool/main/p/pipewire
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/spa-noble"
          deb="$RUNNER_TEMP/$SPA_DEB"
          mkdir -p "$prefix"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$deb" "$SPA_SNAPSHOT/$SPA_DEB" \
            || curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$deb" "$SPA_FALLBACK/$SPA_DEB"
          # The digest is the trust boundary, not the hostname. Both sources are
          # HTTPS-enforced (--proto/--proto-redir), so a redirect can never
          # downgrade the transfer and the SonarCloud clear-text/redirect checks
          # stay green without weakening the pinned-digest gate.
          echo "$SPA_SHA256  $deb" | sha256sum -c -
          dpkg-deb -x "$deb" "$prefix"
          pc="$prefix/usr/lib/x86_64-linux-gnu/pkgconfig/libspa-0.2.pc"
          sed -i "s|^prefix=/usr$|prefix=$prefix/usr|" "$pc"
          pcdir="$prefix/usr/lib/x86_64-linux-gnu/pkgconfig"
          echo "PKG_CONFIG_PATH=$pcdir:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

          # Two postconditions, and neither is decoration. PKG_CONFIG_PATH
          # entries are searched BEFORE pkg-config's built-in path, so the
          # apt-installed jammy libspa-0.2.pc is shadowed rather than removed
          # -- and a shadow that silently fails to take reads exactly like a
          # pass. Guard 1 proves the shadow took; guard 2 proves the shadowing
          # headers are the ones this fix was measured against, so a future
          # digest bump to a header set WITHOUT `flags` cannot land green.
          resolved="$(PKG_CONFIG_PATH="$pcdir" pkg-config --cflags-only-I libspa-0.2)"
          echo "resolved libspa-0.2 include flags: $resolved"
          case "$resolved" in
            *"$prefix"*) ;;
            *) echo "::error::PKG_CONFIG_PATH did not take; libspa-0.2 still resolves to the runner's 0.3.48 headers and the build will fail in libspa."; exit 1 ;;
          esac
          grep -q 'uint32_t flags;' "$prefix/usr/include/spa-0.2/spa/param/video/raw.h" || {
            echo "::error::the unpacked spa header has no uint32_t flags field; the pinned .deb is not the header set this fix was measured against."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # `. -> target`, NOT `src-tauri -> target`. The repo root Cargo.toml is a
      # WORKSPACE with src-tauri as a member, and src-tauri/Cargo.toml has no
      # [workspace] key of its own, so cargo writes to <repo>/target. There is
      # no src-tauri/target and no src-tauri/Cargo.lock, so `src-tauri -> target`
      # caches the registry and nothing else — survivable for a debug `check`,
      # ruinous for a RELEASE build of ~790 packages, which would then recompile
      # in full on every run. `bundle-validation.yml:52` and
      # `cache-warm.yml:53,102` already use the correct form; copy those.
      #
      # `pr-regression-gates.yml:130` and `:239` still carry the wrong form.
      # That is a pre-existing defect, it is NOT part of #1842, and this phase
      # must not touch those two lines — just do not propagate the mistake here.
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          key: rust-linux-release-parity

      - name: cargo build --release (links the binary release.yml ships)
        working-directory: src-tauri
        run: cargo build --release --bins

      # The linker proved the -l flags resolve at BUILD time. This proves the
      # same libraries resolve at LOAD time on this runner, which is what
      # release.yml's bundlers need when they walk the binary's DT_NEEDED
      # entries. `-r` also resolves data and function symbols, not just the
      # sonames. Free, offline, deterministic. It does NOT run any bundler --
      # see §6, "What criteria 6 and 7 do and do not close".
      #
      # NO `working-directory: src-tauri` here, deliberately. The repo root
      # Cargo.toml is a WORKSPACE listing src-tauri as a member; src-tauri has
      # no [workspace] key; no workflow sets CARGO_TARGET_DIR and
      # .cargo/config.toml only sets `[build] jobs`. So cargo writes to
      # <repo>/target, and `src-tauri/target` NEVER EXISTS. A step that looked
      # there would fail its own `test -x` on every run, before ldd, with an
      # error blaming the binary name.
      #
      # THE `grep` IS THE ASSERTION, NOT THE EXIT CODE. `ldd -r` was measured
      # exiting 0 on a binary with both `=> not found` and `undefined symbol:`
      # present. Do NOT "simplify" this to a bare `ldd -r "$BIN"`: that turns
      # the whole step into decoration. `set -o pipefail` is what keeps a
      # failing ldd from being swallowed by the `tee`.
      - name: ldd the release binary (load-time resolution on the release runner)
        shell: bash
        run: |
          set -euo pipefail
          # src-tauri/Cargo.toml has NO [[bin]] section, so cargo names the
          # executable after the PACKAGE: agentscommander. That is also
          # tauri.conf.json's mainBinaryName, so release.yml's raw_source
          # target/release/agentscommander names the same file: `tauri build`
          # renames the binary onto its own name and a bare `cargo build`
          # renames nothing. If either fact changes, this step fails loud
          # instead of silently checking a stale file.
          BIN=target/release/agentscommander
          test -x "$BIN" || {
            echo "::error::expected $BIN. The workspace target dir or cargo's binary name changed; fix this step."
            ls -l target/release || true
            exit 1
          }
          ldd -r "$BIN" 2>&1 | tee ldd-1842.log
          if grep -E 'not found|undefined symbol' ldd-1842.log; then
            echo "::error::the release binary has unresolved libraries or symbols on ubuntu-22.04. release.yml's Linux producer will fail here."
            exit 1
          fi
      # IS #1915, criterion 4. `readelf -d` prints only the DIRECT DT_NEEDED
      # entries THIS link produced. `ldd` (the step above) prints the whole
      # transitive closure, where WebKit's dependencies drown the signal --
      # that is why both steps exist and neither replaces the other.
      #
      # libxcb.so.1 and libgbm.so.1 are the two entries only xcap can produce:
      # `cargo tree -i xcb` and `cargo tree -i gbm` each show exactly one path
      # to this crate (gbm via libwayshot-xcap 0.3.2), and no build script in
      # the workspace emits a rustc-link-lib naming either, so gtk/webkit/soup
      # pkg-config request neither. Both arrive via #[link(name = ...)] in the
      # xcb and gbm crates.
      #
      # Because the toolchain links --as-needed this is a LIVENESS check, not
      # just a link check: the entries survive only because native.rs calls
      # Monitor::all -> xcap::platform::impl_monitor::ImplMonitor::all, which
      # references 8 core xcb_* symbols, and libwayshot references 7 gbm_*
      # symbols. cfg the Linux xcap block out, or stop calling it, and both
      # entries disappear.
      #
      # Do NOT add libpipewire-0.3.so.0 here. -lpipewire-0.3 does reach the
      # link, but every pw_* reference in xcap sits in its Wayland VIDEO
      # RECORDER, which src-tauri never calls, so --as-needed drops it; the
      # artifact has zero undefined pw_/spa_ symbols. Do NOT add
      # libxcb-randr.so.0 either: xcb 1.7.0 builds randr requests over the core
      # connection and emits no -lxcb-randr. Round 13 asserted both and both
      # are measurably absent.
      - name: Prove the xcap chain reached the release binary (IS #1915)
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/agentscommander-new
          test -x "$BIN" || {
            echo "::error::expected $BIN; the ldd step above should already have failed. Fix both steps together."
            exit 1
          }
          # Two statements, not one pipeline: under `set -o pipefail` a grep
          # that matched nothing would kill the step here, before the loop
          # below could say WHICH library is missing.
          readelf -d "$BIN" > dynamic-1842.log
          grep NEEDED dynamic-1842.log | sort > needed-1842.log || true
          cat needed-1842.log
          # Informational, deliberately NOT an assertion: symbol-table survival
          # depends on the binary not being stripped, and a future
          # [profile.release] strip key would fail it for a reason that has
          # nothing to do with xcap. There is no such key today.
          echo "xcap symbols present: $(nm -C "$BIN" | grep -c 'xcap::' || true)"
          for lib in libxcb.so.1 libgbm.so.1; do
            grep -q "\[$lib\]" needed-1842.log || {
              echo "::error::$BIN has no direct DT_NEEDED entry for $lib. Either the Linux xcap chain did not reach the binary, or nothing calls it and --as-needed dropped it. The full list is above; report it, do not weaken this assertion."
              exit 1
            }
          done

  rust-regression-macos:
    name: rust-regression-macos
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: rust-regression-macos

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # IS #1850: focused debug execution of every issue_1850 test. Guards
      # mirror the #1577 step: pipefail catches a failing test, the identifier
      # greps catch a filter that selected nothing or something else, and the
      # anchored result line requires a positive passing count with no failure.
      - name: "cargo test (IS #1850 focused, debug)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --lib issue_1850 -- --test-threads=1 --nocapture 2>&1 | tee test-1850-debug.log

          for name in \
            'config::profile::tests::issue_1850_config_dir_name_table_is_profile_independent' \
            'config::tests::issue_1850_unsuffixed_executables_select_canonical_home_for_every_probe_outcome' \
            'config::tests::issue_1850_overrides_keep_precedence_and_identity_over_canonical_home' \
            'config::tests::issue_1850_lazy_helper_never_probes_unsuffixed_or_overridden_routes' \
            'config::tests::issue_1850_lazy_helper_probes_suffixed_routes_marker_first_then_write_once'; do
            grep -qF "test ${name} ..." test-1850-debug.log || {
              echo "::error::${name} never ran in the focused #1850 debug run; it was renamed, moved, or gated out."
              exit 1
            }
          done
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' test-1850-debug.log || {
            echo "::error::the focused #1850 debug run did not report a positive passing count with zero failures."
            exit 1
          }

      # IS #1850: focused release execution of every issue_1850 test. Guards
      # mirror the #1577 step: pipefail catches a failing test, the identifier
      # greps catch a filter that selected nothing or something else, and the
      # anchored result line requires a positive passing count with no failure.
      - name: "cargo test (IS #1850 focused, release)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked --release --lib issue_1850 -- --test-threads=1 --nocapture 2>&1 | tee test-1850-release.log

          for name in \
            'config::profile::tests::issue_1850_config_dir_name_table_is_profile_independent' \
            'config::tests::issue_1850_unsuffixed_executables_select_canonical_home_for_every_probe_outcome' \
            'config::tests::issue_1850_overrides_keep_precedence_and_identity_over_canonical_home' \
            'config::tests::issue_1850_lazy_helper_never_probes_unsuffixed_or_overridden_routes' \
            'config::tests::issue_1850_lazy_helper_probes_suffixed_routes_marker_first_then_write_once'; do
            grep -qF "test ${name} ..." test-1850-release.log || {
              echo "::error::${name} never ran in the focused #1850 release run; it was renamed, moved, or gated out."
              exit 1
            }
          done
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed' test-1850-release.log || {
            echo "::error::the focused #1850 release run did not report a positive passing count with zero failures."
            exit 1
          }

      # IS #1850: the debug acceptance target on macOS. Same contract as the
      # Linux step; no real-profile case and no refusal-only route here.
      - name: "cargo test (IS #1850 default-root acceptance, debug)"
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo test --locked --test issue_1850_default_root -- --test-threads=1 --nocapture 2>&1 | tee test-1850-default-root.log
          for name in issue_1850_admission_gate_table issue_1850_default_root_acceptance; do
            grep -qF "test ${name} ..." test-1850-default-root.log || { echo "::error::${name} never ran"; exit 1; }
          done
          grep -qE '^ISSUE1850_MECHANISM_OK' test-1850-default-root.log || { echo "::error::copied-binary mechanism control did not report success"; exit 1; }
          for case in adjacent-legacy-alone home-new-alone home-new-dev-alone all-legacy-conflicting \
                      canonical-valid-settings canonical-invalid-settings canonical-absent-with-marker canonical-absent-without-marker; do
            grep -qE "^ISSUE1850_CASE_OK case=${case}$" test-1850-default-root.log || { echo "::error::missing case record ${case}"; exit 1; }
          done
          test "$(grep -oE '^ISSUE1850_CASE_OK case=[^ ]+$' test-1850-default-root.log | sort -u | wc -l)" -eq 8 || { echo "::error::expected 8 unique case records"; exit 1; }
          grep -qE '^ISSUE1850_DEFAULT_ROOT_PROOF_OK cases=8$' test-1850-default-root.log || { echo "::error::final proof record missing"; exit 1; }
          grep -qE '^test result: ok\. 2 passed; 0 failed' test-1850-default-root.log || { echo "::error::expected exactly two passing tests"; exit 1; }
          grep -qE '^ISSUE1850_REFUSAL_ONLY' test-1850-default-root.log && { echo "::error::refusal-only route taken on a non-Windows leg"; exit 1; } || true


  # IS #1850: Windows default-route acceptance on the ACTUAL account profile of
  # a disposable GitHub-hosted VM. `dirs::home_dir()` resolves through the
  # Windows known-folder API, not environment relocation, so a spoofed
  # HOME/USERPROFILE would prove nothing; a fresh hosted VM is the only honest
  # fixture. Each matrix leg is its own VM. The step below is the ONLY place
  # that sets the cfg(test)-only admission marker; the test additionally
  # requires GITHUB_ACTIONS=true, RUNNER_ENVIRONMENT=github-hosted and a
  # known-folder HOME equal to the inherited USERPROFILE, refuses if any
  # `.agentscommander*` profile entry pre-exists, and runs all eight cases
  # serially with per-case inventories and cleanup. Ordinary Windows runs
  # (rust-regression) take the refusal-only safety route instead.
  issue-1850-windows-profile:
    name: issue-1850-windows-profile (${{ matrix.mode }})
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode:
          - debug
          - release
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri config validation
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Restores only the Cargo registry and the workspace target; nothing is
      # ever restored into the account profile's `.agentscommander*` entries.
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          shared-key: 'gate-${{ matrix.mode }}'
          env-vars: 'ImageOS'
          save-if: 'false'

      - name: "IS #1850 real-profile build (${{ matrix.mode }})"
        shell: pwsh
        timeout-minutes: 40
        run: |
          $mode = '${{ matrix.mode }}'
          $cargoArgs = @('test', '--locked', '--manifest-path', 'src-tauri/Cargo.toml')
          if ($mode -eq 'release') { $cargoArgs += '--release' }
          $cargoArgs += @('--test', 'issue_1850_default_root', '--no-run')
          Write-Host "cargo $($cargoArgs -join ' ')"
          & cargo @cargoArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "IS #1850 real-profile eight-case proof (${{ matrix.mode }})"
        shell: pwsh
        timeout-minutes: 20
        env:
          AC_ISSUE1850_DISPOSABLE_PROFILE: '1'
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $mode = '${{ matrix.mode }}'
          $log = "issue-1850-windows-profile-$mode.log"
          Write-Host "job=$env:GITHUB_JOB head=$env:GITHUB_SHA profile=$env:USERPROFILE runner=$env:RUNNER_ENVIRONMENT marker=$env:AC_ISSUE1850_DISPOSABLE_PROFILE"

          $cargoArgs = @('test', '--locked', '--manifest-path', 'src-tauri/Cargo.toml')
          if ($mode -eq 'release') { $cargoArgs += '--release' }
          $cargoArgs += @('--test', 'issue_1850_default_root', '--', '--test-threads=1', '--nocapture')
          Write-Host "cargo $($cargoArgs -join ' ')"
          & cargo @cargoArgs 2>&1 | Tee-Object -FilePath $log
          $cargoExit = $LASTEXITCODE

          function Fail([string]$why) {
            Write-Host "::error::IS #1850 ($mode): $why"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $log)) { Fail 'the task log was not written' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($null -eq $text) { $text = '' }

          if ($cargoExit -ne 0) { Fail "cargo test exited $cargoExit" }
          foreach ($name in @('issue_1850_admission_gate_table', 'issue_1850_default_root_acceptance')) {
            if ($text -notmatch ('test ' + [regex]::Escape($name) + ' \.\.\. ')) { Fail "$name never ran" }
          }
          if ($text -notmatch '(?m)^ISSUE1850_MECHANISM_OK') { Fail 'the copied-binary mechanism control did not report success' }
          $cases = @(
            'adjacent-legacy-alone',
            'home-new-alone',
            'home-new-dev-alone',
            'all-legacy-conflicting',
            'canonical-valid-settings',
            'canonical-invalid-settings',
            'canonical-absent-with-marker',
            'canonical-absent-without-marker'
          )
          foreach ($case in $cases) {
            $pattern = '(?m)^ISSUE1850_CASE_OK case=' + [regex]::Escape($case) + '\s*$'
            if ($text -notmatch $pattern) { Fail "missing case-success record for $case" }
          }
          $unique = @([regex]::Matches($text, '(?m)^ISSUE1850_CASE_OK case=(\S+)\s*$') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          if ($unique.Count -ne 8) { Fail "expected 8 unique case-success records, found $($unique.Count)" }
          if ($text -notmatch '(?m)^ISSUE1850_WINDOWS_PROFILE_PROOF_OK cases=8\s*$') { Fail 'the final profile-proof record is missing' }
          if ($text -notmatch '(?m)^test result: ok\. 2 passed; 0 failed') { Fail 'expected exactly two passing tests' }
          if ($text -match 'ISSUE1850_REFUSAL_ONLY') { Fail 'a refusal-only record is present; the real-profile route was not taken' }
          Write-Host "IS #1850 ($mode): real-profile proof verified, 8 cases"

      - name: "Upload IS #1850 profile-proof logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1850-windows-profile-${{ matrix.mode }}-logs
          path: issue-1850-windows-profile-${{ matrix.mode }}.log
          if-no-files-found: ignore

  frontend-regression:
    name: frontend-regression
    # Skip branch-deletion push events while still requiring pull request validation.
    if: github.event_name != 'push' || (github.event.deleted != true && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: "npm test with #480 known-debt guard"
        run: |
          # The three classifier inputs are removed first and the removal is
          # checked. After this line each of them exists only if this run wrote it,
          # which is what makes the tolerate decision's inputs this run's (#1206).
          if ! rm -f npm-test-results.json npm-test.log npm-test.normalized.log; then
            echo "::error::#480 guard: a stale classifier input could not be removed, so this run's inputs cannot be established. Not classifying."
            exit 1
          fi

          # Nothing may be added to this region. It is the only place in the step
          # where a failure is not caught, and every command in it has its status
          # captured on the next line.
          set +e
          npm test -- --reporter=default --reporter=json --outputFile.json=npm-test-results.json 2>&1 | tee npm-test.log
          pipe_status=("${PIPESTATUS[@]}")
          set -e

          # The whole array is captured in one assignment because PIPESTATUS holds
          # only the most recent pipeline and the next command replaces it, a plain
          # assignment included. Reading PIPESTATUS[1] after `status=` would read
          # the assignment's own status and never fire.
          status=${pipe_status[0]}

          if [ "${#pipe_status[@]}" -ne 2 ]; then
            echo "::error::#480 guard: the test pipeline no longer has exactly two stages, so these are not the statuses this check was written against. Not classifying."
            exit 1
          fi

          if [ "${pipe_status[1]}" -ne 0 ]; then
            echo "::error::#480 guard: tee failed, so npm-test.log is not this run's output. Not classifying."
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          perl -pe 's/\x1b\[[0-9;?]*[ -\/]*[@-~]//g' npm-test.log > npm-test.normalized.log

          # Classification and reporting are two steps and the order is
          # load-bearing: classify first, annotate only a failure that was not
          # tolerated. A reporter cannot do this, because it emits during the run
          # and would annotate a run this guard later tolerates (#1206).
          #
          # The classifier is a whitelist: it tolerates only the one known-good
          # state and fails closed on everything else, including any error it
          # raises while deciding. It is an `if` condition, so `set -e` does not
          # abort the step when it says no.
          #
          # Temporary #480 guard: remove this block when the unhandled WebSocket rejection is fixed.
          if node scripts/classify-test-run.mjs npm-test-results.json npm-test.normalized.log; then
            echo "::warning::npm test is temporarily tolerated only for the known #480 unhandled WebSocket rejection signature. Remove this guard when #480 is fixed."
            exit 0
          fi

          # `|| true` is load-bearing: `set -e` is on again, and without it a throw
          # in the reporter would abort the step before `exit "$status"`, making the
          # reported cause the reporting defect instead of the failing test.
          node scripts/report-failed-tests.mjs npm-test-results.json || true

          # Deliberately does not promise annotations: an unusable report
          # legitimately produces none, and this line must be true in every branch.
          echo "::error::npm test failed and was not tolerated by the #480 guard. See any annotations above and the uploaded npm-test.log."
          exit "$status"

      - name: "Upload npm test diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-test-diagnostics
          path: |
            npm-test.log
            npm-test-results.json
          if-no-files-found: ignore

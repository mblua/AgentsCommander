[package]
name = "session-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures-util = "0.3"
portable-pty = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
base64 = "0.22"
sha1 = "0.10"

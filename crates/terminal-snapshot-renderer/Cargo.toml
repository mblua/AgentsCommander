[package]
name = "terminal-snapshot-renderer"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Bounded terminal snapshot protocol and deterministic renderer"

[lib]
doctest = false

[features]
default = ["protocol", "render"]
protocol = []
render = ["protocol", "dep:fontdue", "dep:sha2"]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "=1.5.0"
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
fontdue = { version = "=0.9.3", default-features = false, features = ["std"], optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
sha2 = "0.10"

[package]
name = "agentscommander-new"
version = "0.20.0"
edition = "2021"
authors = ["AgentsCommander Contributors"]
description = "AgentsCommander: Run multiple teams of AI coding agents"

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
croner = "3.0.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
base64 = "0.22"
getrandom = "=0.3.4"
terminal-snapshot-renderer = { path = "../crates/terminal-snapshot-renderer", features = ["render"] }
tokio-util = "0.7"
vt100 = "=0.15.2"
regex = "1"
toml = "0.8"
open = "5"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
futures = "0.3"
rfd = "0.15"
tauri-plugin-dialog = "2.6.0"
which = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# #714 Native screenshot capture is Windows-only for this issue. Non-Windows
# builds compile through the `screenshot::unsupported` stub and never link these.
[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
xcap = "0.9.6"
image = "0.25.10"
windows-sys = { version = "0.59", features = [
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
] }

[dev-dependencies]
syn = { version = "=2.0.117", features = ["full", "visit"] }
tempfile = "3"
tauri = { version = "2", features = ["image-png", "test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "agentscommander_lib"
crate-type = ["lib", "cdylib", "staticlib"]

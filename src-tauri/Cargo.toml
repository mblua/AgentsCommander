[package]
name = "agentscommander"
version = "0.48.0"
edition = "2024"
authors = ["AgentsCommander Contributors"]
description = "AgentsCommander: Run multiple teams of AI coding agents"

[lints]
workspace = true

[dependencies]
tauri = { version = "2.12.1", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10"
tokio = { version = "1", features = [
    "fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time",
] }
portable-pty = "=0.9.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
croner = "3.0.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "multipart"] }
base64 = "0.22"
getrandom = "=0.3.4"
terminal-snapshot-renderer = { path = "../crates/terminal-snapshot-renderer", features = ["render"] }
tokio-util = { version = "0.7", features = ["rt"] }
vt100 = "=0.15.2"
regex = "1"
toml = "0.8"
open = "5"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
futures = "0.3"
rfd = "0.15"
tauri-plugin-dialog = "2.6.0"
which = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# #714 (Windows), #1842 (Linux) and #2079 (macOS) native screenshot capture.
# One table so Cargo resolves identical versions and features on all three;
# every other target compiles the `screenshot::unsupported` stub and never
# links these.
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
xcap = "0.9.6"
image = "0.25.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
    "Wdk_System_SystemInformation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# #2774 Wayland portal; same version/features rfd already resolves
ashpd = { version = "=0.11.1", default-features = false, features = ["async-std"] }
# #4248 Linux WebView snapshot (window.snapshot) and examples/linux_snapshot; exact versions
# already locked via tauri/wry/gtk
webkit2gtk = "=2.0.2"
gio = "=0.18.4"
glib = "=0.18.5"
cairo-rs = { version = "=0.18.5", features = ["png"] }

# #2817 The reentrancy harness needs a real tao window on its own HWND. The
# default-features and the feature set are the same as what
# tauri-runtime-wry 2.12.1 requests (its Cargo.toml:78-81, which pins
# "0.37.0"), so Cargo unifies on one tao and this dev-dependency adds no
# feature to the normal build.
[target.'cfg(windows)'.dev-dependencies]
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
#4545 paused clock in tests; dev-only feature, not in the normal build (resolver 2)
tokio = { version = "1", features = ["test-util"] }
rust-source-scrub = { path = "../crates/rust-source-scrub" }
syn = { version = "=2.0.117", features = ["full", "visit"] }
tempfile = "3"
tauri = { version = "2.12.1", features = ["image-png", "test"] }
ts-rs = "=12.0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "agentscommander_lib"
crate-type = ["lib", "cdylib", "staticlib"]
